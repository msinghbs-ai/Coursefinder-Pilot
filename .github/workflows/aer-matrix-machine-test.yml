# Guards: F-AER.04 machine admission of country tables and qualification rows (Platform Admin decision D1, 11 Nov 2026) and G4 database-backed tests: migration 20261112093700 runs against the entry-matrix decision path, its decline reasons, validation gate, admission, withdrawal, isolation and forward recovery on an isolated PostgreSQL 16 (fixtures only, never a Supabase project).
name: AER matrix machine admission integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261112093700_cf247_aer_matrix_machine_admission.sql'
      - 'supabase/held/aer_matrix_machine_admission_forward_recovery.sql'
      - 'tests/fixtures/aer-matrix-machine/**'
      - 'tests/fixtures/aer-qualification-first/**'
      - 'supabase/migrations/20261112060000_cf247_aer_qualification_first.sql'
      - '.github/workflows/aer-matrix-machine-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/aer-matrix-machine/run.sh | tee aer-matrix-machine-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aer-matrix-machine-database-evidence
          path: aer-matrix-machine-results.log
