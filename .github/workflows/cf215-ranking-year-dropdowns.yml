name: CF-215 ranking year dropdown controls
on:
  push:
    paths: ['.github/workflows/cf215-ranking-year-dropdowns.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply bounded comparison ranking selector patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/ComparisonWorkspace.jsx')
          s=p.read_text()
          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              s=s.replace(old,new,1)

          once("[datasets,setDatasets]=useState({qilt:true,prisms:true,qs:false,the:false}),[year,setYear]=useState(''),[rankingYear,setRankingYear]=useState(''),[viewMode,setViewMode]",
               "[datasets,setDatasets]=useState({qilt:true,prisms:true,qs:false,the:false}),[year,setYear]=useState(''),[rankingSelection,setRankingSelection]=useState({qs:'',the:''}),[viewMode,setViewMode]",
               'state')

          once("const rankingYears=useMemo(()=>[...new Set(items.flatMap(e=>['qs_wur','the_wur'].flatMap(k=>(e.ranking_context?.[k]?.history||[]).map(x=>String(x.edition_year)))))].sort((a,b)=>Number(b)-Number(a)),[items])\n useEffect(()=>{if(year===''&&years.length)setYear(years[0])},[years.join('|')])\n useEffect(()=>{if(rankingYear===''&&rankingYears.length)setRankingYear(rankingYears[0])},[rankingYears.join('|')])\n const hasQS=items.some(e=>e.ranking_context?.qs_wur?.latest)\n const hasTHE=items.some(e=>e.ranking_context?.the_wur?.latest)",
               "const rankingYearsFor=system=>[...new Set(items.flatMap(e=>(e.ranking_context?.[system]?.history||[]).map(x=>String(x.edition_year))))].sort((a,b)=>Number(b)-Number(a))\n const qsRankingYears=useMemo(()=>rankingYearsFor('qs_wur'),[items])\n const theRankingYears=useMemo(()=>rankingYearsFor('the_wur'),[items])\n useEffect(()=>{if(year===''&&years.length)setYear(years[0])},[years.join('|')])\n useEffect(()=>{setRankingSelection(x=>({...x,qs:x.qs&&qsRankingYears.includes(x.qs)?x.qs:(qsRankingYears[0]||''),the:x.the&&theRankingYears.includes(x.the)?x.the:(theRankingYears[0]||'')}))},[qsRankingYears.join('|'),theRankingYears.join('|')])\n const hasQS=items.some(e=>e.ranking_context?.qs_wur?.latest)\n const hasTHE=items.some(e=>e.ranking_context?.the_wur?.latest)",
               'ranking years')

          once("function switchType(next){setQuery('');setSearchRows([]);setProviderQuery('');setProviderRows([]);setProviderId('');setProviderName('');setStudyLevel('');setYear('');setRankingYear('');commitSelection(next,[])}",
               "function switchType(next){setQuery('');setSearchRows([]);setProviderQuery('');setProviderRows([]);setProviderId('');setProviderName('');setStudyLevel('');setYear('');setRankingSelection({qs:'',the:''});commitSelection(next,[])}",
               'switch reset')

          old='''   <div className="cf-dataset-toggles">\n    <button className={datasets.qilt?'active':''} onClick={()=>setDatasets(x=>({...x,qilt:!x.qilt}))}>QILT</button>\n    <button className={datasets.prisms?'active':''} onClick={()=>setDatasets(x=>({...x,prisms:!x.prisms}))}>PRISMS</button>\n    <button disabled={!hasQS} className={datasets.qs?'active':''} onClick={()=>setDatasets(x=>({...x,qs:!x.qs}))}>{hasQS?'QS':'QS · unavailable'}</button>\n    <button disabled={!hasTHE} className={datasets.the?'active':''} onClick={()=>setDatasets(x=>({...x,the:!x.the}))}>{hasTHE?'THE':'THE · unavailable'}</button>\n   </div>\n   {viewMode==='snapshot'?<label>3. QILT year<select value={year} onChange={e=>setYear(e.target.value)}>{years.map((y,i)=><option key={y} value={y}>{y}{i===0?' · current':''}</option>)}</select></label>:<div className="cf-trend-note"><strong>Multi-year QILT</strong><span>Retained year-specific metric rows are shown together; narrow with category and study level.</span></div>}\n   {(hasQS||hasTHE)&&(viewMode==='snapshot'?<label>Ranking edition<select value={rankingYear} onChange={e=>setRankingYear(e.target.value)}>{rankingYears.map((y,i)=><option key={y} value={y}>{y}{i===0?' · current':''}</option>)}</select></label>:<div className="cf-trend-note"><strong>Multi-year rankings</strong><span>All retained QS/THE editions are shown by institution.</span></div>)}'''
          new='''   <div className="cf-dataset-toggles cf-dataset-toggles-with-years">\n    <button className={datasets.qilt?'active':''} onClick={()=>setDatasets(x=>({...x,qilt:!x.qilt}))}>QILT</button>\n    <button className={datasets.prisms?'active':''} onClick={()=>setDatasets(x=>({...x,prisms:!x.prisms}))}>PRISMS</button>\n    <div className={`cf-ranking-toggle ${datasets.qs?'active':''} ${!hasQS?'disabled':''}`}><button disabled={!hasQS} className={datasets.qs?'active':''} onClick={()=>setDatasets(x=>({...x,qs:!x.qs}))}>{hasQS?'QS':'QS · unavailable'}</button>{hasQS&&<label>Edition<select aria-label="QS ranking edition" value={rankingSelection.qs||qsRankingYears[0]||''} onChange={e=>setRankingSelection(x=>({...x,qs:e.target.value}))}><option value="multi">Multi-year</option>{qsRankingYears.map((y,i)=><option key={y} value={y}>{y}{i===0?' · latest':''}</option>)}</select></label>}</div>\n    <div className={`cf-ranking-toggle ${datasets.the?'active':''} ${!hasTHE?'disabled':''}`}><button disabled={!hasTHE} className={datasets.the?'active':''} onClick={()=>setDatasets(x=>({...x,the:!x.the}))}>{hasTHE?'THE':'THE · unavailable'}</button>{hasTHE&&<label>Edition<select aria-label="THE ranking edition" value={rankingSelection.the||theRankingYears[0]||''} onChange={e=>setRankingSelection(x=>({...x,the:e.target.value}))}><option value="multi">Multi-year</option>{theRankingYears.map((y,i)=><option key={y} value={y}>{y}{i===0?' · latest':''}</option>)}</select></label>}</div>\n   </div>\n   {viewMode==='snapshot'?<label>3. QILT year<select value={year} onChange={e=>setYear(e.target.value)}>{years.map((y,i)=><option key={y} value={y}>{y}{i===0?' · current':''}</option>)}</select></label>:<div className="cf-trend-note"><strong>Multi-year QILT</strong><span>Retained year-specific metric rows are shown together; narrow with category and study level.</span></div>}'''
          once(old,new,'config controls')

          once("{datasets.qs&&(viewMode==='trend'?<RankingTrend label=\"QS\" series={e.ranking_context?.qs_wur}/>:<RankingLine label=\"QS\" series={e.ranking_context?.qs_wur} edition={rankingYear}/>)}",
               "{datasets.qs&&(rankingSelection.qs==='multi'?<RankingTrend label=\"QS\" series={e.ranking_context?.qs_wur}/>:<RankingLine label=\"QS\" series={e.ranking_context?.qs_wur} edition={rankingSelection.qs}/>)}",
               'QS render')
          once("{datasets.the&&(viewMode==='trend'?<RankingTrend label=\"THE\" series={e.ranking_context?.the_wur}/>:<RankingLine label=\"THE\" series={e.ranking_context?.the_wur} edition={rankingYear}/>)}",
               "{datasets.the&&(rankingSelection.the==='multi'?<RankingTrend label=\"THE\" series={e.ranking_context?.the_wur}/>:<RankingLine label=\"THE\" series={e.ranking_context?.the_wur} edition={rankingSelection.the}/>)}",
               'THE render')

          once("<div className=\"cf-flow-title\"><div><h3>Institutional world rankings</h3><p>QS and THE remain independent ranking systems and are Provider context for Course comparisons.</p></div><span>Rankings</span></div>",
               "<div className=\"cf-flow-title\"><div><h3>Institutional world rankings</h3><p>QS and THE remain independent. Each enabled ranking uses its own edition selector; choose Multi-year only for that ranking when required.</p></div><span>Rankings</span></div>",
               'ranking description')

          once(".cf-dataset-toggles button:disabled{opacity:.48;cursor:not-allowed}.cf-compare-config label",
               ".cf-dataset-toggles button:disabled{opacity:.48;cursor:not-allowed}.cf-dataset-toggles-with-years{align-items:flex-start}.cf-ranking-toggle{display:grid;gap:5px;min-width:112px;padding:5px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}.cf-ranking-toggle.active{border-color:#a5b4fc;background:#eef2ff}.cf-ranking-toggle.disabled{opacity:.55}.cf-ranking-toggle>button{width:100%}.cf-ranking-toggle label{font-size:7px!important;color:#64748b!important}.cf-ranking-toggle select{margin-top:2px!important;padding:5px 6px!important;font-size:8px!important;background:#fff}.cf-compare-config label",
               'selector styles')

          p.write_text(s)
          PY
          grep -q 'QS ranking edition' src/ComparisonWorkspace.jsx
          grep -q 'THE ranking edition' src/ComparisonWorkspace.jsx
          grep -q '<option value="multi">Multi-year</option>' src/ComparisonWorkspace.jsx
          grep -q "rankingSelection.qs==='multi'" src/ComparisonWorkspace.jsx
          grep -q "rankingSelection.the==='multi'" src/ComparisonWorkspace.jsx
          ! grep -q 'rankingYear' src/ComparisonWorkspace.jsx
          rm .github/workflows/cf215-ranking-year-dropdowns.yml
          git config user.name coursefinder-cf215-bot
          git config user.email actions@users.noreply.github.com
          git add src/ComparisonWorkspace.jsx .github/workflows/cf215-ranking-year-dropdowns.yml
          git commit -m 'CF-215 add per-ranking year selectors to Compare'
          git push origin HEAD:main
