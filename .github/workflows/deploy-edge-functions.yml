# Deploy selected Supabase edge functions from the merged repository (no hand copying).
# Run manually: Actions > Deploy edge functions > Run workflow.
# Safety:
#  - only functions listed in .github/edge-functions.json can be deployed, each with its recorded verify_jwt setting;
#  - the target project must be typed and must match the repository variable
#    SUPABASE_PROJECT_REF (so the unrelated demo project can never be targeted by mistake);
#  - retired functions (delete_functions) can be deleted only from a fixed list, once their source is removed;
#  - v2.15.252 (Platform Admin, 12 Oct 2026): Layer 3 retired; its functions and binding contracts were removed from
#    this list (deleting the deployed copies is done separately by the Platform Admin).
# One-off setup: repository secret SUPABASE_ACCESS_TOKEN and variable SUPABASE_PROJECT_REF.
name: Deploy edge functions
on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Comma-separated function names (must be in .github/edge-functions.json); may be empty when only deleting"
        required: false
        default: ""
      delete_functions:
        description: "Optional: comma-separated retired functions to delete (must be on the retired list)"
        required: false
        default: ""
      project_ref:
        description: "Type the target project ref to confirm"
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm target project
        run: |
          if [ -z "${{ vars.SUPABASE_PROJECT_REF }}" ]; then echo "Repository variable SUPABASE_PROJECT_REF is not set"; exit 1; fi
          if [ "${{ inputs.project_ref }}" != "${{ vars.SUPABASE_PROJECT_REF }}" ]; then echo "Typed project ref does not match SUPABASE_PROJECT_REF"; exit 1; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0  # CF-247 Phase 5 (19 Oct 2026): pinned; "latest" failed on a GitHub API rate limit
      - name: Deploy
        # CF-247 Phase 3 (19 Oct 2026): the allow-list and each verify_jwt live in .github/edge-functions.json (shared with deploy-on-merge
        # and the daily drift check); the deploy itself is scripts/ci/deploy-function.sh.
        env:
          REF: ${{ inputs.project_ref }}
        run: |
          IFS=',' read -ra FNS <<< "${{ inputs.functions }}"
          for raw in "${FNS[@]}"; do
            fn="$(echo "$raw" | xargs)"
            [ -z "$fn" ] && continue
            scripts/ci/deploy-function.sh "$fn"
          done
      - name: Deployed versions
        if: ${{ inputs.functions != '' }}
        run: supabase functions list --project-ref "${{ inputs.project_ref }}" | grep -E "$(echo '${{ inputs.functions }}' | sed 's/ //g;s/,/|/g')" || true
      - name: Delete retired functions
        if: ${{ inputs.delete_functions != '' }}
        run: |
          # Only functions retired by a recorded decision can be deleted, and only once their source is gone from the repository.
          # CF-247 clean-up batch 1 (9 Oct 2026): 24 one-off probes, UAT gates and recovery functions, unused (no repo, database or cron reference).
          # CF-247 clean-up batch 2 (9 Oct 2026): the old data-admission system (Source profiles, one-off run builder, batch runner, scholarship scope jobs, layer3-interpret); their screens were removed.
          # CF-247 clean-up batch 4 (9 Oct 2026): dormant Layer 2 v2 extraction and scholarship catalogue functions (no caller since Aug 2026).
          # CF-247 Phase 5 (19 Oct 2026): 12 Canadian probe and audit stubs (410 only since CF-CHG-20260823-027) and 6 Layer 3 functions with no
          # source in git and no call since 11 Oct (Layer 3 retired in v2.15.252; their live source is kept on an edge-live-snapshot branch).
          RETIRED=" ranking-publisher-url-import ranking-qs-url-import ranking-the-url-import toolset-trial cf212-qs-endpoint-verify cf212-qs-evidence-upload cf212-qs-page-probe cf213-qs-meta-probe cf231-qs2026-revalidate-once cricos-depth-inspect layer1-au-full-gate layer1-depth-uat layer1-nz-gate-uat layer1-nz-source-inspect layer1-runtime-uat layer2-course-discover layer2-trial-control layer3-benchmark-go5 layer4-course-resolve ranking-qs-2027-binary-recovery ranking-qs-2027-publish-recovery ranking-qs-backfill-once ranking-qs-backfill-trigger-once ranking-qs-source-recovery ranking-qs-static-backfill-year ranking-qs-upload-recovery scholarship-course-fill-control search-vector-gate layer2-extract layer2-course-fact-extract layer3-interpret layer2-v2-diagnostic layer2-sync-control layer2-config-control layer2-acquire layer2-batch-runner layer2-scholarship-extract-v2 scholarship-scope-job-execute scholarship-runtime-control layer2-extract-v2 layer2-course-fact-extract-v2 layer2-scholarship-extract layer2-scholarship-catalogue-enumerate layer2-provider-page-fanout layer2-provider-asset-promote layer2-hotcourses-directory-parse layer2-acquire-v2 layer2-scope-discover-scheduled coursefacts-au-qut coursefacts-au-rmit coursefacts-au-uq layer2-scale-qualify-scheduled layer2-screenshot-backfill-scheduled layer3-source-pattern-benchmark layer1-au-completeness pilot-reset scholarships-au-etl scholarship-ai-control layer1-ca-ab-alis-probe layer1-ca-cpic-probe layer1-ca-ircc-nvit-probe layer1-ca-mb-designation-probe layer1-ca-qc-pdf-probe layer1-ca-qc-pdf-probe2 layer1-ca-sk-sitemap-probe layer1-ca-qc-audit layer1-ca-qc-parse-audit layer1-ca-qc-prefix-audit layer1-ca-qc-strict-audit layer1-ca-northern-code-audit layer3-cf245-tuition-benchmark layer3-contact-benchmark layer3-intake-benchmark layer3-model-routing layer3-work-dispatch layer3-work-interpret "
          IFS=',' read -ra FNS <<< "${{ inputs.delete_functions }}"
          for raw in "${FNS[@]}"; do
            fn="$(echo "$raw" | xargs)"
            case "$RETIRED" in *" $fn "*) ;; *) echo "Refused: $fn is not on the retired list"; exit 1;; esac
            if [ -e "supabase/functions/$fn" ]; then echo "Refused: supabase/functions/$fn still exists"; exit 1; fi
            echo "Deleting retired function $fn"
            supabase functions delete "$fn" --project-ref "${{ inputs.project_ref }}"
          done
