# Deploy selected Supabase edge functions from the merged repository (no hand copying).
# Run manually: Actions > Deploy edge functions > Run workflow.
# Safety:
#  - only functions on the allow-list below can be deployed, each with its recorded
#    verify_jwt setting (taken from the live project on 24 Sep 2026);
#  - the target project must be typed and must match the repository variable
#    SUPABASE_PROJECT_REF (so the unrelated demo project can never be targeted by mistake);
#  - retired functions (delete_functions) can be deleted only from a fixed list, once their source is removed;
#  - the Layer 3 binding contracts run first, so qualified code cannot deploy with a stale
#    manifest.
# One-off setup: repository secret SUPABASE_ACCESS_TOKEN and variable SUPABASE_PROJECT_REF.
name: Deploy edge functions
on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Comma-separated function names (must be on the allow-list)"
        required: true
      delete_functions:
        description: "Optional: comma-separated retired functions to delete (must be on the retired list)"
        required: false
        default: ""
      project_ref:
        description: "Type the target project ref to confirm"
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm target project
        run: |
          if [ -z "${{ vars.SUPABASE_PROJECT_REF }}" ]; then echo "Repository variable SUPABASE_PROJECT_REF is not set"; exit 1; fi
          if [ "${{ inputs.project_ref }}" != "${{ vars.SUPABASE_PROJECT_REF }}" ]; then echo "Typed project ref does not match SUPABASE_PROJECT_REF"; exit 1; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; fi
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Layer 3 binding contracts
        run: |
          deno test -A --no-check tests/cf247-tuition-validation-contract.test.ts
          deno test -A --no-check tests/cf247-tuition-benchmark-binding-contract.test.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          declare -A VERIFY_JWT=(
            [layer3-work-interpret]=false
            [layer3-cf245-tuition-benchmark]=false
            [layer3-work-dispatch]=false
            [wix-course-api]=false
            [website-course-api]=false
            [zoho-course-api]=false
            [evidence-link-index]=false
            [layer1-au-depth]=false
            [layer1-au-cricos-facts]=false
            [layer1-au-completeness]=false
            [layer1-operations-control]=false
            [layer1-nz-live]=true
            [layer1-ca-live]=true
            [layer1-register-etl]=true
            [evidence-storage-dedupe]=false
            [layer1-operations-scheduled]=false
            [ranking-publisher-control]=false
            [ranking-qs-official-etl]=true
            [ranking-layer1-etl]=true
            [qilt-au-etl]=false
            [prisms-au-etl]=false
            [statistics-edition-discovery]=false
            [fee-schedule-etl]=false
            [coverage-sweep]=false
            [layer3-intake-benchmark]=false
            [layer3-model-routing]=false
            [layer2-provider-control]=true
            # Decision 252: Serper and ScrapingBee sample runs (Platform Admin, user JWT)
            [toolset-runner]=false
            [layer2-acquire-v2]=false
            [layer2-scope-discover-scheduled]=false
            # Decision 216: background functions moved to one-time run passes (previously deployed by hand)
            [layer1-ca-ab-alis-degrees]=false
            [layer1-ca-algonquin-catalogue]=false
            [layer1-ca-bc-epbc-programs]=false
            [layer1-ca-cna-programs]=false
            # CF-247 (8 Oct 2026): previously deployed by hand; verify_jwt taken from the live project
            [layer1-ca-centennial-programs]=false
            [layer1-ca-fanshawe-programs]=false
            [layer1-ca-northern-programs]=false
            [layer1-ca-sault-programs]=false
            [layer1-ca-stlawrence-programs]=false
            [layer1-ca-conestoga-catalogue]=false
            [layer1-ca-durham-programs]=false
            [layer1-ca-fanshawe-pgwp]=false
            [layer1-ca-firstparty-catalogues]=false
            [layer1-ca-mb-programs]=false
            [layer1-ca-mohawk-catalogue]=false
            [layer1-ca-ns-sk-programs]=false
            [layer1-ca-on-college-programs]=false
            [layer1-ca-provider-geography]=false
            [layer1-ca-qc-university-programs]=false
            [layer1-ca-sk-programs]=false
            [layer2-batch-runner]=false
            [layer2-course-fact-extract-v2]=false
            [layer2-extract-v2]=false
            [layer2-hotcourses-directory-parse]=false
            [layer2-provider-asset-promote]=false
            [layer2-provider-page-fanout]=false
            [scholarships-au-etl]=false
            [layer2-scholarship-catalogue-enumerate]=false
            [layer2-scholarship-extract]=false
            [layer2-scholarship-extract-v2]=false
            [layer2-v2-diagnostic]=false
            [scholarship-scope-job-execute]=false
          )
          IFS=',' read -ra FNS <<< "${{ inputs.functions }}"
          for raw in "${FNS[@]}"; do
            fn="$(echo "$raw" | xargs)"
            if [ -z "${VERIFY_JWT[$fn]+x}" ]; then echo "Refused: $fn is not on the allow-list"; exit 1; fi
            if [ ! -f "supabase/functions/$fn/index.ts" ]; then echo "Missing supabase/functions/$fn/index.ts"; exit 1; fi
            flag=""; [ "${VERIFY_JWT[$fn]}" = "false" ] && flag="--no-verify-jwt"
            echo "Deploying $fn (verify_jwt=${VERIFY_JWT[$fn]})"
            supabase functions deploy "$fn" --project-ref "${{ inputs.project_ref }}" $flag
          done
      - name: Deployed versions
        run: supabase functions list --project-ref "${{ inputs.project_ref }}" | grep -E "$(echo '${{ inputs.functions }}' | sed 's/ //g;s/,/|/g')" || true
      - name: Delete retired functions
        if: ${{ inputs.delete_functions != '' }}
        run: |
          # Only functions retired by a recorded decision can be deleted, and only once their source is gone from the repository.
          # CF-247 clean-up batch 1 (9 Oct 2026): 24 one-off probes, UAT gates and recovery functions, unused (no repo, database or cron reference).
          RETIRED=" ranking-publisher-url-import ranking-qs-url-import ranking-the-url-import toolset-trial cf212-qs-endpoint-verify cf212-qs-evidence-upload cf212-qs-page-probe cf213-qs-meta-probe cf231-qs2026-revalidate-once cricos-depth-inspect layer1-au-full-gate layer1-depth-uat layer1-nz-gate-uat layer1-nz-source-inspect layer1-runtime-uat layer2-course-discover layer2-trial-control layer3-benchmark-go5 layer4-course-resolve ranking-qs-2027-binary-recovery ranking-qs-2027-publish-recovery ranking-qs-backfill-once ranking-qs-backfill-trigger-once ranking-qs-source-recovery ranking-qs-static-backfill-year ranking-qs-upload-recovery scholarship-course-fill-control search-vector-gate "
          IFS=',' read -ra FNS <<< "${{ inputs.delete_functions }}"
          for raw in "${FNS[@]}"; do
            fn="$(echo "$raw" | xargs)"
            case "$RETIRED" in *" $fn "*) ;; *) echo "Refused: $fn is not on the retired list"; exit 1;; esac
            if [ -e "supabase/functions/$fn" ]; then echo "Refused: supabase/functions/$fn still exists"; exit 1; fi
            echo "Deleting retired function $fn"
            supabase functions delete "$fn" --project-ref "${{ inputs.project_ref }}"
          done
