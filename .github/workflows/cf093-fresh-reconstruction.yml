name: CF-093 Fresh Reconstruction

on:
  push:
    branches:
      - m245/cf093-async-discovery-20260912
    paths:
      - '.github/workflows/cf093-fresh-reconstruction.yml'
      - 'supabase/migrations/*cf_093*.sql'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cf093-fresh-reconstruction.yml'
      - 'supabase/migrations/*cf_093*.sql'

permissions:
  contents: read

jobs:
  reconstruct-cf093:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout Pilot candidate
        uses: actions/checkout@v4

      - name: Create accepted-main CF-093 dependency fixture
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create schema extensions;
          create schema security;
          create schema pipeline;
          create schema catalogue;
          create schema ref;
          create extension if not exists pgcrypto with schema extensions;
          create or replace function extensions.gen_random_uuid() returns uuid language sql volatile as $$ select pg_catalog.gen_random_uuid() $$;
          create table security.roles(code text primary key, rank integer not null default 0, status text not null default 'active');
          create table security.user_roles(user_id uuid not null, role_code text not null, expires_at timestamptz);
          create table ref.countries(id uuid primary key default extensions.gen_random_uuid(), iso_alpha2 text, name text);
          create table ref.subdivisions(id uuid primary key default extensions.gen_random_uuid(), code text, name text);
          create table catalogue.providers(id uuid primary key default extensions.gen_random_uuid(), canonical_name text);
          create table catalogue.campuses(id uuid primary key default extensions.gen_random_uuid(), subdivision_id uuid);
          create table catalogue.courses(id uuid primary key default extensions.gen_random_uuid(), provider_id uuid, course_code text, canonical_title text, display_title text, course_url text);
          create table catalogue.course_campuses(course_id uuid, campus_id uuid);
          create table pipeline.sources(id uuid primary key default extensions.gen_random_uuid(), provider_id uuid, country_id uuid);
          create table pipeline.jobs(id uuid primary key default extensions.gen_random_uuid(), job_type text, domain text, status text, requested_by uuid, started_at timestamptz, completed_at timestamptz, payload jsonb not null default '{}'::jsonb, result jsonb not null default '{}'::jsonb, error text, attempt_count integer not null default 0, created_at timestamptz not null default now());
          create table pipeline.layer2_source_profiles(id uuid primary key default extensions.gen_random_uuid(), profile_key text not null unique, source_id uuid, domain text not null, freshness_sla_hours integer, schedule_text text, current_version_id uuid, enabled boolean not null default true, paused boolean not null default false, updated_at timestamptz not null default now());
          create table pipeline.layer2_source_profile_versions(id uuid primary key default extensions.gen_random_uuid(), profile_id uuid not null references pipeline.layer2_source_profiles(id) on delete cascade, version_no integer not null check(version_no>0), configuration jsonb not null default '{}'::jsonb, configuration_hash text not null, validation_status text not null default 'pending', validation_result jsonb not null default '{}'::jsonb, change_control_ref text, uat_ref text, created_at timestamptz not null default now(), unique(profile_id,version_no), unique(profile_id,configuration_hash));
          alter table pipeline.layer2_source_profiles add constraint layer2_profiles_current_version_fk foreign key(current_version_id) references pipeline.layer2_source_profile_versions(id) on delete restrict;
          create table pipeline.layer2_acquisition_providers(id uuid primary key default extensions.gen_random_uuid(), provider_key text not null unique, display_name text not null, adapter_type text not null, base_url text, auth_scheme text not null default 'none', auth_field_name text, vault_secret_id uuid, capabilities jsonb not null default '{}'::jsonb, request_template jsonb not null default '{}'::jsonb, enabled boolean not null default true, priority integer not null default 100, rate_limit_per_minute integer, concurrency integer not null default 1, timeout_seconds integer not null default 30, last_tested_at timestamptz, last_test_status text, last_test_http_status integer, last_test_error text, operational_owner text, change_control_ref text not null, created_at timestamptz not null default now(), updated_at timestamptz not null default now());
          create table pipeline.layer2_profile_provider_routes(id uuid primary key default extensions.gen_random_uuid(), profile_id uuid not null references pipeline.layer2_source_profiles(id) on delete cascade, acquisition_provider_id uuid not null references pipeline.layer2_acquisition_providers(id) on delete restrict, priority integer not null, enabled boolean not null default true, required_capabilities jsonb not null default '{}'::jsonb, request_overrides jsonb not null default '{}'::jsonb, evidence_policy jsonb not null default '{"capture_raw":true,"capture_html":true,"capture_screenshot_on_failure":true}'::jsonb, fallback_on jsonb not null default '["blocked","timeout","403","429","extraction_failed"]'::jsonb, change_control_ref text not null, created_at timestamptz not null default now(), updated_at timestamptz not null default now(), unique(profile_id,acquisition_provider_id), unique(profile_id,priority));
          create table pipeline.layer2_course_discovery_candidates(id uuid primary key default extensions.gen_random_uuid(), course_id uuid, source_profile_version_id uuid, provider_attempt_id uuid, evidence_id uuid, discovered_url text, discovered_title text, discovered_regulatory_code text, match_score numeric, match_basis jsonb not null default '{}'::jsonb, status text, selected boolean not null default false, blocker text, created_at timestamptz not null default now());
          create table pipeline.layer2_provider_attempts(id uuid primary key default extensions.gen_random_uuid(), job_id uuid, status text, extraction_status text, metrics jsonb not null default '{}'::jsonb, created_at timestamptz not null default now());
          create table pipeline.layer2_run_batches(id uuid primary key default extensions.gen_random_uuid(), profile_id uuid, status text, created_at timestamptz not null default now(), completed_at timestamptz);
          create table pipeline.layer2_run_items(id uuid primary key default extensions.gen_random_uuid(), batch_id uuid, status text, created_at timestamptz not null default now(), completed_at timestamptz);
          create or replace function security.current_role_rank() returns integer language sql stable as $$ select 4 $$;
          create or replace function security.scheduler_workflow_https_host_v1(text) returns text language sql immutable as $$ select 'example.edu'::text $$;
          create or replace function security.scheduler_workflow_queueable_url_allowed_v1(uuid,text) returns boolean language sql immutable as $$ select true $$;
          create or replace function security.scheduler_workflow_execution_policy_gap_count_v1(text,text,uuid) returns integer language sql stable as $$ select 0 $$;
          create or replace function security.scheduler_workflow_oversized_profile_count_v1(text,text,uuid) returns integer language sql stable as $$ select 0 $$;
          create or replace function security.scheduler_workflow_route_gap_count_v1(text,text,uuid) returns integer language sql stable as $$ select 0 $$;
          create or replace function security.scheduler_workflow_recent_terminal_negative_v1(uuid,uuid) returns boolean language sql stable as $$ select false $$;
          create or replace function security.scheduler_workflow_scope_snapshot_v2(text,text,uuid) returns jsonb language sql stable as $$ select jsonb_build_object('profile_ids','[]'::jsonb,'scope_fingerprint','fixture','scoped_course_count',0,'queueable_count',0,'needs_discovery_count',0) $$;
          create or replace function public.layer2_provider_runtime_config(uuid) returns jsonb language sql stable as $$ select '{}'::jsonb $$;
          create or replace function public.layer2_scope_courses(text,text,uuid) returns table(profile_id uuid,profile_key text,provider_id uuid,provider_name text,course_id uuid,source_url text) language sql stable as $$ select null::uuid,null::text,null::uuid,null::text,null::uuid,null::text where false $$;
          create or replace function public.layer2_run_batch_create(uuid,text,uuid,jsonb) returns uuid language sql as $$ select extensions.gen_random_uuid() $$;
          create or replace function public.layer2_run_batch_dispatch(uuid) returns bigint language sql as $$ select 1::bigint $$;
          create or replace function public.layer2_operator_scope_service(uuid,text,text,text,uuid) returns jsonb language sql as $$ select '{}'::jsonb $$;
          create or replace function security.layer2_validate_profile_config(p_config jsonb) returns jsonb language plpgsql stable set search_path='pg_catalog','security' as $$ declare v_errors jsonb := '[]'::jsonb; v_method text := coalesce(p_config->>'acquisition_method',''); v_target text := coalesce(p_config->>'target_entity_type',''); begin if v_method not in ('website','course_catalogue','course_detail','fee_schedule','intake_calendar','english_requirements','scholarship_catalogue','document','structured_api','json_endpoint','csv_feed','xlsx_feed','sitemap','search_endpoint','other_deterministic') then v_errors := v_errors || jsonb_build_array('unsupported acquisition_method'); end if; if v_target not in ('provider','course','campus','scholarship','provider_outcome','student_flow','course_fact','mixed') then v_errors := v_errors || jsonb_build_array('unsupported target_entity_type'); end if; return jsonb_build_object('valid',jsonb_array_length(v_errors)=0,'errors',v_errors,'validated_at',now()); end $$;
          do $$ declare v_provider uuid := '00000000-0000-0000-0000-000000000025'::uuid; v_source uuid := '00000000-0000-0000-0000-000000000026'::uuid; v_profile uuid := 'c7976665-14f3-40ac-834b-a8ee1c8afc32'::uuid; v_version uuid := '1f6c4e75-538a-4087-a721-c9087b5a3ae0'::uuid; v_cfg jsonb := $cfg${"retry":{"backoff":"exponential","max_attempts":3},"headers":{"user_agent":"CourseFinder deterministic acquisition"},"schedule":"manual/governed","pagination":{"mode":"source_specific"},"base_domain":"\\1","concurrency":2,"url_patterns":["https://study.uq.edu.au/study-options/programs"],"discovery_url":"https://study.uq.edu.au/study-options/programs","robots_policy":"respect","authentication":{"mechanism":"none_or_server_secret_reference"},"max_payload_mb":25,"parser_profile":"deterministic-v1","exclusion_rules":[],"inclusion_rules":[],"timeout_seconds":30,"mapping_strategy":"stable Layer 1 course match; exact regulatory code where available","source_authority":"official/first-party deterministic enrichment","evidence_required":true,"operational_owner":"PIM/Data Operations","acquisition_method":"course_catalogue","allowed_mime_types":["text/html","application/json"],"change_control_ref":"CF-CHG-20260823-029","target_entity_type":"course_fact","freshness_sla_hours":168,"content_change_policy":"hash_then_observe_never_direct_canonical_mutation","rate_limit_per_minute":60,"regulatory_code_extraction":{"nzqa":null,"cricos":"00025B"},"stable_identifier_strategy":"exact_cricos_course_code"}$cfg$::jsonb; v_hash text; begin insert into catalogue.providers(id,canonical_name) values(v_provider,'The University of Queensland'); insert into pipeline.sources(id,provider_id) values(v_source,v_provider); v_hash:=encode(extensions.digest(v_cfg::text,'sha256'),'hex'); if v_hash <> '77dda7fa33501c67a046dff1e5385554a419853c64f12f5b56e1c23a63da0d72' then raise exception 'historical UQ v1 fixture hash drifted: %',v_hash; end if; insert into pipeline.layer2_source_profiles(id,profile_key,source_id,domain,freshness_sla_hours,schedule_text) values(v_profile,'au-uq-course-catalogue',v_source,'course_facts',168,'manual/governed'); insert into pipeline.layer2_source_profile_versions(id,profile_id,version_no,configuration,configuration_hash,validation_status,validation_result,change_control_ref,uat_ref) values(v_version,v_profile,1,v_cfg,v_hash,'valid',security.layer2_validate_profile_config(v_cfg),'CF-CHG-20260823-029','M2.1-foundation'); update pipeline.layer2_source_profiles set current_version_id=v_version where id=v_profile; end $$;
          SQL

      - name: Replay complete ordered CF-093 PR migration chain
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            supabase/migrations/20260911231544_cf_093_scheduler_preview_bound_async_discovery.sql
            supabase/migrations/20260911231600_cf_093_scheduler_async_binding_found_state_fix.sql
            supabase/migrations/20260911231845_cf_093_scheduler_async_binding_cancel_failclosed.sql
            supabase/migrations/20260911232205_cf_093_scheduler_retry_context_and_token_chain.sql
            supabase/migrations/20260911232239_cf_093_scheduler_bound_discovery_context_retry.sql
            supabase/migrations/20260912005000_cf_093_uq_discovery_strategy_reconstruction_bootstrap.sql
            supabase/migrations/20260912005948_cf_093_uq_native_program_discovery_profile.sql
            supabase/migrations/20260912010128_cf_093_scheduler_async_binding_operator_cancel.sql
            supabase/migrations/20260912010439_cf_093_uq_program_card_title_normalisation.sql
            supabase/migrations/20260912010805_cf_093_uq_exact_program_card_preference.sql
            supabase/migrations/20260912012541_cf_093_scheduler_terminal_negative_subset_handoff.sql
            supabase/migrations/20260912031356_cf_093_scheduler_terminal_negative_freshness_dedupe.sql
            supabase/migrations/20260912031504_cf_093_scheduler_terminal_negative_same_attempt_fix.sql
            supabase/migrations/20260912031648_cf_093_scheduler_preview_context_binding_isolation.sql
            supabase/migrations/20260912031736_cf_093_scheduler_terminal_negative_exact_scope_accounting.sql
            supabase/migrations/20260912035500_cf_093_scheduler_completion_anchored_dedupe.sql
            supabase/migrations/20260912100539_cf_093_codex_async_token_identity_dedupe_hardening.sql
            supabase/migrations/20260912101339_cf_093_terminal_negative_basis_hardening.sql
            supabase/migrations/20260912232827_cf_093_preview_provenance_terminal_dedupe_hardening.sql
            supabase/migrations/20260913015530_cf_093_scheduler_preview_set_based_terminal_optimization.sql
            supabase/migrations/20260913020222_cf_093_scheduler_route_gap_scope_optimization.sql
            supabase/migrations/20260913020646_cf_093_scheduler_run_bridge_acl_reconcile.sql
          )
          for migration in "${migrations[@]}"; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify reconstructed CF-093 state
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -Atc "select count(*) from pipeline.layer2_source_profile_versions where profile_id='c7976665-14f3-40ac-834b-a8ee1c8afc32'::uuid")" = "5"
          test "$(psql -Atc "select count(distinct configuration_hash) from pipeline.layer2_source_profile_versions where profile_id='c7976665-14f3-40ac-834b-a8ee1c8afc32'::uuid")" = "5"
          test "$(psql -Atc "select configuration#>>'{discovery_strategy,type}' from pipeline.layer2_source_profile_versions v join pipeline.layer2_source_profiles p on p.current_version_id=v.id where p.profile_key='au-uq-course-catalogue'")" = "first_party_search"
          test "$(psql -Atc "select configuration#>>'{discovery_strategy,query_field}' from pipeline.layer2_source_profile_versions v join pipeline.layer2_source_profiles p on p.current_version_id=v.id where p.profile_key='au-uq-course-catalogue'")" = "canonical_title_normalized"
          test "$(psql -Atc "select configuration#>>'{discovery_strategy,require_url_prefix}' from pipeline.layer2_source_profile_versions v join pipeline.layer2_source_profiles p on p.current_version_id=v.id where p.profile_key='au-uq-course-catalogue'")" = "/study-options/programs/"
          test "$(psql -Atc "select to_regclass('pipeline.scheduler_workflow_async_bindings') is not null")" = "t"
          psql -Atc "select pg_get_functiondef('public.layer2_scope_profile_batch_service(uuid,uuid,uuid[])'::regprocedure)" | grep -F 'exact scheduler Preview binding is missing, cancelled, expired or does not match the handoff scope'
          psql -Atc "select pg_get_functiondef('security.scheduler_workflow_dispatch_dedupe_anchor_v1(jsonb,timestamptz)'::regprocedure)" | grep -F 'discovery_started'
          echo 'CF-093 full ordered PR migration reconstruction PASS.'