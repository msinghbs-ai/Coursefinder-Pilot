# Guards: Provider Description autonomy mandate (4 November 2026), isolated development acceptance only.
name: Provider description isolated acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-description:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      scratch-pg:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local tooling
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Reconstruct production contracts and exercise isolated PostgreSQL
        run: bash tests/fixtures/provider-description-autonomy/run.sh
      - name: Held reads retried on a changed official copy; whole-catalogue funnel (scratch PostgreSQL 16)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
        run: bash tests/fixtures/pdesc-retry-funnel/run.sh
      - name: A provider with no description is selected again after an admitted read (scratch PostgreSQL 16)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
        run: bash tests/fixtures/pdesc-self-driving/run.sh
      - name: Machine admission, register-fact tier, whole-platform queue (scratch PostgreSQL 16)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
        run: bash tests/fixtures/pdesc-machine/run.sh
      - name: Neutral population words allowed in context by the machine admission rule (scratch PostgreSQL 16)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
        run: bash tests/fixtures/pdesc-claim-context/run.sh
      - name: Operate actual SQL workflow on desktop and phone
        run: npx playwright test --config=playwright.provider-description.config.mjs
      - name: Source quality, navigation and standing governance guards
        run: >-
          npx playwright test
          tests/uat/provider-description-source-identity.spec.mjs
          tests/uat/provider-description-navigation.spec.mjs
          tests/uat/provider-description-navigation-ui.spec.mjs
          tests/uat/cf-247-s216-p1-provider-descriptions-contract.spec.mjs
          tests/uat/cf-247-s460-pdesc-retry-and-funnel-contract.spec.mjs
          tests/uat/cf-247-s500-pdesc-self-driving-contract.spec.mjs
          tests/uat/cf-247-s501-pdesc-machine-admission-contract.spec.mjs
          tests/uat/cf-247-s515-pdesc-quote-fragments-setting-contract.spec.mjs
          tests/uat/cf-247-s504-pdesc-claim-word-context-contract.spec.mjs
          tests/uat/cf-247-s32-controls-in-settings-contract.spec.mjs
          tests/uat/cf-247-s42-housekeeping-contract.spec.mjs
          tests/uat/cf-247-s57-consumer-api-frozen.spec.mjs
          tests/uat/cf-247-s120-test-governance-contract.spec.mjs
          --output=uat-artifacts/provider-description-guard-results
      - name: Build and validate UI tokens
        run: npm run build && npm run ui:tokens
      - name: Save isolated acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-description-isolated-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            uat-artifacts/provider-description-db-results/
            uat-artifacts/provider-description-integration.json
            uat-artifacts/provider-description-guard-results/
            docs/ui-evidence/provider-description-*
