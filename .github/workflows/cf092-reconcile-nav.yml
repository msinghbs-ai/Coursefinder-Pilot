name: CF-092 reconcile and move Scheduled Tasks nav
on:
  push:
    branches: [feature/m245-scheduled-jobs-config-20260910]
    paths: [.github/workflows/cf092-reconcile-nav.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m245-scheduled-jobs-config-20260910
          fetch-depth: 0
      - name: Reconcile current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
      - name: Move Scheduled Tasks to primary nav and clean Administration footprint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/mature-main.jsx')
          s=p.read_text()
          replacements=[
            ("item('Layer 4 — Human Resolution',ListChecks,3),item('Evidence',BookOpen,3),item('Jobs',Workflow,4),",
             "item('Layer 4 — Human Resolution',ListChecks,3),item('Scheduled Tasks',Clock3,4),item('Evidence',BookOpen,3),item('Jobs',Workflow,4),"),
            ("  Evidence:['Evidence & provenance','Source snapshots, evidence artifacts and canonical consequences.'],",
             "  'Scheduled Tasks':['Scheduled Tasks','Governed Layer 1–3 schedules, on-demand due-work control, queues and run follow-through.'],\n  Evidence:['Evidence & provenance','Source snapshots, evidence artifacts and canonical consequences.'],"),
            (" {key:'scheduling',label:'Scheduling',Icon:RefreshCw,min:4,group:'Operations',description:'Refresh cadence, targeted scheduling and due-work policy.'},\n", ""),
            (",item('Refresh & Scheduling',RefreshCw,3)", ""),
            ("  'Refresh & Scheduling':['Refresh & Scheduling','Targeted refresh policies, queues and downstream signals.'],\n", ""),
            ("if(page==='Refresh & Scheduling'&&rank>=3)return <div className=\"m-page-stack\"><RefreshWorkspace onError={e=>onError(e?.message||String(e))}/></div>",
             "if(page==='Scheduled Tasks'&&rank>=4)return <div className=\"m-page-stack\"><RefreshWorkspace onError={e=>onError(e?.message||String(e))}/></div>"),
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit(f'missing expected source fragment: {old[:120]}')
            s=s.replace(old,new,1)
          # Remove any Administration section render branch that still binds scheduling.
          import re
          s,n=re.subn(r"\s*if\(tool==='scheduling'\)return <RefreshWorkspace[^\n]*\n", "\n", s, count=1)
          if n==0:
            s,n=re.subn(r"\s*tool==='scheduling'\?\s*<RefreshWorkspace[^:]+:\s*", "", s, count=1)
          p.write_text(s)

          p=Path('tests/uat/cf-092-scheduled-jobs-config-deployed.spec.mjs')
          t=p.read_text()
          old="""    await clickPrimaryNav(page,'Administration')
    await expect(page.getByRole('heading',{name:'Administration overview',exact:true})).toBeVisible({timeout:DETERMINISTIC_UI_TIMEOUT})
    await page.getByRole('tab',{name:'Scheduling',exact:true}).click()
    await expect(page.getByRole('heading',{name:'Scheduled Jobs & Run Control',exact:true})).toBeVisible({timeout:DETERMINISTIC_UI_TIMEOUT})"""
          new="""    await clickPrimaryNav(page,'Scheduled Tasks')
    await expect(page.getByRole('heading',{name:'Scheduled Jobs & Run Control',exact:true})).toBeVisible({timeout:DETERMINISTIC_UI_TIMEOUT})
    await expect(page.getByRole('navigation').getByText('Scheduled Tasks',{exact:true}).first()).toBeVisible()
    await clickPrimaryNav(page,'Administration')
    await expect(page.getByRole('heading',{name:'Administration overview',exact:true})).toBeVisible({timeout:DETERMINISTIC_UI_TIMEOUT})
    await expect(page.getByRole('tab',{name:'Scheduling',exact:true})).toHaveCount(0)
    await clickPrimaryNav(page,'Scheduled Tasks')
    await expect(page.getByRole('heading',{name:'Scheduled Jobs & Run Control',exact:true})).toBeVisible({timeout:DETERMINISTIC_UI_TIMEOUT})"""
          if old not in t: raise SystemExit('missing deployed UAT Administration scheduling fragment')
          p.write_text(t.replace(old,new,1))

          p=Path('CHANGELOG.md')
          c=p.read_text()
          c=c.replace('Added Administration Scheduling controls with operator-friendly schedule columns, schedule editing, bounded Layer 1–3 on-demand queueing, and direct Jobs/Evidence follow-through.',
                      'Added a primary Scheduled Tasks workspace immediately before Evidence, with operator-friendly schedule columns, schedule editing, bounded Layer 1–3 due-now control, and direct Jobs/Evidence follow-through; removed the duplicate Scheduling entry from Administration.')
          c=c.replace('Added a rank-gated `scheduler_policy_control` mutation that mirrors governed scheduler targets and explicitly does not provide generic historical retry/replay/reset.',
                      'Reused the accepted `refresh_policy_upsert_v2` authority boundary for schedule edits and due-now requests; no new scheduler mutation RPC or generic historical retry/replay/reset was introduced.')
          p.write_text(c)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/cf092-reconcile-nav.yml
          git add -A
          git commit -m "CF-092 move Scheduled Tasks to primary navigation"
          git push origin HEAD:feature/m245-scheduled-jobs-config-20260910
