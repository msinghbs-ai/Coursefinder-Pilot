# Production-parity tool (decision 19:14 §8, Platform Admin 5 Nov 2026; agent E). Round trip on an isolated PostgreSQL 17.6 (production runs
# 17.6): capture -> md5-verified manifest -> fixture -> read-only check, a simplified fixture caught fact by fact, and the committed production
# manifests rebuilt and checked, including the two operations production rejected in the intake releases. Never connects to Supabase.
name: Production parity tool
on:
  pull_request:
    paths:
      - 'scripts/prod-parity*.mjs'
      - 'tests/fixtures/prod-parity/**'
      - 'tests/uat/cf-247-s310-prod-parity-tool-contract.spec.mjs'
      - '.github/workflows/prod-parity.yml'
      - 'tests/fixtures/course-text/**'
      - 'tests/uat/cf-247-s233-course-description-deadline-contract.spec.mjs'
      - 'supabase/migrations/20261106450000_cf247_deadline_closing_semantics.sql'
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  prod-parity-round-trip:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
      volumes:
        - prod-parity-fixture-socket:/var/run/postgresql
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        volumes:
          - prod-parity-fixture-socket:/var/run/postgresql
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: /var/run/postgresql
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the isolated PostgreSQL client
        run: |
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client
      - name: Execute the complete production parity round trip
        run: |
          set -euo pipefail
          bash tests/fixtures/prod-parity/run.sh 2>&1 | tee prod-parity-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-parity-evidence
          path: prod-parity-results.log

  # Guards: Admin #382 P0 deadline semantics (6 Nov 2026). Extends the existing
  # deadline fixture/spec; no production credentials, new framework or admission.
  deadline-semantics:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
      volumes:
        - deadline-fixture-socket:/var/run/postgresql
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        volumes:
          - deadline-fixture-socket:/var/run/postgresql
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: /var/run/postgresql
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated PostgreSQL client and existing test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Execute the existing course-text admission fixture on PostgreSQL 17.6
        run: |
          set -euo pipefail
          mkdir -p uat-artifacts
          bash tests/fixtures/course-text/run.sh 2>&1 | tee uat-artifacts/deadline-semantics-postgres.log
      - name: Existing deadline and governance contracts
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: uat-artifacts/deadline-targeted-results.json
        run: >-
          npx playwright test
          tests/uat/cf-247-s233-course-description-deadline-contract.spec.mjs
          tests/uat/cf-247-s32-controls-in-settings-contract.spec.mjs
          tests/uat/cf-247-s42-housekeeping-contract.spec.mjs
          tests/uat/cf-247-s57-consumer-api-frozen.spec.mjs
          --project=chromium-desktop --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deadline-semantics-${{ github.sha }}
          path: uat-artifacts/
          if-no-files-found: error
