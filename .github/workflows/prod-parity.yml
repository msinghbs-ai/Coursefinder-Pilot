# Production-parity tool (decision 19:14 §8, Platform Admin 5 Nov 2026; agent E). Round trip on an isolated PostgreSQL 17.6 (production runs
# 17.6): capture -> md5-verified manifest -> fixture -> read-only check, a simplified fixture caught fact by fact, and the committed production
# manifests rebuilt and checked, including the two operations production rejected in the intake releases. Never connects to Supabase.
name: Production parity tool
on:
  pull_request:
    paths:
      - 'scripts/prod-parity*.mjs'
      - 'tests/fixtures/prod-parity/**'
      - 'tests/fixtures/integration-queue/**'
      - 'tests/uat/cf-247-s223-integration-queue-contract.spec.mjs'
      - 'tests/uat/cf-247-s310-prod-parity-tool-contract.spec.mjs'
      - '.github/workflows/prod-parity.yml'
  workflow_dispatch:
jobs:
  prod-parity-round-trip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Production parity round trip
        shell: bash
        run: |
          set -euo pipefail
          bash tests/fixtures/prod-parity/run.sh | tee prod-parity-results.log
      # Guards: IQ-00112 collector recovery, Admin ff7ef0a2e63ca68b6333cfc4ab0fabb311b4f559. Simulated transport only; never production delivery.
      - name: Alert collector protocol on isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          bash tests/fixtures/integration-queue/run.sh | tee integration-queue-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-parity-evidence
          path: |
            prod-parity-results.log
            integration-queue-results.log
