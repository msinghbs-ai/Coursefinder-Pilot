# Component register (CF-247 Decision 260, 15 Oct 2026). Daily: records which edge functions were called (Supabase logs, last 24 hours),
# brings the register up to date with the edge functions and screens in this repository and the live jobs, tables and views, and commits
# the generated document to the branch component-register-snapshot (never merged; copied into the admin repository with change-control entries).
# Uses the same secret and project-ref variable as the other database workflows.
name: Component register
on:
  schedule:
    - cron: "40 21 * * *"
  workflow_dispatch:
jobs:
  register:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        run: |
          if [ -z "$REF" ]; then echo "Repository variable SUPABASE_PROJECT_REF is not set"; exit 1; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; fi
      - name: Edge function calls in the last 24 hours (logs)
        run: |
          sql="select extract(log_attributes['request.pathname'], '^/functions/v1/([^/?]+)') fn, count(*) n, max(timestamp) last from logs where source = 'function_edge_logs' group by fn"
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ); start=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl -sS -G -o "$RUNNER_TEMP/calls.json" -w '%{http_code}' "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs.all" \
            --data-urlencode "sql=$sql" --data-urlencode "iso_timestamp_start=$start" --data-urlencode "iso_timestamp_end=$end" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "Logs query failed ($code); usage not recorded this run"; echo '{}' > "$RUNNER_TEMP/calls.json"; fi
          echo "Edge functions called: $(jq '.result | length' "$RUNNER_TEMP/calls.json" 2>/dev/null || echo 0)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Update the register
        run: |
          node scripts/component-register-collect.mjs "$RUNNER_TEMP/calls.json" > "$RUNNER_TEMP/payload.json"
          payload=$(jq -c . "$RUNNER_TEMP/payload.json" | sed "s/'/''/g")
          printf '%s' "select security.component_register_ingest_v1('$payload'::jsonb) as ingest, security.component_register_sync_v1() as sync" > "$RUNNER_TEMP/q.sql"
          jq -n --rawfile q "$RUNNER_TEMP/q.sql" '{query:$q}' > "$RUNNER_TEMP/q.json"
          code=$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @"$RUNNER_TEMP/q.json")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "Register update failed ($code)"; head -c 500 "$RUNNER_TEMP/out.json"; exit 1; fi
          jq -c '.[0]' "$RUNNER_TEMP/out.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generate the document
        run: |
          jq -n '{query:"select security.component_register_markdown_v1() as md", read_only:true}' > "$RUNNER_TEMP/m.json"
          code=$(curl -sS -o "$RUNNER_TEMP/md.json" -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @"$RUNNER_TEMP/m.json")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "Document query failed ($code)"; head -c 500 "$RUNNER_TEMP/md.json"; exit 1; fi
          jq -r '.[0].md' "$RUNNER_TEMP/md.json" > "$RUNNER_TEMP/COMPONENT-REGISTER.md"
          wc -l "$RUNNER_TEMP/COMPONENT-REGISTER.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit to the snapshot branch
        run: |
          git config user.name "component-register"; git config user.email "component-register@users.noreply.github.com"
          git checkout -B component-register-snapshot
          mkdir -p docs/platform; cp "$RUNNER_TEMP/COMPONENT-REGISTER.md" docs/platform/COMPONENT-REGISTER.md
          git add docs/platform/COMPONENT-REGISTER.md
          git commit -m "Component register snapshot $(date -u +%Y-%m-%d)" || echo "No change"
          git push -f origin component-register-snapshot
