name: CF-213 export placement correction

on:
  push:
    paths:
      - '.github/workflows/cf213-ui-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct CF-213 export placement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/mature-main.jsx')
          s=p.read_text()
          export="<button className=\"m-link-button\" disabled={processingId===x.id} onClick={async()=>{try{const{data,error}=await supabase.functions.invoke('ranking-evidence-export',{body:{system_code:x.system_code,edition_year:Number(x.edition_year),import_id:x.id}});if(error)throw error;if(!data?.signed_url)throw new Error('Exportable XLSX Evidence not found');const a=document.createElement('a');a.href=data.signed_url;a.download=data.filename||'';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}catch(e){setSaved(`Export failed: ${e.message||String(e)}`)}}}>Export XLSX</button>"
          if s.count(export)!=1:
              raise SystemExit(f'expected one misplaced export button, found {s.count(export)}')
          s=s.replace(export,'',1)
          row_jobs="<button className=\"m-secondary compact\" onClick={()=>navigate?.('Jobs')}>Jobs{Number(x.job_count||0)>0?' ('+x.job_count+')':''}</button>"
          if s.count(row_jobs)!=1:
              raise SystemExit(f'expected one row Jobs button, found {s.count(row_jobs)}')
          s=s.replace(row_jobs,export+row_jobs,1)
          # Assert x-dependent export now appears only after map(x=> begins.
          pos=s.find(export)
          map_pos=s.rfind('.map(x=>',0,pos)
          article_pos=s.rfind('<article key={x.id}',0,pos)
          if map_pos<0 or article_pos<0:
              raise SystemExit('export button is not inside ranking import row map')
          p.write_text(s)
          PY
          grep -q "Publisher URL → Evidence XLSX" src/mature-main.jsx
          grep -q "QS publisher URL" src/mature-main.jsx
          grep -q "Export XLSX" src/mature-main.jsx
          rm .github/workflows/cf213-ui-fix.yml
          git config user.name "coursefinder-cf213-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/mature-main.jsx .github/workflows/cf213-ui-fix.yml
          git commit -m "CF-213 place XLSX Evidence export on ranking import rows"
          git push origin HEAD:main
