# Guards: Platform Admin 13 Nov 2026 19:14 (AI spend control: one model list, service routes with cascade and caps, usage by model) and G4 database-backed tests: migration 20261113380000 on an isolated PostgreSQL 16 (fixtures only, never a Supabase project).
name: AI models and services integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261113380000_cf247_ai_models_services.sql'
      - 'tests/fixtures/ai-models-services/**'
      - '.github/workflows/ai-models-services-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/ai-models-services/run.sh | tee ai-models-services-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-models-services-database-evidence
          path: ai-models-services-results.log
