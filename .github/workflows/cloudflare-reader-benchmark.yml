# Cloudflare reader benchmark (CF-247 s1324, S1-Build; SS-Programme-Control 27 Nov 2026 22:36 AEDT, Decision 2; M3 runbook v1.0 §8).
# One burst read of a stored public university evidence copy (default: the Newcastle international prospectus PDF that the Supabase worker
# could not read, HTTP 546) through the coverage-sweep worker (mode burst_read: the platform's gate, then a signed call to the isolated
# reader), then the automatic shutdown: after the idle timeout plus a margin, the application must have no running instance. Started by hand.
name: Cloudflare reader benchmark
on:
  workflow_dispatch:
    inputs:
      evidence_id:
        description: "Stored evidence id (default: Newcastle prospectus 751ba9e8-659f-493b-9a3e-456b9ae59b55)"
        required: false
        default: "751ba9e8-659f-493b-9a3e-456b9ae59b55"
concurrency:
  group: cloudflare-reader-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One burst read through the platform's gate
        env:
          EVIDENCE: ${{ inputs.evidence_id }}
        run: node scripts/cloudflare-reader-benchmark.mjs "$EVIDENCE"
      - name: Automatic shutdown (idle timeout plus a margin)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_READER_API_TOKEN }}
        run: |
          set -u
          sleep 420   # fixed: the approved five-minute idle timeout plus two minutes
          acct=$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" 'https://api.cloudflare.com/client/v4/accounts?per_page=5' | jq -r '.result[0].id'); echo "::add-mask::$acct"
          curl -sS -H "Authorization: Bearer ${CF_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/$acct/containers/applications" > /tmp/c.json
          jq -c '[.result[]? | select(.name | test("reader")) | {name, scheduling_policy, instances, health}]' /tmp/c.json | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f /tmp/c.json
