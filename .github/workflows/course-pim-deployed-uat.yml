name: Course PIM Deployed UAT

on:
  pull_request:
    paths:
      - '.github/workflows/course-pim-deployed-uat.yml'
      - '.github/cf-2-15-74-course-pim-candidate'
      - 'src/Layer4Intervention.jsx'
      - 'src/components/pim/**'
      - 'src/domain/pim*'
      - 'src/types/pim.ts'
      - 'src/types/admin-read.ts'
      - 'supabase/migrations/20260908032500_course_detail_pim_payload.sql'
      - 'tests/uat/cf-2-15-74-course-pim-detail-contract-deployed.spec.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/course-pim-deployed-uat.yml'
      - '.github/cf-2-15-74-course-pim-candidate'
      - 'src/Layer4Intervention.jsx'
      - 'src/components/pim/**'
      - 'src/domain/pim*'
      - 'src/types/pim.ts'
      - 'src/types/admin-read.ts'
      - 'supabase/migrations/20260908032500_course_detail_pim_payload.sql'
      - 'tests/uat/cf-2-15-74-course-pim-detail-contract-deployed.spec.mjs'
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed CourseFinder Admin URL
        required: true
        default: https://coursefinder-pilot.techm.workers.dev
        type: string

permissions:
  contents: read
  checks: read

a concurrency:
  group: course-pim-deployed-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  course-pim-deployed-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UAT_EMAIL: ${{ secrets.COURSEFINDER_UAT_EMAIL }}
      UAT_PASSWORD: ${{ secrets.COURSEFINDER_UAT_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Checkout exact revision under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Resolve exact deployment target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ -z "$PR_HEAD_SHA" ] || [ -z "$PR_HEAD_REF" ]; then
              echo "Pull-request head branch/SHA is unavailable"
              exit 1
            fi
            slug=$(printf '%s' "$PR_HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's#[/._]+#-#g; s#[^a-z0-9-]+#-#g; s#-+#-#g; s#^-+|-+$##g')
            if [ -z "$slug" ]; then
              echo "Unable to derive Cloudflare preview slug from $PR_HEAD_REF"
              exit 1
            fi
            echo "TARGET_SHA=$PR_HEAD_SHA" >> "$GITHUB_ENV"
            echo "UAT_BASE_URL=https://${slug}-coursefinder-pilot.techm.workers.dev" >> "$GITHUB_ENV"
            echo "DEPLOYMENT_MODE=preview" >> "$GITHUB_ENV"
          else
            echo "TARGET_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "UAT_BASE_URL=${{ inputs.base_url || 'https://coursefinder-pilot.techm.workers.dev' }}" >> "$GITHUB_ENV"
            echo "DEPLOYMENT_MODE=main" >> "$GITHUB_ENV"
          fi

      - name: Preflight governed UAT credentials
        shell: bash
        run: |
          if [ -z "$UAT_EMAIL" ] || [ -z "$UAT_PASSWORD" ]; then
            echo "Required Actions secrets are missing: COURSEFINDER_UAT_EMAIL / COURSEFINDER_UAT_PASSWORD"
            exit 1
          fi
          case "$UAT_BASE_URL" in
            https://*) ;;
            *) echo "UAT_BASE_URL must use HTTPS for deployed acceptance"; exit 1 ;;
          esac
          if [ -z "$TARGET_SHA" ]; then
            echo "TARGET_SHA is required"
            exit 1
          fi

      - name: Wait for Cloudflare deployment of exact revision
        shell: bash
        run: |
          checks_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100"
          run_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          run_created=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$run_api" | jq -r '.created_at')
          run_created_epoch=$(date -u -d "$run_created" +%s)

          for attempt in $(seq 1 18); do
            checks=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$checks_api" || true)

            match=$(printf '%s' "$checks" | jq -c \
              --arg mode "$DEPLOYMENT_MODE" \
              --arg url "$UAT_BASE_URL" \
              --argjson run_epoch "$run_created_epoch" '
                [.check_runs[]?
                  | select(.name == "Workers Builds: coursefinder-pilot")
                  | select(.app.slug == "cloudflare-workers-and-pages")
                  | select(.status == "completed" and .conclusion == "success")
                  | . + {started_epoch: ((.started_at | fromdateiso8601) // 0)}
                  | select(
                      if $mode == "preview" then
                        ((.output.summary // "") | contains("Preview Alias URL: " + $url))
                      else
                        (.started_epoch >= ($run_epoch - 10))
                      end
                    )
                ] | sort_by(.started_at) | last // empty' 2>/dev/null || true)

            code=$(curl -L -sS -o /tmp/coursefinder-pim-home.html -w '%{http_code}' --max-time 12 "$UAT_BASE_URL/?pim_uat_probe=${TARGET_SHA}" || true)
            if [ -n "$match" ] && [ "$code" = "200" ]; then
              check_sha=$(printf '%s' "$match" | jq -r '.head_sha')
              if [ "$check_sha" = "$TARGET_SHA" ]; then
                echo "Cloudflare confirms exact $DEPLOYMENT_MODE revision $TARGET_SHA on $UAT_BASE_URL"
                exit 0
              fi
            fi
            echo "Waiting for Cloudflare exact revision $TARGET_SHA on $UAT_BASE_URL; retry ${attempt}/18"
            sleep 10
          done
          echo "Cloudflare did not confirm exact revision $TARGET_SHA on $UAT_BASE_URL"
          exit 1

      - name: Install Chromium browser
        run: npx playwright install chromium

      - name: Run governed Course PIM deployed contract
        run: npx playwright test tests/uat/cf-2-15-74-course-pim-detail-contract-deployed.spec.mjs --project=chromium-desktop

      - name: Upload Course PIM UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-pim-deployed-uat-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            playwright-report/
            test-results/
            uat-artifacts/
