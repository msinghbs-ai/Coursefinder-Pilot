# Course descriptions: production-parity fixture and validator baseline (Platform Admin direction 6 Nov 2026 08:12; decision 19:14 §8).
# Rebuilds the course-description path from its production manifest on an isolated PostgreSQL 17.6 (production runs 17.6), proves the fixture
# equals the manifest and the live md5s, and runs the baseline of today's validator outcomes. Never connects to Supabase.
name: Course descriptions fixture
on:
  pull_request:
    paths:
      - 'tests/fixtures/course-description-parity/**'
      - 'tests/uat/cf-247-s355-course-description-baseline-contract.spec.mjs'
      - 'scripts/prod-parity*.mjs'
      - 'supabase/migrations/202611065*.sql'
      - 'supabase/migrations/20261107120000_cf247_course_description_promote_held.sql'
      - 'supabase/migrations/20261108130*.sql'
      - 'tests/fixtures/course-description-backpressure/**'
      - 'tests/fixtures/cdesc-machine/**'
      - 'supabase/migrations/2026111006*.sql'
      - 'supabase/migrations/2026111010*.sql'
      - 'supabase/migrations/2026111018*.sql'
      - 'tests/fixtures/cdesc-throughput/**'
      - 'tests/uat/cf-247-cdesc-decline-throughput-contract.spec.mjs'
      - 'supabase/held/cdesc_*_forward_recovery.sql'
      - 'supabase/migrations/20261110230*.sql'
      - 'tests/fixtures/cdesc-subset/**'
      - 'tests/uat/cf-247-cdesc-subset-contract.spec.mjs'
      - 'supabase/migrations/20261111000000_cf247_cdesc_admit_outside_ai_record.sql'
      - 'tests/fixtures/cdesc-admit-outside-record/**'
      - 'tests/uat/cf-247-cdesc-admit-outside-record-contract.spec.mjs'
      - 'tests/uat/cf-247-s527-course-description-machine-admission-contract.spec.mjs'
      - 'tests/uat/cf-247-s450-course-description-review-pack-contract.spec.mjs'
      - 'supabase/functions/coverage-sweep/course-text.ts'
      - '.github/workflows/course-descriptions-test.yml'
  workflow_dispatch:
jobs:
  course-description-baseline:
    runs-on: ubuntu-latest
    # psql connects through the shared Unix socket, so inet_server_addr() is
    # NULL in the existing local-only guard. Docker bridge TCP is not loopback.
    container:
      image: node:22-bookworm
      volumes:
        - cdesc-postgres-socket:/var/run/postgresql
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        volumes:
          - cdesc-postgres-socket:/var/run/postgresql
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: /var/run/postgresql
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated PostgreSQL client
        run: apt-get update && apt-get install -y --no-install-recommends postgresql-client
      - name: Prove genuinely local fixture connection
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d postgres -c "select version(), current_database(), inet_server_addr() is null as unix_socket;"
          test "$(psql -X -At -d postgres -c 'select inet_server_addr() is null')" = t
      - name: Execute manifest parity, migration and every SQL scenario
        run: |
          set -euo pipefail
          bash tests/fixtures/course-description-parity/run.sh 2>&1 | tee course-description-results.log
          bash tests/fixtures/course-description-backpressure/run.sh 2>&1 | tee -a course-description-results.log
          bash tests/fixtures/cdesc-machine/run.sh 2>&1 | tee -a course-description-results.log
          bash tests/fixtures/cdesc-throughput/run.sh 2>&1 | tee -a course-description-results.log
          bash tests/fixtures/cdesc-subset/run.sh 2>&1 | tee -a course-description-results.log
          bash tests/fixtures/cdesc-admit-outside-record/run.sh 2>&1 | tee -a course-description-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-description-evidence
          path: course-description-results.log
# Full governed suite and same-run register: existing Test evidence workflow (#892).
