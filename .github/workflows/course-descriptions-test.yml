# Course descriptions: production-parity fixture and validator baseline (Platform Admin direction 6 Nov 2026 08:12; decision 19:14 §8).
# Rebuilds the course-description path from its production manifest on an isolated PostgreSQL 17.6 (production runs 17.6), proves the fixture
# equals the manifest and the live md5s, and runs the baseline of today's validator outcomes. Never connects to Supabase.
name: Course descriptions fixture
on:
  pull_request:
    paths:
      - 'tests/fixtures/course-description-parity/**'
      - 'tests/uat/cf-247-s355-course-description-baseline-contract.spec.mjs'
      - 'scripts/prod-parity*.mjs'
      - 'supabase/migrations/202611065*.sql'
      - 'supabase/functions/coverage-sweep/course-text.ts'
      - '.github/workflows/course-descriptions-test.yml'
  workflow_dispatch:
jobs:
  course-description-baseline:
    runs-on: ubuntu-latest
    # psql connects through the shared Unix socket, so inet_server_addr() is
    # NULL in the existing local-only guard. Docker bridge TCP is not loopback.
    container:
      image: node:22-bookworm
      volumes:
        - cdesc-postgres-socket:/var/run/postgresql
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        volumes:
          - cdesc-postgres-socket:/var/run/postgresql
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: /var/run/postgresql
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated PostgreSQL client
        run: apt-get update && apt-get install -y --no-install-recommends postgresql-client
      - name: Prove genuinely local fixture connection
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d postgres -c "select version(), current_database(), inet_server_addr() is null as unix_socket;"
          test "$(psql -X -At -d postgres -c 'select inet_server_addr() is null')" = t
      - name: Execute manifest parity, migration and every SQL scenario
        run: |
          set -euo pipefail
          bash tests/fixtures/course-description-parity/run.sh 2>&1 | tee course-description-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-description-evidence
          path: course-description-results.log


  full-governed-suite:
    needs: course-description-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install governed dependencies and browser
        run: |
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify release contract and build
        run: npm run build
      - name: Targeted combined parser, legacy-key and description contracts
        run: >-
          npx playwright test
          tests/uat/cf-247-s220-intake-dates-persist-contract.spec.mjs
          tests/uat/cf-247-s287-intake-calendar-v2-contract.spec.mjs
          tests/uat/cf-247-s53-r22-r18-contract.spec.mjs
          tests/uat/cf-247-english-baseline-contract.spec.mjs
          tests/uat/cf-247-english-groups-contract.spec.mjs
          tests/uat/cf-247-english-verbatim-pages-contract.spec.mjs
          tests/uat/cf-247-s355-course-description-baseline-contract.spec.mjs
          tests/uat/cf-247-s360-course-descriptions-complete.spec.mjs
          --project=chromium-desktop --reporter=list
      - name: Full governed suite, one execution with structured results
        id: suite
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: uat-artifacts/results.json
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: uat-artifacts/junit.xml
        run: npx playwright test --grep-invert @deployed --reporter=list,json,junit
      - name: Generate existing register from that same run
        if: always()
        run: |
          test -s uat-artifacts/results.json
          node scripts/test-register.mjs > uat-artifacts/TEST-REGISTER.md
          node --input-type=module - <<'JS'
          import fs from 'node:fs'; import {execFileSync} from 'node:child_process';
          const report=JSON.parse(fs.readFileSync('uat-artifacts/results.json','utf8'));
          const sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          fs.writeFileSync('uat-artifacts/course-description-suite.json',JSON.stringify({sha,tree,run_id:process.env.GITHUB_RUN_ID,stats:report.stats,errors:report.errors},null,2));
          if(!report.stats || !(report.stats.expected+report.stats.unexpected+report.stats.skipped+report.stats.flaky>0) || report.stats.unexpected || report.stats.skipped || report.errors?.length) process.exit(1);
          JS
      - name: Retain full-suite and register evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-description-full-suite-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            uat-artifacts/results.json
            uat-artifacts/junit.xml
            uat-artifacts/TEST-REGISTER.md
            uat-artifacts/course-description-suite.json
            test-results/
      - name: Fail closed if full suite failed
        if: always() && steps.suite.outcome != 'success'
        run: exit 1
