# Guards: IQ-00355 planner head-of-queue starvation (CF-247 F-OPS) and G4 database-backed tests: migration 20261110240000 and its forward recovery run on an isolated PostgreSQL image (fixtures only, never a Supabase project).
name: Planner no-step memory integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261110240000_cf247_planner_noop_memory.sql'
      - 'supabase/held/planner_noop_memory_forward_recovery.sql'
      - 'tests/fixtures/planner-noop-memory/**'
      - '.github/workflows/planner-noop-memory-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/planner-noop-memory/run.sh | tee planner-noop-memory-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-noop-memory-database-evidence
          path: planner-noop-memory-results.log
