name: M2.4.5 Targeted Reconciled Contract
on:
  push:
    paths: ['.github/workflows/m245-targeted-contract.yml']
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf-m245-ui-improvements-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Run targeted M2.4.5 contract
        run: npx playwright test tests/uat/m245-ui-improvements-contract.spec.mjs --project=chromium-desktop
      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          rm .github/workflows/m245-targeted-contract.yml
          git config user.name coursefinder-ui-bot
          git config user.email coursefinder-ui-bot@users.noreply.github.com
          git add .github/workflows/m245-targeted-contract.yml
          git commit -m "M2.4.5 remove targeted contract runner" || true
          git push origin HEAD:cf-m245-ui-improvements-20260907
