name: CF-093 One-Off Release Sync

on:
  push:
    branches:
      - release/cf093-v2.15.78-20260911

permissions:
  contents: write

jobs:
  sync-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/cf093-v2.15.78-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronise governed v2.15.78 release surfaces
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs')
          const must=(cond,msg)=>{if(!cond)throw new Error(msg)}
          const replace=(path,from,to)=>{let s=fs.readFileSync(path,'utf8');must(s.includes(from),`${path}: missing expected source`);s=s.replace(from,to);fs.writeFileSync(path,s)}

          replace('src/mature-main.jsx',"const UI_VERSION='2.15.77'","const UI_VERSION='2.15.78'")
          replace('index.html','<title>Coursefinder PIM Admin v2.15.77</title>','<title>Coursefinder PIM Admin v2.15.78</title>')

          let history=fs.readFileSync('src/pim-version-entry.js','utf8')
          must(history.includes("const VERSION='2.15.77'"),'pim history current version mismatch')
          history=history.replace("const VERSION='2.15.77'","const VERSION='2.15.78'")
          const marker='const RELEASES=[\n'
          must(history.includes(marker),'pim release history marker missing')
          const entry=`  {version:'2.15.78',date:'11 Sep 2026',title:'Governed Scheduled Tasks target builder',changes:['Scheduled Tasks adds a server-authorised target builder for AU Course Facts enrichment with Country, State/Territory and University/Provider scopes.','Every consequential run requires a same-actor server preview receipt bound to the exact workflow, target and acquisition-only processing mode before dispatch.','Layer 2 dispatch fails closed unless scoped profiles have valid current versions, governed execution policies and remain within the supported per-profile scope limit.','Exact-scope dispatch is serialised and deduplicated across operators while preview-token ownership remains actor-bound.','Jobs and Evidence remain authoritative for underlying work; generic Layer 3/Layer 4 orchestration, Evidence reprocessing and recurring scope construction remain unavailable.'],bugFixes:['Prevented stale scope, university-search and preview responses from authorising another target or leaving the builder busy.','Retired the bypassable v1 target-builder run path and enforced preview-before-dispatch on the server.','Rejected country scopes carrying arbitrary target IDs and revalidated live runnable scope immediately before dispatch.','Measured duplicate suppression from actual dispatch time and rejected empty or unqualified starts atomically.','Preserved Layer 1 authority, Layer 3 Evidence/profile/model governance, Layer 4 human resolution and separate Search/Publication admission boundaries.']},\n`
          history=history.replace(marker,marker+entry)
          fs.writeFileSync('src/pim-version-entry.js',history)

          let changelog=fs.readFileSync('CHANGELOG.md','utf8')
          must(changelog.startsWith('# Changelog\n'),'CHANGELOG header missing')
          const cEntry=`\n## 0.1.5 — 11 Sep 2026\n\n- Published visible PIM Admin release **v2.15.78** for the accepted CF-093 governed Scheduled Tasks target-builder slice.\n- Added server-authorised AU Course Facts Country/State/University preview and acquisition-only dispatch with exact-target preview receipts, profile/policy qualification and cross-operator idempotency.\n- Retained v2.15.77 and earlier release history; generic Layer 3/Layer 4 orchestration, Evidence reprocessing and recurring scope construction remain separately gated.\n- Reconciled the deployed-ranking UAT currentness assertion so it compares the deployed version against the maintained release-currentness source instead of the historical v2.15.74 literal.\n`
          changelog=changelog.replace('# Changelog\n','# Changelog\n'+cEntry)
          fs.writeFileSync('CHANGELOG.md',changelog)

          for(const path of ['package.json','package-lock.json']){
            const obj=JSON.parse(fs.readFileSync(path,'utf8'))
            obj.version='0.1.5'
            if(obj.packages?.[''])obj.packages[''].version='0.1.5'
            fs.writeFileSync(path,JSON.stringify(obj,null,2)+'\n')
          }

          const releaseTest=`import {test,expect} from '@playwright/test'\nimport fs from 'node:fs'\n\ntest('v2.15.78 is canonical while v2.15.77, v2.15.76 and v2.15.75 remain retained in release history',()=>{\n  const history=fs.readFileSync('src/pim-version-entry.js','utf8')\n  const shell=fs.readFileSync('src/mature-main.jsx','utf8')\n  const current=fs.readFileSync('src/release-currentness-entry.js','utf8')\n  const html=fs.readFileSync('index.html','utf8')\n\n  expect(history).toContain(\"const VERSION='2.15.78'\")\n  expect(history).toContain(\"{version:'2.15.78'\")\n  expect(history).toContain(\"{version:'2.15.77'\")\n  expect(history).toContain(\"{version:'2.15.76'\")\n  expect(history).toContain(\"{version:'2.15.75'\")\n  expect(history).toContain(\"title:'QS ranking duplicate cleanup and 2026/2027 acquisition correction'\")\n  expect(history).toContain(\"bugFixes:['Fixed duplicate QS edition rows in Sources & Imports\")\n  expect(history.indexOf(\"{version:'2.15.78'\")).toBeLessThan(history.indexOf(\"{version:'2.15.77'\"))\n  expect(history.indexOf(\"{version:'2.15.77'\")).toBeLessThan(history.indexOf(\"{version:'2.15.76'\"))\n  expect(history.indexOf(\"{version:'2.15.76'\")).toBeLessThan(history.indexOf(\"{version:'2.15.75'\"))\n  expect(history.indexOf(\"{version:'2.15.75'\")).toBeLessThan(history.indexOf(\"{version:'2.15.74'\"))\n  expect(shell).toContain(\"const UI_VERSION='2.15.78'\")\n  expect(current).toContain(\"const VERSION='2.15.78'\")\n  expect(html).toContain('<title>Coursefinder PIM Admin v2.15.78</title>')\n})\n`
          fs.writeFileSync('tests/uat/m245-release-history-v21575-persistence-contract.spec.mjs',releaseTest)

          let ranking=fs.readFileSync('tests/uat/cf-097-ranking-workflow-history-deployed.spec.mjs','utf8')
          if(!ranking.includes("import fs from'node:fs'")) ranking=ranking.replace("import{test,expect}from'@playwright/test'\n", "import{test,expect}from'@playwright/test'\nimport fs from'node:fs'\n")
          must(ranking.includes("await expect(page.locator('.m-release-pill')).toContainText('v2.15.74',{timeout:120000})"),'CF-097 historical version assertion not found')
          ranking=ranking.replace("await expect(page.locator('.m-release-pill')).toContainText('v2.15.74',{timeout:120000})", "const expectedVersion=fs.readFileSync('src/release-currentness-entry.js','utf8').match(/const VERSION='([^']+)'/)?.[1];expect(expectedVersion).toBeTruthy();await expect(page.locator('.m-release-pill')).toContainText('v'+expectedVersion,{timeout:120000})")
          fs.writeFileSync('tests/uat/cf-097-ranking-workflow-history-deployed.spec.mjs',ranking)
          NODE

          rm .github/workflows/cf093-release-sync-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md package.json package-lock.json index.html src/mature-main.jsx src/pim-version-entry.js src/release-currentness-entry.js tests/uat/m245-release-history-v21575-persistence-contract.spec.mjs tests/uat/cf-097-ranking-workflow-history-deployed.spec.mjs .github/workflows/cf093-release-sync-once.yml
          git diff --cached --check
          git commit -m 'CF-093 synchronise v2.15.78 release currentness'
          git push origin HEAD:release/cf093-v2.15.78-20260911
