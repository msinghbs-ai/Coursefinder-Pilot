# UI review screenshots (P3 screen-by-screen review).
# Logs in as the UAT user, captures full-page screenshots of the listed screens, and commits
# them to the separate branch "ui-review-snapshots" (never main). E-mail addresses and the
# signed-in user's details are masked. The repository is public: do not add screens that
# show personal data without masking them.
name: UI review screenshots
on:
  workflow_dispatch:
    inputs:
      screens:
        description: "Comma-separated routes; route>Button also clicks a tab (e.g. layer-4-human-resolution>Batches)"
        required: true
        default: "jobs,scheduled-tasks,layer-4-human-resolution,layer-4-human-resolution>Batches,layer-3-ai-interpretation"
      base_url:
        description: "Site address (defaults to the pilot)"
        required: false
      adapter_filters:
        description: "Diagnostics: set Layer 2 Adapters filters to Australia and any provider (1 = yes)"
        required: false
      controller_execution:
        description: "Active controller execution matching the pre-reserved fixed capture inputs"
        required: true
      controller_generation:
        description: "Active controller generation"
        required: true
      controller_operation:
        description: "Immutable validation operation already reserved for these exact inputs"
        required: true
concurrency:
  group: studysearch-controller-production
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    environment: pilot
    env:
      CONTROLLER_EXECUTION_ID: ${{ inputs.controller_execution }}
      CONTROLLER_GENERATION: ${{ inputs.controller_generation }}
      CONTROLLER_OPERATION_ID: ${{ inputs.controller_operation }}
      # Reviewed repository configuration; never sourced from a dispatch input.
      STUDYSEARCH_UAT_ALLOWED_ORIGIN: ${{ vars.STUDYSEARCH_UAT_ALLOWED_ORIGIN || 'https://coursefinder-pilot.techm.workers.dev' }}
      UAT_BASE_URL: ${{ inputs.base_url || 'https://coursefinder-pilot.techm.workers.dev' }}
      UAT_EMAIL: ${{ secrets.COURSEFINDER_UAT_EMAIL }}
      UAT_PASSWORD: ${{ secrets.COURSEFINDER_UAT_PASSWORD }}
      SCREENS: ${{ inputs.screens }}
      ADAPTER_FILTERS: ${{ inputs.adapter_filters }}
      OUT_DIR: ui-review-out
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate trusted UAT credential target
        run: |
          python3 scripts/ci/controller-guard.py --validate-uat-target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --prefer-offline --no-audit --no-fund
      - run: npx playwright install chromium
      # Reserve ui_review_sha256 from --print-ui-review-resource using the same
      # UAT_BASE_URL, SCREENS and ADAPTER_FILTERS before dispatch. The gate
      # re-derives it; this does not approve admission or other held actions.
      - name: Verify controller authority for the fixed capture inputs
        id: controller_gate
        run: |
          python3 scripts/ci/controller-guard.py --entry-point ui-review-screenshots
      - name: Capture screens
        run: |
          npx playwright test -c tools/ui-review/playwright.config.mjs
      - name: Commit to ui-review-snapshots branch
        # CF-247 (29 Oct 2026): what was captured is kept even when a screen fails, with the failure in manifest.json
        if: always() && steps.controller_gate.outcome == 'success'
        run: |
          set -e
          DEST="snapshots/$(date -u +%Y%m%d-%H%M)-run${{ github.run_number }}"
          mkdir -p /tmp/snap && cp -r ui-review-out/. /tmp/snap/
          git config user.name "ui-review-bot"
          git config user.email "ui-review-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ui-review-snapshots >/dev/null; then
            git fetch origin ui-review-snapshots && git checkout -f ui-review-snapshots
          else
            git checkout --orphan ui-review-snapshots && git rm -rf . >/dev/null
          fi
          mkdir -p "$DEST" && cp -r /tmp/snap/. "$DEST/"
          git add "$DEST" && git commit -m "UI review snapshots: $DEST" && git push origin ui-review-snapshots
          echo "Saved to branch ui-review-snapshots, folder $DEST"
