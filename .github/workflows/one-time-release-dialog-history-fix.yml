name: One-time maintained release dialog fix
on:
  push:
    branches: [cf-m245-release-dialog-history-fix-20260908]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[release-dialog-history-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf-m245-release-dialog-history-fix-20260908
      - name: Restore maintained release history as single pill authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/mature-main.jsx')
          s=p.read_text()
          start=s.find('const RELEASE_NOTES=[')
          if start>=0:
              end=s.find('\nconst PAGE_SIZE=50',start)
              if end<0: raise SystemExit('RELEASE_NOTES end not found')
              s=s[:start]+s[end+1:]
          old='<div className="m-topbar-actions"><details className="m-release-menu"><summary className="m-release-pill" aria-label={`Open release notes for PIM Admin v${UI_VERSION}`}><span className="m-live-dot"/><span className="m-release-version-label">v{UI_VERSION}</span><ChevronDown size={12}/></summary><div className="m-release-fixes-popover"><div className="m-release-fixes-head"><strong>Release notes</strong><span>v{UI_VERSION}</span></div><div className="m-release-section"><b>Release notes</b><ul>{RELEASE_NOTES.map(x=><li key={x}>{x}</li>)}</ul></div><div className="m-release-section m-release-bugfixes"><b>Bug / UI fixes</b><ul>{UI_FIXES.map(x=><li key={x}>{x}</li>)}</ul></div></div></details><span className="m-role-pill">{roleLabel(context?.role||\'Loading\')}</span></div>'
          new='<div className="m-topbar-actions"><span className="m-release-pill"><span className="m-live-dot"/><span className="m-release-version-label">v{UI_VERSION}</span></span><span className="m-role-pill">{roleLabel(context?.role||\'Loading\')}</span></div>'
          if old not in s: raise SystemExit('native details release menu target not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/pim-version-entry.js')
          s=p.read_text()
          s=s.replace('.m-release-pill-legacy','.m-release-pill')
          first="{version:'2.15.74',date:'7 Sep 2026',title:'Compare ranking year controls and frozen university headers',changes:['Provider Compare now presents QS and THE as independent ranking sections, each with its own edition selector and Multi-year option.','The shared Current snapshot / Multi-year trend control has been removed from QILT/PRISMS comparison; QILT retains an explicit year selector.','University/provider identity headers are explicitly sticky across QILT, PRISMS and ranking comparison surfaces while comparison content scrolls.','Focused source contract, frontend build/browser smoke and deployed Pilot UAT passed; no database, ranking, QILT/PRISMS grain, publication, Search, Website/Zoho or Production semantics changed.']}"
          replacement="{version:'2.15.74',date:'7 Sep 2026',title:'Compare ranking year controls and frozen university headers',changes:['Provider Compare now presents QS and THE as independent ranking sections, each with its own edition selector and Multi-year option.','The shared Current snapshot / Multi-year trend control has been removed from QILT/PRISMS comparison; QILT retains an explicit year selector.','University/provider identity headers are explicitly sticky across QILT, PRISMS and ranking comparison surfaces while comparison content scrolls.','Focused source contract, frontend build/browser smoke and deployed Pilot UAT passed; no database, ranking, QILT/PRISMS grain, publication, Search, Website/Zoho or Production semantics changed.'],bugFixes:['Independent QILT, PRISMS, QS and THE year/edition controls in Provider Compare.','Frozen Provider/university identity headers across comparison statistics and rankings.','Standard Statistics & Rankings breadcrumbs with dedicated QILT, PRISMS, QS and THE dataset subpages.','QS/THE dataset pages aligned to the standard CourseFinder dataset table theme.','Breadcrumb Home navigation now synchronises Dashboard content, heading and route state.','Version pill uses one maintained release-notes dialog; legacy double-open behaviour is removed.']}"
          if first not in s: raise SystemExit('current release record target not found')
          s=s.replace(first,replacement,1)
          old_render="<h3>${release.title}</h3><ul>${release.changes.map(change=>`<li>${change}</li>`).join('')}</ul></article>"
          new_render="<h3>${release.title}</h3><ul>${release.changes.map(change=>`<li>${change}</li>`).join('')}</ul>${release.bugFixes?.length?`<div class=\"m-release-note-fixes\"><strong>Bug / UI fixes</strong><ul>${release.bugFixes.map(change=>`<li>${change}</li>`).join('')}</ul></div>`:''}</article>"
          if old_render not in s: raise SystemExit('release article rendering target not found')
          s=s.replace(old_render,new_render,1)
          old_sync="document.querySelectorAll('.m-release-pill').forEach(el=>{el.textContent=`v${VERSION}`;releaseButton(el)})"
          new_sync="document.querySelectorAll('.m-release-pill').forEach(el=>{const label=el.querySelector('.m-release-version-label');if(label)label.textContent=`v${VERSION}`;else el.textContent=`v${VERSION}`;releaseButton(el)})"
          if old_sync not in s: raise SystemExit('release pill sync target not found')
          s=s.replace(old_sync,new_sync,1)
          style_marker='.m-release-note li{font-size:12px;line-height:1.55;margin:5px 0}'
          style_new=style_marker+'.m-release-note-fixes{margin-top:12px;padding:10px 12px;background:#f8f9ff;border:1px solid #e6e9ff;border-radius:10px}.m-release-note-fixes strong{display:block;font-size:10px;color:#4338ca;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}.m-release-note-fixes ul{margin:0;padding-left:18px}'
          if style_marker not in s: raise SystemExit('release style marker not found')
          s=s.replace(style_marker,style_new,1)
          p.write_text(s)
          PY
      - name: Add focused source contract
        run: |
          cat > tests/uat/m245-release-dialog-history-contract.spec.mjs <<'EOF'
          import {test,expect} from '@playwright/test'
          import fs from 'node:fs'
          test('version pill preserves maintained accessible release history and bug fixes',()=>{
            const ui=fs.readFileSync('src/mature-main.jsx','utf8')
            const release=fs.readFileSync('src/pim-version-entry.js','utf8')
            expect(ui).toContain('<span className="m-release-pill"><span className="m-live-dot"/><span className="m-release-version-label">v{UI_VERSION}</span></span>')
            expect(ui).not.toContain('<details className="m-release-menu">')
            expect(release).toContain("querySelectorAll('.m-release-pill')")
            expect(release).toContain('m-release-notes-list')
            expect(release).toContain('role="dialog" aria-modal="true"')
            expect(release).toContain("event.key==='Escape'")
            expect(release).toContain("document.querySelector('.m-release-pill[role=\"button\"]')?.focus()")
            expect(release).toContain('Bug / UI fixes')
            expect(release).toContain('release.bugFixes')
            expect(release).not.toContain('.m-release-pill-legacy')
          })
          EOF
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mature-main.jsx src/pim-version-entry.js tests/uat/m245-release-dialog-history-contract.spec.mjs
          git commit -m "CF M2.4.5 preserve maintained release dialog with UI fixes [release-dialog-history-fix]"
          git push
