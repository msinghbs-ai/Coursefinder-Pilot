name: CF-214 THE URL routing and UI patch
on:
  push:
    paths: ['.github/workflows/cf214-the-ui-routing.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply asserted CF-214 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def once(s, old, new, label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              return s.replace(old,new,1)

          p=Path('supabase/functions/ranking-publisher-url-import/index.ts')
          s=p.read_text()
          anchor='if(systemCode==="qs_wur"&&/^https:\\/\\/www\\.topuniversities\\.com\\/world-university-rankings(?:\\/20\\d{2})?\\/?(?:\\?.*)?$/i.test(rawReference)){const r=await fetch(url+"/functions/v1/ranking-qs-url-import",{method:"POST",headers:{authorization:auth,apikey:anon,"content-type":"application/json"},body:JSON.stringify({source_url:rawReference,edition_year:editionYear,apply:false})}),out=await r.json().catch(()=>({}));return json(req,r.status,out)}'
          add=anchor+'if(systemCode==="the_wur"&&/^https:\\/\\/www\\.timeshighereducation\\.com\\/world-university-rankings\\/(?:latest|20\\d{2})\\/world-ranking\\/?(?:\\?.*)?$/i.test(rawReference)){const r=await fetch(url+"/functions/v1/ranking-the-url-import",{method:"POST",headers:{authorization:auth,apikey:anon,"content-type":"application/json"},body:JSON.stringify({source_url:rawReference,edition_year:editionYear,apply:false})}),out=await r.json().catch(()=>({}));return json(req,r.status,out)}'
          s=once(s,anchor,add,'THE URL delegate')
          p.write_text(s)

          p=Path('src/mature-main.jsx');s=p.read_text()
          s=once(s,"const rankingYearOptions=system=>system==='qs_wur'?[2026,2027,...Array.from({length:11},(_,i)=>2025-i)]:Array.from({length:12},(_,i)=>2026-i)","const rankingYearOptions=system=>system==='qs_wur'?[2026,2027,...Array.from({length:11},(_,i)=>2025-i)]:system==='the_wur'?Array.from({length:16},(_,i)=>2026-i):Array.from({length:12},(_,i)=>2026-i)",'THE years')
          s=once(s,"const rankingParsebotRef=system=>system==='arwu'?'/scrapers/0f6d2cb9-c7eb-4f31-9216-f7be578e9f96':system==='qs_wur'?'https://www.topuniversities.com/world-university-rankings':'/scrapers/e3ecc5de-f530-478a-b464-867d43099420'","const rankingParsebotRef=system=>system==='arwu'?'/scrapers/0f6d2cb9-c7eb-4f31-9216-f7be578e9f96':system==='qs_wur'?'https://www.topuniversities.com/world-university-rankings':system==='the_wur'?'https://www.timeshighereducation.com/world-university-rankings/latest/world-ranking':'/scrapers/e3ecc5de-f530-478a-b464-867d43099420'",'THE URL default')
          old='<option value="url" disabled={form.systemCode===\'the_wur\'}>{form.systemCode===\'qs_wur\'?\'Publisher URL → Evidence XLSX\':\'Parse.bot URL (metered)\'}</option>'
          new='<option value="url">{[\'qs_wur\',\'the_wur\'].includes(form.systemCode)?\'Publisher URL → Evidence XLSX\':\'Parse.bot URL (metered)\'}</option>'
          s=once(s,old,new,'URL option')
          old="<label>{form.systemCode==='qs_wur'?'QS publisher URL':'Parse.bot scraper URL'}<input value={form.parsebotRef}"
          new="<label>{form.systemCode==='qs_wur'?'QS publisher URL':form.systemCode==='the_wur'?'THE publisher URL':'Parse.bot scraper URL'}<input value={form.parsebotRef}"
          s=once(s,old,new,'URL label')
          p.write_text(s)
          PY
          grep -q 'ranking-the-url-import' supabase/functions/ranking-publisher-url-import/index.ts
          grep -q "THE publisher URL" src/mature-main.jsx
          grep -q "length:16" src/mature-main.jsx
          rm .github/workflows/cf214-the-ui-routing.yml
          git config user.name coursefinder-cf214-bot
          git config user.email actions@users.noreply.github.com
          git add supabase/functions/ranking-publisher-url-import/index.ts src/mature-main.jsx .github/workflows/cf214-the-ui-routing.yml
          git commit -m 'CF-214 expose THE publisher URL Evidence workflow'
          git push origin HEAD:main
