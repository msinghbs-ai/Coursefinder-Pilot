name: Release Currentness Deployed

on:
  push:
    branches: [main]
    paths:
      - 'src/release-manifest.js'
      - 'src/release-currentness-entry.js'
      - 'src/pim-version-entry.js'
      - 'src/mature-main.jsx'
      - 'index.html'
      - 'package.json'
      - 'CHANGELOG.md'
      - 'tests/uat/release-notes-deployed.spec.mjs'
      - '.github/workflows/release-currentness-deployed.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed CourseFinder Admin URL
        required: true
        default: https://coursefinder-pilot.techm.workers.dev
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: coursefinder-release-currentness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployed-release-currentness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UAT_BASE_URL: ${{ inputs.base_url || 'https://coursefinder-pilot.techm.workers.dev' }}
      UAT_EMAIL: ${{ secrets.COURSEFINDER_UAT_EMAIL }}
      UAT_PASSWORD: ${{ secrets.COURSEFINDER_UAT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Verify release contract before deployed check
        run: npm run release:verify
      - name: Preflight governed UAT credentials
        shell: bash
        run: |
          test -n "$UAT_EMAIL" || { echo 'COURSEFINDER_UAT_EMAIL missing'; exit 1; }
          test -n "$UAT_PASSWORD" || { echo 'COURSEFINDER_UAT_PASSWORD missing'; exit 1; }
          case "$UAT_BASE_URL" in https://*) ;; *) echo 'UAT_BASE_URL must use HTTPS'; exit 1;; esac
      - name: Wait for candidate release to be visible
        shell: bash
        run: |
          expected=$(node --input-type=module -e "import('./src/release-manifest.js').then(m=>process.stdout.write(m.UI_VERSION))")
          # Cloudflare builds the site after the push, so wait (up to 20 minutes) until the served
          # JavaScript carries the expected version, not just until the page answers.
          for attempt in $(seq 1 80); do
            body=$(curl -L -sS --max-time 15 "$UAT_BASE_URL/?release_probe=${GITHUB_SHA}" || true)
            # The step runs with pipefail: piping a download into "grep -q" fails whenever grep stops reading before
            # the download ends (the version sits mid-file since v2.15.136). Download to a file, then search it.
            if grep -q 'id="root"' <<<"$body"; then
              for asset in $(grep -o 'assets/[^"]*\.js' <<<"$body" | sort -u); do
                curl -L -sS --max-time 30 -o "$RUNNER_TEMP/probe.js" "$UAT_BASE_URL/$asset" || continue
                if grep -qF "${expected}" "$RUNNER_TEMP/probe.js"; then
                  echo "Deployed frontend serves v${expected} (attempt ${attempt}/80)."
                  exit 0
                fi
              done
            fi
            echo "v${expected} not deployed yet; retry ${attempt}/80"
            sleep 15
          done
          echo "Deployed frontend did not serve v${expected} within 20 minutes"
          exit 1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify deployed release version and release notes
        run: npx playwright test tests/uat/release-notes-deployed.spec.mjs --project=chromium-desktop --reporter=github,list
      - name: Upload release-currentness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-currentness-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
            uat-artifacts/
