name: CF-216 Compare selection persistence
on:
  push:
    paths: ['.github/workflows/cf216-compare-selection-persistence.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply asserted persistence patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/ComparisonWorkspace.jsx')
          s=p.read_text()
          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              s=s.replace(old,new,1)
          once("const MAX=6\n", "const MAX=6\nconst COMPARE_SELECTION_KEY='coursefinder:compare-selection:v1'\nfunction storedSelection(){try{const x=JSON.parse(localStorage.getItem(COMPARE_SELECTION_KEY)||'null');const type=x?.type==='course'?'course':'provider',ids=Array.isArray(x?.ids)?x.ids.map(String).filter(Boolean).slice(0,MAX):[];return{type,ids}}catch{return{type:'provider',ids:[]}}}\nfunction routeSelection(params){const routeIds=idsFrom(params),hasIds=!!params?.has?.('ids'),routeType=params?.get?.('type')==='course'?'course':'provider';if(hasIds)return{type:routeType,ids:routeIds};const saved=storedSelection();return saved.ids.length?saved:{type:params?.has?.('type')?routeType:saved.type,ids:[]}}\nfunction persistSelection(type,ids){try{localStorage.setItem(COMPARE_SELECTION_KEY,JSON.stringify({type:type==='course'?'course':'provider',ids:[...new Set((ids||[]).map(String).filter(Boolean))].slice(0,MAX)}))}catch{}}\n")
          once(" const initialType=routeParams?.get?.('type')==='course'?'course':'provider'\n const[type,setType]=useState(initialType),[ids,setIds]=useState(()=>idsFrom(routeParams))", " const initialSelection=routeSelection(routeParams),initialType=initialSelection.type\n const[type,setType]=useState(initialType),[ids,setIds]=useState(()=>initialSelection.ids)", 'initial selection')
          once(" useEffect(()=>{const t=routeParams?.get?.('type')==='course'?'course':'provider',nextIds=idsFrom(routeParams);setType(t);setIds(nextIds);if(nextIds.length===1)setViewMode('trend');else if(nextIds.length>1)setViewMode('snapshot')},[routeParams])", " useEffect(()=>{const next=routeSelection(routeParams),t=next.type,nextIds=next.ids;setType(t);setIds(nextIds);if(nextIds.length===1)setViewMode('trend');else if(nextIds.length>1)setViewMode('snapshot')},[routeParams])\n useEffect(()=>{persistSelection(type,ids)},[type,ids.join(',')])", 'route restore')
          once(" function clear(){setQuery('');setSearchRows([]);commitSelection(type,[])}", " function clear(){setQuery('');setSearchRows([]);persistSelection(type,[]);commitSelection(type,[])}", 'manual clear')
          p.write_text(s)
          PY
          grep -q "coursefinder:compare-selection:v1" src/ComparisonWorkspace.jsx
          grep -q "routeSelection(routeParams)" src/ComparisonWorkspace.jsx
          grep -q "persistSelection(type,ids)" src/ComparisonWorkspace.jsx
          rm .github/workflows/cf216-compare-selection-persistence.yml
          git config user.name coursefinder-cf216-bot
          git config user.email actions@users.noreply.github.com
          git add src/ComparisonWorkspace.jsx .github/workflows/cf216-compare-selection-persistence.yml
          git commit -m 'CF-216 persist Compare selections until manually cleared'
          git push origin HEAD:main
