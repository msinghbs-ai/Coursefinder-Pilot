name: M2.4.5 Bounded UI Gate
on:
  push:
    branches: [cf-m245-ui-improvements-20260907]
permissions:
  contents: write
jobs:
  bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf-m245-ui-improvements-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Run reconciled source contract
        run: npx playwright test tests/uat/m245-ui-improvements-contract.spec.mjs --project=chromium-desktop
      - name: Run bounded viewport shell matrix
        shell: bash
        run: |
          for spec in '1600 900 desktop' '1366 768 laptop' '900 820 tablet' '390 844 mobile'; do
            set -- $spec
            W=$1 H=$2 NAME=$3
            cat > /tmp/bounded.config.mjs <<EOF
          import { defineConfig } from '@playwright/test'
          export default defineConfig({
            testDir: '${GITHUB_WORKSPACE}/tests/uat',
            timeout: 120000,
            retries: 0,
            workers: 1,
            reporter: [['list']],
            use: { baseURL: 'http://127.0.0.1:5173', viewport: { width: $W, height: $H } },
            webServer: { command: 'npm run dev -- --host 127.0.0.1', url: 'http://127.0.0.1:5173', timeout: 120000,
              env: { VITE_SUPABASE_URL: 'https://example.supabase.co', VITE_SUPABASE_PUBLISHABLE_KEY: 'coursefinder-local-smoke-key' } }
          })
          EOF
            echo "Bounded viewport: $NAME ${W}x${H}"
            npx playwright test tests/uat/smoke.spec.mjs --config=/tmp/bounded.config.mjs
          done
      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          rm .github/workflows/m245-bounded-ui.yml
          git config user.name coursefinder-ui-bot
          git config user.email coursefinder-ui-bot@users.noreply.github.com
          git add -A
          git commit -m 'M2.4.5 remove bounded viewport runner'
          git push origin HEAD:cf-m245-ui-improvements-20260907
