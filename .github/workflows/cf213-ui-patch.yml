name: CF-213 bounded ranking UI patch

on:
  push:
    paths:
      - '.github/workflows/cf213-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply asserted CF-213 UI changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/mature-main.jsx')
          s = p.read_text()
          original = s

          def exact(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          exact(
              "const rankingParsebotRef=system=>system==='arwu'?'/scrapers/0f6d2cb9-c7eb-4f31-9216-f7be578e9f96':'/scrapers/e3ecc5de-f530-478a-b464-867d43099420'",
              "const rankingParsebotRef=system=>system==='arwu'?'/scrapers/0f6d2cb9-c7eb-4f31-9216-f7be578e9f96':system==='qs_wur'?'https://www.topuniversities.com/world-university-rankings':'/scrapers/e3ecc5de-f530-478a-b464-867d43099420'",
              'ranking URL default'
          )

          exact(
              '<option value="url" disabled={form.systemCode===\'the_wur\'}>Parse.bot URL (metered)</option>',
              '<option value="url" disabled={form.systemCode===\'the_wur\'}>{form.systemCode===\'qs_wur\'?\'Publisher URL → Evidence XLSX\':\'Parse.bot URL (metered)\'}</option>',
              'URL mode label'
          )

          exact(
              '<label>Parse.bot scraper URL<input value={form.parsebotRef}',
              '<label>{form.systemCode===\'qs_wur\'?\'QS publisher URL\':\'Parse.bot scraper URL\'}<input value={form.parsebotRef}',
              'URL input label'
          )

          old_disable = "disabled={busy||lastParsedKey===editionKey()||(form.mode==='url'&&form.systemCode==='qs_wur'&&String(form.editionYear)==='2027')}"
          if old_disable in s:
              s = s.replace(old_disable, "disabled={busy||lastParsedKey===editionKey()}", 1)

          # Limit export insertion to RankingImportPanel, independent of the Jobs handler shape.
          panel_start = s.find('function RankingImportPanel')
          if panel_start < 0:
              raise SystemExit('RankingImportPanel not found')
          next_function = s.find('\nfunction ', panel_start + len('function RankingImportPanel'))
          panel_end = next_function if next_function > panel_start else len(s)
          jobs_text = '>Jobs</button>'
          jobs_positions = []
          pos = panel_start
          while True:
              pos = s.find(jobs_text, pos, panel_end)
              if pos < 0:
                  break
              jobs_positions.append(pos)
              pos += len(jobs_text)
          if len(jobs_positions) != 1:
              raise SystemExit(f'RankingImportPanel Jobs action: expected exactly 1 match, found {len(jobs_positions)}')
          jobs_end = jobs_positions[0] + len(jobs_text)
          jobs_start = s.rfind('<button', panel_start, jobs_positions[0])
          if jobs_start < panel_start:
              raise SystemExit('RankingImportPanel Jobs button start not found')
          jobs = s[jobs_start:jobs_end]
          export = "<button className=\"m-link-button\" disabled={processingId===x.id} onClick={async()=>{try{const{data,error}=await supabase.functions.invoke('ranking-evidence-export',{body:{system_code:x.system_code,edition_year:Number(x.edition_year),import_id:x.id}});if(error)throw error;if(!data?.signed_url)throw new Error('Exportable XLSX Evidence not found');const a=document.createElement('a');a.href=data.signed_url;a.download=data.filename||'';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}catch(e){setSaved(`Export failed: ${e.message||String(e)}`)}}}>Export XLSX</button>"
          s = s[:jobs_start] + export + jobs + s[jobs_end:]

          if s == original:
              raise SystemExit('CF-213 UI patch produced no changes')
          p.write_text(s)
          PY

          grep -q "Publisher URL → Evidence XLSX" src/mature-main.jsx
          grep -q "QS publisher URL" src/mature-main.jsx
          grep -q "Export XLSX" src/mature-main.jsx
          grep -q "ranking-evidence-export" src/mature-main.jsx

          rm .github/workflows/cf213-ui-patch.yml
          git config user.name "coursefinder-cf213-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/mature-main.jsx .github/workflows/cf213-ui-patch.yml
          git commit -m "CF-213 expose QS publisher URL and XLSX Evidence export"
          git push origin HEAD:main
