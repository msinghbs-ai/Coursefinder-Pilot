# Guards: AER precedent 29 Oct 2026 ("a budget refusal is not the page failing") applied to provider pages and scholarship reads (agent finding 7 Nov 2026): the live definitions, the migration and the
# scenarios on an isolated production-manifest fixture. Isolated only: no production access.
name: Refusal is not a try integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261107060000_cf247_refusal_is_not_a_try.sql'
      - 'tests/fixtures/english-refusal/**'
      - 'tests/fixtures/english-requirements/manifests/**'
      - 'scripts/prod-parity-capture.mjs'
      - '.github/workflows/english-refusal-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    # Both clients and server share a real Unix socket. A host TCP connection to
    # a Docker-published port reaches the server on its bridge address and must
    # be rejected by the unchanged production-fixture local-only guard.
    container:
      image: node:22-bookworm
      volumes:
        - refusal-fixture-socket:/var/run/postgresql
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        volumes:
          - refusal-fixture-socket:/var/run/postgresql
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: /var/run/postgresql
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local PostgreSQL client
        run: |
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client
      - run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - run: mkdir -p uat-artifacts
      - name: Execute real Postgres fixture, migration and scenarios
        run: |
          set -euo pipefail
          bash tests/fixtures/english-refusal/run.sh 2>&1 | tee uat-artifacts/english-refusal-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-refusal-database-evidence
          path: uat-artifacts/english-refusal-results.log

