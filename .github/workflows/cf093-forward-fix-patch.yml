name: CF-093 Forward Fix Patch

on:
  push:
    branches:
      - m245/cf093-async-discovery-20260912
    paths:
      - '.github/workflows/cf093-forward-fix-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m245/cf093-async-discovery-20260912
          fetch-depth: 0
      - name: Align source filename to applied runtime migration identity
        shell: bash
        run: |
          set -euo pipefail
          old='supabase/migrations/20260913091500_cf_093_preview_provenance_terminal_dedupe_hardening.sql'
          new='supabase/migrations/20260912232827_cf_093_preview_provenance_terminal_dedupe_hardening.sql'
          test -f "$old"
          test ! -e "$new"
          git mv "$old" "$new"
          git diff --check
      - name: Commit migration identity alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coursefinder-governance-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations
          git commit -m 'chore(cf093): align applied migration source identity'
          git push origin HEAD:m245/cf093-async-discovery-20260912
