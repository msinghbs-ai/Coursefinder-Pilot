# Guards: Admin destination data design v1.9, approvals A-3 and A-4 (Platform Admin 17 Nov 2026 07:29, 07:35); RM1B loader (S2-Build mandate 13:12)
# CF-247 RM1B: load the Postal Area to Significant Urban Area shares (ASGS Edition 3, 2021) into destination.abs_postcode_sua_shares, once per
# boundary vintage. The 277 MB allocation zip is read here, not in an edge function (2-second compute limit). Shares are the area of each Postal
# Area's Mesh Blocks inside each SUA (A-4). With first_load, it then starts job destination-abs-load's edge function once (the same call the
# schedule makes) and reads the load back.
# Safety: the typed project ref must equal the repository variable SUPABASE_PROJECT_REF (never the demo project); writes go only through
# security.destination_abs_shares_load_v1 (upsert, nothing deleted); everything it loads is draft.
name: Destination ABS shares load
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Type the target project ref to confirm"
        required: true
      first_load:
        description: "Then run the population and postcode load once"
        type: boolean
        default: true
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ inputs.project_ref }}
      ZIP_URL: https://data.gov.au/data/dataset/4c9dbd2f-5706-4c89-aeb8-689ccc3ca290/resource/b0c00ec8-4232-4eb5-bf19-45c944c336de/download/asgs-edition-3-2021-allocation-files.zip
      VINTAGE: ASGS Edition 3 (2021)
    steps:
      - uses: actions/checkout@v4
      - name: Confirm target
        run: |
          if [ -z "${{ vars.SUPABASE_PROJECT_REF }}" ] || [ "$REF" != "${{ vars.SUPABASE_PROJECT_REF }}" ]; then echo "::error::Typed project ref does not match SUPABASE_PROJECT_REF"; exit 1; fi
      - name: Download and unpack the allocation files
        run: |
          mkdir -p "$RUNNER_TEMP/abs" && cd "$RUNNER_TEMP/abs"
          curl -sSfL --retry 3 -o alloc.zip "$ZIP_URL"
          sha256sum alloc.zip | cut -c1-64 > sha256.txt; stat -c %s alloc.zip > bytes.txt
          echo "sha256 $(cat sha256.txt), $(cat bytes.txt) bytes"
          unzip -o -j alloc.zip '*MB_2021_AUST.xlsx' '*POA_2021_AUST.xlsx' '*SUA_2021_AUST.xlsx'
          ls -l *.xlsx
      - name: Compute the shares
        run: |
          python3 -m pip install --quiet openpyxl==3.1.5
          cd "$RUNNER_TEMP/abs"
          python3 -I "$GITHUB_WORKSPACE/scripts/destination/abs_postcode_sua_shares.py" MB_2021_AUST.xlsx POA_2021_AUST.xlsx SUA_2021_AUST.xlsx shares.json
      - name: Load the shares
        run: |
          cd "$RUNNER_TEMP/abs"
          q() { jq -n --rawfile q "$1" '{query:$q}' > q.json; code=$(curl -sS -o r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @q.json "https://api.supabase.com/v1/projects/$REF/database/query"); if [ "$code" -ge 300 ]; then echo "::error::Management API $code: $(head -c 600 r.json)"; exit 1; fi; }
          n=$(jq '.rows | length' shares.json); size=1000  # fixed: request size for the Management API
          for ((i=0; i<n; i+=size)); do
            jq --arg v "$VINTAGE" --arg url "$ZIP_URL" --arg sha "$(cat sha256.txt)" --argjson bytes "$(cat bytes.txt)" --argjson i $i --argjson s $size \
              '{boundary_vintage:$v, source_url:$url, sha256:$sha, bytes:$bytes, files:["MB_2021_AUST.xlsx","POA_2021_AUST.xlsx","SUA_2021_AUST.xlsx"], rows:.rows[$i:$i+$s]}' shares.json > chunk.json
            if grep -q '\$abs\$' chunk.json; then echo "::error::payload contains the quote marker"; exit 1; fi
            { printf 'select security.destination_abs_shares_load_v1($abs$'; cat chunk.json; printf '$abs$::jsonb) as r;'; } > load.sql
            q load.sql; echo "rows $i..: $(jq -c '.[0].r' r.json)"
          done
      - name: First population and postcode load
        if: ${{ inputs.first_load }}
        run: |
          cd "$RUNNER_TEMP/abs"
          q() { printf '%s' "$1" > s.sql; jq -n --rawfile q s.sql '{query:$q}' > q.json; code=$(curl -sS -o r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @q.json "https://api.supabase.com/v1/projects/$REF/database/query"); if [ "$code" -ge 300 ]; then echo "::error::Management API $code: $(head -c 600 r.json)"; exit 1; fi; }
          q "select now() as t"; since=$(jq -r '.[0].t' r.json)
          q "select pipeline.svc_pilot_submit_nonce('layer1-destination-geo-loader', jsonb_build_object('mode', 'load', 'trigger', 'first_load')) as id"
          echo "edge request $(jq -r '.[0].id' r.json)"
          for t in $(seq 1 24); do
            sleep 10
            q "select action, detail from pipeline.admin_control_events where area = 'destination' and action in ('abs_load', 'abs_load_failed') and created_at >= '$since' order by created_at desc limit 1"
            if [ "$(jq 'length' r.json)" != "0" ]; then jq '.[0]' r.json; [ "$(jq -r '.[0].action' r.json)" = "abs_load" ] || { echo "::error::load failed"; exit 1; }; break; fi
          done
          if [ "$(jq 'length' r.json)" = "0" ]; then echo "::error::no load recorded within 4 minutes"; exit 1; fi
          q "select count(*) filter (where geography_type = 'SUA') as localities, count(*) filter (where coalesce(btrim(attribution_text), '') = '') as no_attribution, (select count(*) from destination.locality_metrics where metric_key = 'erp_persons') as figures, (select count(*) from destination.locality_postcodes where country_code = 'AU') as postcode_rows from destination.localities where country_code = 'AU'"
          jq '.[0]' r.json
