name: CourseFinder Deployed UAT

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed CourseFinder Admin URL
        required: true
        default: https://coursefinder-pilot.techm.workers.dev
        type: string
      tier:
        description: Validation tier
        required: true
        default: targeted
        type: choice
        options: [targeted, integration, acceptance]

permissions:
  contents: read
  statuses: write

concurrency:
  group: coursefinder-deployed-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployed-uat:
    name: Deployed UAT (${{ inputs.tier || 'targeted' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UAT_BASE_URL: ${{ inputs.base_url || 'https://coursefinder-pilot.techm.workers.dev' }}
      UAT_EMAIL: ${{ secrets.COURSEFINDER_UAT_EMAIL }}
      UAT_PASSWORD: ${{ secrets.COURSEFINDER_UAT_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve validation tier
        id: tier
        shell: bash
        run: |
          tier='${{ inputs.tier || 'targeted' }}'
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse HEAD^ >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^ HEAD)"
            if printf '%s\n' "$changed" | grep -qx '.github/m2-4-integration-candidate'; then tier='integration'; fi
            if printf '%s\n' "$changed" | grep -qx '.github/m2-4-acceptance-candidate'; then tier='acceptance'; fi
          fi
          case "$tier" in targeted|integration|acceptance) ;; *) echo "Invalid tier: $tier"; exit 1;; esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Resolved deployed UAT tier: $tier"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore npm and Playwright cache
        id: uat_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: uat-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            uat-${{ runner.os }}-node22-

      - name: Install dependencies
        run: npm install --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Preflight governed UAT credentials
        shell: bash
        run: |
          if [ -z "$UAT_EMAIL" ] || [ -z "$UAT_PASSWORD" ]; then
            echo "Required Actions secrets are missing: COURSEFINDER_UAT_EMAIL / COURSEFINDER_UAT_PASSWORD"
            exit 1
          fi
          case "$UAT_BASE_URL" in
            https://*) ;;
            *) echo "UAT_BASE_URL must use HTTPS for deployed acceptance"; exit 1 ;;
          esac

      - name: Allow Worker deployment to settle
        if: github.event_name == 'push'
        shell: bash
        run: |
          sleep 12
          for attempt in $(seq 1 6); do
            code=$(curl -L -sS -o /tmp/coursefinder-uat-home.html -w '%{http_code}' --max-time 12 "$UAT_BASE_URL/?uat_probe=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ]; then echo "Worker reachable for deployed UAT"; exit 0; fi
            echo "Worker not ready yet (HTTP ${code:-none}); retry ${attempt}/6"
            sleep 6
          done
          echo "Worker did not become reachable within the deployment-settle window"
          exit 1

      - name: Install Chromium browser
        run: npx playwright install chromium

      - name: Resolve governed validation suites
        id: suites
        shell: bash
        env:
          UAT_TIER: ${{ steps.tier.outputs.tier }}
        run: |
          changed=""
          if git rev-parse HEAD^ >/dev/null 2>&1; then changed="$(git diff --name-only HEAD^ HEAD)"; fi
          targeted=(tests/uat/layer1-operations-deployed.spec.mjs)
          if printf '%s\n' "$changed" | grep -Eq '(^src/layer2-|^supabase/(functions/layer2-|migrations/.*m2_4_2)|^tests/uat/layer2-)'; then
            targeted=(tests/uat/layer2-operations-maturity-deployed.spec.mjs)
          fi
          integration=(
            tests/uat/layer2-operations-maturity-deployed.spec.mjs
            tests/uat/layer2-platform-deployed.spec.mjs
            tests/uat/layer2-provider-deployed.spec.mjs
            tests/uat/layer1-operations-deployed.spec.mjs
            tests/uat/admin-navigation-deployed.spec.mjs
            tests/uat/data-quality-deployed.spec.mjs
            tests/uat/performance-deployed.spec.mjs
            tests/uat/screen-state-persistence-deployed.spec.mjs
            tests/uat/m2-3-intelligence-deployed.spec.mjs
            tests/uat/release-notes-deployed.spec.mjs
          )
          acceptance=(
            tests/uat/layer1-operations-deployed.spec.mjs
            tests/uat/data-quality-deployed.spec.mjs
            tests/uat/performance-deployed.spec.mjs
            tests/uat/layer2-operations-maturity-deployed.spec.mjs
            tests/uat/layer2-platform-deployed.spec.mjs
            tests/uat/layer2-provider-deployed.spec.mjs
            tests/uat/admin-navigation-deployed.spec.mjs
            tests/uat/course-detail-polish-deployed.spec.mjs
            tests/uat/screen-state-persistence-deployed.spec.mjs
            tests/uat/m2-3-intelligence-deployed.spec.mjs
            tests/uat/layer3-provider-credential-deployed.spec.mjs
            tests/uat/scholarship-selection-deployed.spec.mjs
            tests/uat/release-notes-deployed.spec.mjs
          )
          case "$UAT_TIER" in
            targeted) specs=("${targeted[@]}") ;;
            integration) specs=("${integration[@]}") ;;
            acceptance) specs=("${acceptance[@]}") ;;
          esac
          printf '%s\n' "${specs[@]}" > /tmp/uat-specs.txt
          printf 'Resolved %s tier with %s permanent suite(s)\n' "$UAT_TIER" "${#specs[@]}"

      - name: Run deployed governed validation — desktop
        id: desktop_uat
        shell: bash
        run: |
          mapfile -t specs < /tmp/uat-specs.txt
          npx playwright test "${specs[@]}" --project=chromium-desktop

      - name: Run deployed governed validation — mobile gate
        id: mobile_uat
        if: steps.tier.outputs.tier != 'targeted'
        shell: bash
        run: |
          mapfile -t specs < /tmp/uat-specs.txt
          npx playwright test "${specs[@]}" --project=chromium-mobile

      - name: Save npm and Playwright cache after run
        if: always() && steps.uat_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: uat-${{ runner.os }}-node22-${{ hashFiles('package.json') }}

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coursefinder-${{ steps.tier.outputs.tier }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            playwright-report/
            test-results/
            uat-artifacts/

      - name: Publish deployed UAT commit statuses
        if: always()
        shell: bash
        env:
          DESKTOP_OUTCOME: ${{ steps.desktop_uat.outcome }}
          MOBILE_OUTCOME: ${{ steps.mobile_uat.outcome }}
          UAT_TIER: ${{ steps.tier.outputs.tier }}
        run: |
          if [ "$DESKTOP_OUTCOME" = "success" ]; then desktop_state=success; else desktop_state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$desktop_state" \
            -f context="coursefinder/deployed-uat/${UAT_TIER}/chromium-desktop" \
            -f description="${UAT_TIER} deployed desktop UAT ${DESKTOP_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$UAT_TIER" != "targeted" ]; then
            if [ "$MOBILE_OUTCOME" = "success" ]; then mobile_state=success; else mobile_state=failure; fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$mobile_state" \
              -f context="coursefinder/deployed-uat/${UAT_TIER}/chromium-mobile" \
              -f description="${UAT_TIER} deployed mobile UAT ${MOBILE_OUTCOME}" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
