name: CourseFinder Deployed UAT

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed CourseFinder Admin URL
        required: true
        default: https://coursefinder-pilot.techm.workers.dev
        type: string
      tier:
        description: Validation tier
        required: true
        default: targeted
        type: choice
        options: [targeted, integration, acceptance]

permissions:
  contents: read
  statuses: write

concurrency:
  group: coursefinder-deployed-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployed-uat:
    name: Deployed UAT (${{ inputs.tier || 'targeted' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UAT_BASE_URL: ${{ inputs.base_url || 'https://coursefinder-pilot.techm.workers.dev' }}
      UAT_EMAIL: ${{ secrets.COURSEFINDER_UAT_EMAIL }}
      UAT_PASSWORD: ${{ secrets.COURSEFINDER_UAT_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve validation tier
        id: tier
        shell: bash
        run: |
          tier='${{ inputs.tier || 'targeted' }}'
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse HEAD^ >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^ HEAD)"
            if printf '%s\n' "$changed" | grep -qx '.github/m2-4-integration-candidate'; then tier='integration'; fi
            if printf '%s\n' "$changed" | grep -qx '.github/m2-4-acceptance-candidate'; then tier='acceptance'; fi
          fi
          case "$tier" in targeted|integration|acceptance) ;; *) echo "Invalid tier: $tier"; exit 1;; esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Resolved deployed UAT tier: $tier"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore npm and Playwright cache
        id: uat_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: uat-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            uat-${{ runner.os }}-node22-

      - name: Install dependencies
        run: npm install --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Preflight governed UAT credentials
        shell: bash
        run: |
          if [ -z "$UAT_EMAIL" ] || [ -z "$UAT_PASSWORD" ]; then
            echo "Required Actions secrets are missing: COURSEFINDER_UAT_EMAIL / COURSEFINDER_UAT_PASSWORD"
            exit 1
          fi
          case "$UAT_BASE_URL" in
            https://*) ;;
            *) echo "UAT_BASE_URL must use HTTPS for deployed acceptance"; exit 1 ;;
          esac

      - name: Allow Worker deployment to settle
        if: github.event_name == 'push'
        shell: bash
        run: |
          sleep 12
          for attempt in $(seq 1 6); do
            code=$(curl -L -sS -o /tmp/coursefinder-uat-home.html -w '%{http_code}' --max-time 12 "$UAT_BASE_URL/?uat_probe=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ]; then echo "Worker reachable for deployed UAT"; exit 0; fi
            echo "Worker not ready yet (HTTP ${code:-none}); retry ${attempt}/6"
            sleep 6
          done
          echo "Worker did not become reachable within the deployment-settle window"
          exit 1

      - name: Install Chromium browser
        run: npx playwright install chromium

      - name: Resolve governed validation suites
        id: suites
        shell: bash
        env:
          UAT_TIER: ${{ steps.tier.outputs.tier }}
        run: |
          changed=""
          if git rev-parse HEAD^ >/dev/null 2>&1; then changed="$(git diff --name-only HEAD^ HEAD)"; fi
          targeted=(tests/uat/layer1-operations-deployed.spec.mjs)
          if printf '%s\n' "$changed" | grep -Eq '(^src/layer2-|^supabase/(functions/layer2-|migrations/.*m2_4_2)|^tests/uat/layer2-)'; then
            targeted=(tests/uat/layer2-operations-maturity-deployed.spec.mjs)
          fi
          if printf '%s\n' "$changed" | grep -Eq '(^src/(mature-main\.jsx|EvidenceWorkspace\.jsx|lib/supabase\.js)$|^supabase/migrations/.*a10_.*filter|^tests/uat/a10-paged-filters-deployed\.spec\.mjs$)'; then
            targeted=(tests/uat/a10-paged-filters-deployed.spec.mjs)
          fi
          if printf '%s\n' "$changed" | grep -Eq '(^src/(ContextualInsights\.jsx|CourseDetailPolish\.jsx)$|^supabase/migrations/.*a12_.*contextual|^tests/uat/a12-contextual-insights-deployed\.spec\.mjs$)'; then
            targeted=(tests/uat/a12-contextual-insights-deployed.spec.mjs)
          fi
          if printf '%s\n' "$changed" | grep -Eq '(^src/(mature\.css|layer2-operations-entry\.jsx|layer2-operations\.css|EvidenceWorkspace\.jsx|evidence-workspace\.css)$|^supabase/functions/(layer2-acquire-v2|layer2-scope-discover-scheduled|layer2-screenshot-backfill-scheduled|admin-evidence-access)/|^supabase/migrations/.*a13_.*(provider_attempt|screenshot)|^tests/uat/a13-filter-demo-trace-deployed\.spec\.mjs$)'; then
            targeted=(tests/uat/a13-filter-demo-trace-deployed.spec.mjs)
          fi
          if printf '%s\n' "$changed" | grep -Eq '(^src/(mature-main\.jsx|pim-version-entry\.js)$|^supabase/functions/provider-contact-|^supabase/migrations/.*a15_|^tests/uat/a15-provider-contact-intelligence-deployed\.spec\.mjs$)'; then
            targeted=(tests/uat/a15-provider-contact-intelligence-deployed.spec.mjs)
          fi
          if printf '%s\n' "$changed" | grep -Eq '(^src/m2-3-intelligence-entry\.jsx$|^supabase/functions/layer3-|^supabase/migrations/.*m2_4_3_|^tests/uat/m2-4-3-layer3-operations-deployed\.spec\.mjs$)'; then
            targeted=(tests/uat/m2-4-3-layer3-operations-deployed.spec.mjs)
          fi
          if printf '%s\n' "$changed" | grep -Eq '(^supabase/migrations/.*m2_4_4_|^tests/uat/m2-4-4-cross-layer-operations-deployed\.spec\.mjs$)'; then
            targeted=(tests/uat/m2-4-4-cross-layer-operations-deployed.spec.mjs)
