# Firecrawl Monitor watchlist (CF-247 s1027, S1-Build; Platform Admin 24 Nov 2026 06:03 and 09:06 AEDT; UI-UX plan v1.2 slice 8). By hand only:
# register (plan the watchlist within firecrawl.monitor_weekly_credits and create or update the monitors), status, or pause (every monitor).
# Firecrawl runs the weekly checks itself; this workflow schedules nothing. It calls firecrawl-monitor-webhook with a one-time nonce through
# the Management API (scripts/firecrawl-monitor.mjs).
name: Firecrawl Monitor
on:
  workflow_dispatch:
    inputs:
      action:
        description: "register, status or pause"
        required: true
        default: "status"
        type: choice
        options: [register, status, pause]
concurrency:
  group: firecrawl-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check settings
        run: |
          if [ "$REF" != "fxcwkweaxjtknorudmwp" ]; then echo "Refusing project $REF"; exit 1; fi
      - name: Run
        run: node scripts/firecrawl-monitor.mjs "$ACTION"
