name: CF-093 Deploy Discovery Worker

on:
  push:
    branches:
      - m245/cf093-async-discovery-20260912
    paths:
      - '.github/workflows/cf093-deploy-discovery-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m245/cf093-async-discovery-20260912
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify worker version under deployment
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'layer2-scope-discover-scheduled-v1.3.10' supabase/functions/layer2-scope-discover-scheduled/index.ts
      - name: Deploy governed worker preserving custom auth boundary
        run: supabase functions deploy layer2-scope-discover-scheduled --project-ref fxcwkweaxjtknorudmwp --no-verify-jwt
