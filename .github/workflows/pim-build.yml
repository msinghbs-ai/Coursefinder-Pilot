name: Pilot Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build
        run: npm run build

  browser-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate UAT suite discovery
        run: npx playwright test --list
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run local browser smoke
        run: npm run test:uat:smoke
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            uat-artifacts/

  deploy-pilot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: browser-smoke
    runs-on: ubuntu-latest
    environment: pilot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preflight Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Required Actions secret is missing: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Required Actions secret is missing: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build release assets
        run: npm run build
      - name: Deploy Pilot Worker
        run: npx wrangler deploy
      - name: Verify deployed Worker is reachable
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            code=$(curl -L -sS -o /tmp/coursefinder-pilot.html -w '%{http_code}' --max-time 15 "https://coursefinder-pilot.techm.workers.dev/?deploy_probe=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ]; then
              echo "Pilot Worker reachable after deploy"
              exit 0
            fi
            echo "Pilot Worker not ready yet (HTTP ${code:-none}); retry ${attempt}/10"
            sleep 6
          done
          echo "Pilot Worker did not become reachable after deploy"
          exit 1
