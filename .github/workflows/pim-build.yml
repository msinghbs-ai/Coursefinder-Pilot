name: Pilot Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: pilot-npm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            pilot-npm-${{ runner.os }}-node22-
      - name: Install dependencies
        run: npm install --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Upload built Pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: coursefinder-pilot-dist-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: dist/
      - name: Validate UAT suite discovery
        run: npx playwright test --list
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pilot-playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            pilot-playwright-${{ runner.os }}-
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run local browser smoke
        run: npm run test:uat:smoke
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            uat-artifacts/
