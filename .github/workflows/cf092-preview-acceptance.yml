name: CF-092 preview acceptance
on: [push]
permissions:
  contents: write
jobs:
  preview:
    if: github.ref == 'refs/heads/feature/m245-scheduled-jobs-config-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UAT_BASE_URL: https://feature-m245-scheduled-jobs-config-20260910-coursefinder-pilot.techm.workers.dev
      UAT_EMAIL: ${{ secrets.COURSEFINDER_UAT_EMAIL }}
      UAT_PASSWORD: ${{ secrets.COURSEFINDER_UAT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and Chromium
        run: |
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
      - name: Wait for branch preview
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS -o /tmp/cf092.html -w '%{http_code}' --max-time 15 "$UAT_BASE_URL/?cf092=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Source contract
        run: npx playwright test tests/uat/cf-092-scheduled-jobs-config-contract.spec.mjs --project=chromium-desktop
      - name: Deployed Scheduled Tasks and navigation
        run: npx playwright test tests/uat/cf-092-scheduled-jobs-config-deployed.spec.mjs tests/uat/admin-navigation-deployed.spec.mjs --project=chromium-desktop
      - name: Focused ranking regression
        run: |
          files=""
          for f in tests/uat/*ranking*contract*.spec.mjs tests/uat/*qs*contract*.spec.mjs tests/uat/*ranking*deployed*.spec.mjs tests/uat/*qs*deployed*.spec.mjs; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -n "$files" ]; then npx playwright test $files --project=chromium-desktop; else echo 'No focused ranking regression specs found'; fi
      - name: Remove helper
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f package-lock.json .github/workflows/cf092-preview-acceptance.yml
          git add -A
          git commit -m 'CF-092 complete preview acceptance helper cleanup'
          git push origin HEAD:feature/m245-scheduled-jobs-config-20260910
