# Guards: F-AER.04 discovery campaign spare capacity (Platform Admin decision D2, 11 Nov 2026) and G4 database-backed tests: migration 20261112103900 (credit-count fix, spare room inside the daily total and above the vendor floor, metrics) on an isolated PostgreSQL 16 (fixtures only, never a Supabase project).
name: AER discovery spare capacity integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261112103900_cf247_aer_discovery_spare.sql'
      - 'supabase/held/aer_discovery_spare_forward_recovery.sql'
      - 'tests/fixtures/aer-discovery-spare/**'
      - 'tests/fixtures/aer-discovery-campaign/**'
      - 'supabase/migrations/20261112040000_cf247_aer_discovery_campaign.sql'
      - '.github/workflows/aer-discovery-spare-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/aer-discovery-spare/run.sh | tee aer-discovery-spare-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aer-discovery-spare-database-evidence
          path: aer-discovery-spare-results.log
