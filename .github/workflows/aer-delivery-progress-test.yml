# Guards: F-AER.04 delivery reported through the existing Data Delivery screen (decision delivery item 6, 11 Nov 2026) and G4 database-backed tests: migration 20261112133700 (Data Delivery AER panel stage 4 read) on an isolated PostgreSQL 16 (fixtures only, never a Supabase project).
name: AER delivery progress integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261112133700_cf247_aer_delivery_progress.sql'
      - 'tests/fixtures/aer-delivery-progress/**'
      - '.github/workflows/aer-delivery-progress-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/aer-delivery-progress/run.sh | tee aer-delivery-progress-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aer-delivery-progress-database-evidence
          path: aer-delivery-progress-results.log
