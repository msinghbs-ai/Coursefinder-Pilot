# CF-247 S1-Build s782 (Platform Admin 19 Nov 2026 23:10, "Sync migration from supabase to repo so they are same"): reads production's
# migration history (supabase_migrations.schema_migrations) through the Management API in read-only queries, writes the text of every
# applied version the repository does not already hold to supabase/migration-history/applied/ with MANIFEST.tsv, and pushes the result to a
# branch db-history-sync/<run id> for a PR. It changes nothing in the database and never touches supabase/migrations (Deploy on merge
# applies only that folder). It refuses to write when an applied text looks like it holds a key or password, because the repository is public.
name: Migration history sync (read only)
on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: 'Type the Pilot project ref to confirm'
        required: true
concurrency:
  group: db-migration-history-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CONFIRM: ${{ inputs.confirm_project }}
    steps:
      - uses: actions/checkout@v4
      - name: Export the production migration history (read only)
        run: |
          set -euo pipefail
          if [ -z "$REF" ] || [ "$CONFIRM" != "$REF" ]; then echo "::error::Refused: the typed project ref does not match the Pilot"; exit 1; fi
          mkdir -p out; : > out/history.jsonl; last=''; n=0
          while :; do
            q="select coalesce(json_agg(json_build_object('version',version,'name',name,'statements',statements) order by version),'[]'::json) as rows from (select version, name, statements from supabase_migrations.schema_migrations where version > '$last' order by version limit 120) s"
            jq -n --arg q "$q" '{query:$q, read_only:true}' > q.json
            code=$(curl -sS -o r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @q.json "https://api.supabase.com/v1/projects/$REF/database/query")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then echo "::error::HTTP $code $(head -c 400 r.json)"; exit 1; fi
            c=$(jq '.[0].rows | length' r.json); [ "$c" -gt 0 ] || break
            jq -c '.[0].rows[]' r.json >> out/history.jsonl
            last=$(jq -r '.[0].rows[-1].version' r.json); n=$((n+c))
          done
          echo "Exported $n history rows (last $last)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Reconcile, scan and push a branch
        run: |
          set -euo pipefail
          node scripts/migration-history-sync.mjs out/history.jsonl --scan --write | tee -a "$GITHUB_STEP_SUMMARY"
          if git diff --quiet && [ -z "$(git status --porcelain supabase/migration-history)" ]; then echo "Repository already matches the history." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          b="db-history-sync/${{ github.run_id }}"; git checkout -q -b "$b"
          git add -A supabase/migration-history
          git commit -q -m "Production migration history written to the repository (run ${{ github.run_id }})"
          git push -q origin "$b"; echo "Branch: $b" | tee -a "$GITHUB_STEP_SUMMARY"
