name: Intake Run and Validate integration
on:
  pull_request:
    paths:
      - 'src/IntakeRunValidate.jsx'
      - 'src/intake-run-api.js'
      - 'supabase/migrations/*intake*'
      - 'tests/fixtures/intake-ui/**'
      - 'tests/fixtures/intake-preview-timeout/**'
      - 'tests/fixtures/intake-calendar-v2/**'
      - 'tests/fixtures/intake-recovery-final/**'
      - 'tests/fixtures/intake-fairness/**'
      - 'tests/fixtures/deakin-intake-calendar/**'
      - 'tests/fixtures/intake-self-driving/**'
      - 'tests/fixtures/intake-calendar-qualify/**'
      - 'docs/paste/PASTE-20261108-iq00313-deakin-intake-withdrawal.sql'
      - 'supabase/functions/coverage-sweep/calendar.ts'
      - 'tests/integration/intake-postgres.spec.mjs'
      - 'playwright.intake.config.mjs'
      - '.github/workflows/intake-run-validate-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: bash tests/fixtures/intake-preview-timeout/run.sh | tee intake-sql-results.log
      - run: bash tests/fixtures/intake-calendar-v2/run.sh | tee intake-calendar-v2-results.log
      - run: npx playwright test --config=playwright.intake.config.mjs
      - run: psql -X -v ON_ERROR_STOP=1 -d intake_ui_fixtures -f tests/fixtures/intake-ui/post.sql
      - run: bash tests/fixtures/intake-calendar-v2/browser.sh | tee intake-calendar-v2-browser.log
      - run: bash tests/fixtures/intake-recovery-final/run.sh | tee intake-recovery-final-results.log
      - run: bash tests/fixtures/intake-recovery-final/browser.sh | tee intake-recovery-final-browser.log
      - run: bash tests/fixtures/intake-fairness/run.sh | tee intake-fairness-results.log
      - run: bash tests/fixtures/intake-fairness/browser.sh | tee intake-fairness-browser.log
      - run: DK_KEEP=1 bash tests/fixtures/deakin-intake-calendar/run.sh | tee intake-deakin-calendar-results.log
      - run: SD_REUSE=1 SD_KEEP=1 bash tests/fixtures/intake-self-driving/run.sh | tee intake-self-driving-results.log
      - run: CQ_REUSE=1 bash tests/fixtures/intake-calendar-qualify/run.sh | tee intake-calendar-qualify-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-local-database-evidence
          path: |
            intake-sql-results.log
            intake-calendar-v2-results.log
            intake-calendar-v2-browser.log
            intake-recovery-final-results.log
            intake-recovery-final-browser.log
            intake-fairness-results.log
            intake-fairness-browser.log
            intake-deakin-calendar-results.log
            intake-self-driving-results.log
            intake-calendar-qualify-results.log
            uat-artifacts/intake-integration.json
            uat-artifacts/intake-benchmark.json
            uat-artifacts/intake-timeout-regression.json
            uat-artifacts/intake-db-results/
