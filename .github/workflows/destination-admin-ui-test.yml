# Guards: Admin destination data UI and ingestion specification v1.2 (RM0F; decisions G-2, G-3, G-5, Platform Admin 17 Nov 2026) and G4 database-backed tests: migration 20261117131500 on top of the destination schema runs its wrappers, Layer 4 kind hook, locality decorator and Admin reads on an isolated PostgreSQL 16 (fixtures only, never a Supabase project).
name: Destination admin UI integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261115190000_api_v3_additive_schema.sql'
      - 'supabase/migrations/20261115230000_cf247_destination_importer_guard.sql'
      - 'supabase/migrations/20261117040000_cf247_rm_destination_schema_pack.sql'
      - 'supabase/migrations/20261117131500_cf247_rm0f_destination_admin_ui.sql'
      - 'tests/fixtures/destination-schema-pack/stubs.sql'
      - 'tests/fixtures/destination-editions/stubs.sql'
      - 'tests/fixtures/destination-admin-ui/**'
      - '.github/workflows/destination-admin-ui-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/destination-admin-ui/run.sh | tee destination-admin-ui-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: destination-admin-ui-database-evidence
          path: destination-admin-ui-results.log
