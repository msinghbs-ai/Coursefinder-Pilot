name: m245-compare-ui-bugfix
on:
  push:
    branches:
      - cf-m245-compare-ui-bugfix-20260907
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf-m245-compare-ui-bugfix-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python .github/scripts/m245_compare_patch.py
      - run: npm install --no-package-lock
      - run: npx playwright test tests/uat/m245-compare-ui-bugfix-contract.spec.mjs --reporter=line
      - run: npm run build
      - run: |
          rm .github/workflows/m245-compare-ui-bugfix.yml
          rm .github/scripts/m245_compare_patch.py
          git config user.name coursefinder-ui-bot
          git config user.email coursefinder-ui-bot@users.noreply.github.com
          git add -A
          git commit -m 'M2.4.5 fix Compare ranking years and sticky provider headers'
          git push origin HEAD:cf-m245-compare-ui-bugfix-20260907