name: Release History Contract

on:
  pull_request:
    paths:
      - 'src/release-manifest.js'
      - 'src/pim-version-entry.js'
      - 'src/release-currentness-entry.js'
      - 'src/mature-main.jsx'
      - 'index.html'
      - 'package.json'
      - 'CHANGELOG.md'
      - 'scripts/verify-release-contract.mjs'
      - 'tests/uat/m245-release-history-v21575-persistence-contract.spec.mjs'
      - '.github/workflows/release-history-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/release-manifest.js'
      - 'src/pim-version-entry.js'
      - 'src/release-currentness-entry.js'
      - 'src/mature-main.jsx'
      - 'index.html'
      - 'package.json'
      - 'CHANGELOG.md'
      - 'scripts/verify-release-contract.mjs'
      - 'tests/uat/m245-release-history-v21575-persistence-contract.spec.mjs'
      - '.github/workflows/release-history-contract.yml'

permissions:
  contents: read

jobs:
  release-history-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify canonical release manifest and recovery baseline
        run: npm run release:verify
      - name: Verify maintained release history contract
        run: npx playwright test tests/uat/m245-release-history-v21575-persistence-contract.spec.mjs --project=chromium-desktop
