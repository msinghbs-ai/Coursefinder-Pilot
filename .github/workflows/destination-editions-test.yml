# Guards: REQ-68 destination publication guard and REQ-65/67 importer (Platform Admin 15 Nov 2026 23:04, combined build item 4) and G4 database-backed tests: migration 20261115230000 on top of 20261115190000 runs its importer, terms and publication rules on an isolated PostgreSQL 16 (fixtures only, never a Supabase project).
name: Destination editions importer and guard integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261115190000_api_v3_additive_schema.sql'
      - 'supabase/migrations/20261115230000_cf247_destination_importer_guard.sql'
      - 'tests/fixtures/destination-editions/**'
      - '.github/workflows/destination-editions-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/destination-editions/run.sh | tee destination-editions-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: destination-editions-database-evidence
          path: destination-editions-results.log
