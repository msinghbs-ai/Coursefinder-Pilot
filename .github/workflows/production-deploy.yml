name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      region:
        description: Production region to deploy
        required: true
        default: ALL
        type: choice
        options:
          - ALL
          - AU
          - UK
          - US
          - CA

permissions:
  contents: read

concurrency:
  group: production-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.region }}
    if: github.ref == 'refs/heads/main' && (inputs.region == 'ALL' || inputs.region == matrix.region)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: AU
            environment: production-au
          - region: UK
            environment: production-uk
          - region: US
            environment: production-us
          - region: CA
            environment: production-ca
    environment:
      name: ${{ matrix.environment }}
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate environment boundary
        shell: bash
        run: |
          set -euo pipefail

          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_PAGES_PROJECT; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required environment-scoped value is missing: $name" >&2
              exit 1
            fi
          done

          if [[ ! "$VITE_SUPABASE_URL" =~ ^https://[a-z0-9]+\.supabase\.co$ ]]; then
            echo "SUPABASE_URL must be an environment-scoped canonical Supabase project URL." >&2
            exit 1
          fi

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: production-npm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            production-npm-${{ runner.os }}-node22-

      - name: Install dependencies
        run: npm install --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build production artifact
        run: npm run build

      - name: Deploy Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required deployment secret is missing: $name" >&2
              exit 1
            fi
          done

          npx wrangler pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main
