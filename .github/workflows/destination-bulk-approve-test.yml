# Guards: Destination data › Bulk Approve Drafts (Platform Admin 18 Nov 2026 07:39) and G4 database-backed tests: migration 20261118090707 runs its function on an isolated PostgreSQL 16 (fixtures only, never a Supabase project).
name: Destination bulk approve integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261118090707_cf247_destination_localities_bulk_approve.sql'
      - 'supabase/migrations/20261118110707_cf247_destination_figures_bulk_approve.sql'
      - 'tests/fixtures/destination-bulk-approve/**'
      - 'tests/fixtures/destination-admin-ui/stubs.sql'
      - 'tests/fixtures/destination-editions/stubs.sql'
      - 'tests/fixtures/destination-schema-pack/stubs.sql'
      - 'supabase/migrations/20261117131500_cf247_rm0f_destination_admin_ui.sql'
      - 'supabase/migrations/20261117040000_cf247_rm_destination_schema_pack.sql'
      - '.github/workflows/destination-bulk-approve-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/destination-bulk-approve/run.sh | tee destination-bulk-approve-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: destination-bulk-approve-database-evidence
          path: destination-bulk-approve-results.log
