name: Pilot Emergency Rollback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pilot-emergency-rollback.yml'

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: pilot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Roll back Pilot Worker to previous deployed version
        run: npx wrangler rollback --name coursefinder-pilot --message "CF-227 emergency rollback after blank Worker deployment"
      - name: Verify Worker responds
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            code=$(curl -L -sS -o /tmp/coursefinder-pilot.html -w '%{http_code}' --max-time 15 "https://coursefinder-pilot.techm.workers.dev/?rollback_probe=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ]; then
              echo "Pilot Worker reachable after rollback"
              exit 0
            fi
            sleep 6
          done
          exit 1
