name: CF-221 dashboard health
on:
  push:
    paths: ['.github/workflows/cf221-dashboard-health.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/mature-main.jsx');s=p.read_text()
          old="  const[data,setData]=useState(null),[layerStatus,setLayerStatus]=useState(null),[busy,setBusy]=useState(true)\n  const load=()=>{setBusy(true);Promise.all([adminRead('dashboard'),adminRead('layer_status_summary')]).then(([d,l])=>{setData(d);setLayerStatus(l)}).catch(e=>onError(e.message)).finally(()=>setBusy(false))}"
          new="  const[data,setData]=useState(null),[layerStatus,setLayerStatus]=useState(null),[platformHealth,setPlatformHealth]=useState(null),[busy,setBusy]=useState(true)\n  const load=()=>{setBusy(true);Promise.all([adminRead('dashboard'),adminRead('layer_status_summary'),adminRead('platform_health')]).then(([d,l,h])=>{setData(d);setLayerStatus(l);setPlatformHealth(h)}).catch(e=>onError(e.message)).finally(()=>setBusy(false))}"
          if s.count(old)!=1: raise SystemExit(f'dashboard load anchor {s.count(old)}')
          s=s.replace(old,new,1)
          old='    <div className="m-metric-grid">{metrics.map(([label,value,Icon,tone,target])=><button className={`m-metric-card tone-${tone}`} key={label} onClick={()=>navigate(target)}><span className="m-metric-icon"><Icon size={18}/></span><span className="m-metric-copy"><small>{label}</small><strong>{fmtNumber(value)}</strong></span><span className="m-metric-arrow">→</span></button>)}</div>'
          new=old+'\n    {platformHealth&&<section className="m-panel"><PanelTitle icon={ShieldCheck} title="Platform health" subtitle="Role-filtered runtime, Edge workload, security and data-movement signals"/><div className="m-pulse-grid"><Pulse label="Running jobs" value={platformHealth.jobs?.running} tone={platformHealth.jobs?.running?\'info\':\'neutral\'} icon={Workflow}/><Pulse label="Failed · 24h" value={platformHealth.jobs?.failed_24h} tone={platformHealth.jobs?.failed_24h?\'danger\':\'success\'} icon={AlertTriangle}/><Pulse label="Evidence fetched · 24h" value={platformHealth.data?.evidence_fetched_24h} tone="violet" icon={FileCheck2}/><Pulse label="Edge workloads · 24h" value={platformHealth.edge_runtime?.completed_24h} tone="teal" icon={Activity}/></div>{platformHealth.api_activity&&<div className="m-freshness"><Fresh label="Layer 2 provider API calls · 24h" value={platformHealth.api_activity.layer2_provider_requests_24h} number/><Fresh label="Layer 3 model calls · 24h" value={platformHealth.api_activity.layer3_external_calls_24h} number/><Fresh label="Layer 3 cost · 24h" value={`$${Number(platformHealth.api_activity.layer3_cost_24h_usd||0).toFixed(4)}`}/><Fresh label="Scholarship AI active runs" value={platformHealth.scholarship_ai?.active_runs} number/></div>}{platformHealth.security&&<div className="m-summary-note"><strong>Security · {humanise(platformHealth.security.status)}</strong><span>{platformHealth.security.note}</span></div>}</section>}'
          if s.count(old)!=1: raise SystemExit(f'dashboard render anchor {s.count(old)}')
          s=s.replace(old,new,1)
          s=s.replace("const UI_VERSION='2.15.57'","const UI_VERSION='2.15.58'",1)
          p.write_text(s)
          PY
          rm .github/workflows/cf221-dashboard-health.yml
          git config user.name coursefinder-cf221-bot
          git config user.email actions@users.noreply.github.com
          git add src/mature-main.jsx .github/workflows/cf221-dashboard-health.yml
          git commit -m 'CF-221 add role-aware platform health dashboard'
          git push origin HEAD:main
