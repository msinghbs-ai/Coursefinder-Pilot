# Platform watchdog (CF-247 Decision 5 E-9 W1, Platform Admin 2 Nov 2026 10:56). Hourly, from outside the platform: independent of the
# Claude scheduler, the alert-collecting task and pg_cron. One read-only query (security.platform_watchdog_v1, run as the read-only role):
# platform-health and platform-alerts are scheduled, switched on, started within alerts.watchdog_stale_minutes and did not fail last time,
# and no alert has waited longer than alerts.collect_within_minutes. When anything is wrong the run FAILS, so GitHub e-mails its own
# notification (for a scheduled workflow: the person who last changed this schedule line). No webhook, no new recipient, no secret printed.
# Uses the same secret and project-ref variable as the other database workflows (edge-drift-check, component-register).
# Runs at :24, off the busy minutes (admission jobs at :x3, :x5, :x9 from v2.15.403, before that :x0, :x3, :x8; platform-alerts :x0;
# platform-health :x8; exit awards :37; adapter apply :40).
name: Platform watchdog
on:
  schedule:
    - cron: '24 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-watchdog
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check settings
        run: |
          if [ -z "$REF" ]; then echo "::error::Repository variable SUPABASE_PROJECT_REF is not set"; exit 1; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; fi
      - name: Read the alert path (read-only)
        run: |
          jq -n '{query: "select security.platform_watchdog_v1() as w", read_only: true}' > "$RUNNER_TEMP/q.json"
          code=$(curl -sS -m 60 -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @"$RUNNER_TEMP/q.json") || code=000
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::The watchdog could not read the platform (HTTP $code): $(head -c 300 "$RUNNER_TEMP/out.json" 2>/dev/null | tr -d '\n')"
            echo "## Platform watchdog: could not read the platform (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          jq '.[0].w' "$RUNNER_TEMP/out.json" > "$RUNNER_TEMP/w.json"
          {
            echo "## Platform watchdog"
            echo '```json'; cat "$RUNNER_TEMP/w.json"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.ok' "$RUNNER_TEMP/w.json")" != "true" ]; then
            jq -r '.problems[]? // "the answer had no result"' "$RUNNER_TEMP/w.json" | while IFS= read -r p; do echo "::error::$p"; done
            exit 1
          fi
          echo "Alert path healthy: $(jq -c '.jobs' "$RUNNER_TEMP/w.json")"
