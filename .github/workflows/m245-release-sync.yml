name: M2.4.5 Release Sync
on:
  push:
    branches: [cf-m245-v2-15-73-release-sync-20260907]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf-m245-v2-15-73-release-sync-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize release authorities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          version='2.15.73'
          date='7 Sep 2026'

          p=Path('src/mature-main.jsx')
          s=p.read_text()
          s=s.replace("const UI_VERSION='2.15.71'",f"const UI_VERSION='{version}'",1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace('Coursefinder PIM Admin v2.15.71',f'Coursefinder PIM Admin v{version}',1)
          p.write_text(s)

          p=Path('src/release-currentness-entry.js')
          s=p.read_text()
          s=re.sub(r"const VERSION='2\.15\.71'",f"const VERSION='{version}'",s,count=1)
          block=f'''const RELEASE={{
            version:VERSION,
            date:'{date}',
            title:'Fluid catalogues, ranking datasets and Provider comparison',
            changes:[
              'Scholarship Catalogue now includes a bounded Provider filter and fluid columns while server authority continues to own filtering, paging and meaningful ordering.',
              'QILT and PRISMS datasets use governed server-backed sorting with fluid tables; QS and THE provide Open Dataset and Compare with edition-aware, server-backed ordering.',
              'Provider Compare enables QS and THE by default when accepted data exists, defaults each system to its latest retained edition and shows historical editions independently beneath the current observation.',
              'Provider identity stays visible while wide comparison data scrolls, and the accepted UI passed targeted source/build/browser gates, bounded 1600/1366/900/390 viewport validation and deployed Pilot UAT.',
              'The Scholarship provider_id and ranking sort/direction read-contract reconciliation preserves role/rank, Provider equivalence, Evidence and publication semantics. Production is unchanged; superseded v2.15.72 remains forensic history only.'
            ]
          }}'''
          s=re.sub(r"const RELEASE=\{[\s\S]*?\n\}\nlet pending=false",block+'\nlet pending=false',s,count=1)
          p.write_text(s)

          p=Path('src/pim-version-entry.js')
          s=p.read_text()
          s=re.sub(r"^const VERSION='[^']+'",f"const VERSION='{version}'",s,count=1)
          entry="  {version:'2.15.73',date:'7 Sep 2026',title:'Fluid catalogues, ranking datasets and Provider comparison',changes:['Scholarship Catalogue adds a bounded Provider filter with server-authoritative paging/filtering and fluid sortable columns.','QILT/PRISMS and QS/THE dataset views use fluid tables and meaningful server-backed ordering; QS/THE expose Open Dataset and Compare without mixing ranking semantics with outcomes data.','Provider Compare defaults QS/THE on when accepted data exists, uses each latest retained edition by default, shows historical editions independently, and keeps Provider identity visible while comparison data scrolls.','The accepted candidate passed targeted source/build/browser checks, bounded 1600/1366/900/390 viewport validation and deployed Pilot UAT; Production is unchanged and superseded v2.15.72 remains forensic history only.']},\n"
          s=s.replace('const RELEASES=[\n','const RELEASES=[\n'+entry,1)
          p.write_text(s)

          p=Path('tests/uat/m245-ui-improvements-contract.spec.mjs')
          s=p.read_text().replace("const UI_VERSION='2.15.71'","const UI_VERSION='2.15.73'",1)
          s=s.replace('No release/version promotion before functional acceptance.','Post-acceptance release/currentness is synchronized after functional acceptance.')
          p.write_text(s)
          PY
      - name: Verify synchronization
        shell: bash
        run: |
          grep -q "const UI_VERSION='2.15.73'" src/mature-main.jsx
          grep -q "PIM Admin v2.15.73" index.html
          grep -q "const VERSION='2.15.73'" src/release-currentness-entry.js
          grep -q "const VERSION='2.15.73'" src/pim-version-entry.js
          grep -q "version:'2.15.73'" src/pim-version-entry.js
          grep -q "const UI_VERSION='2.15.73'" tests/uat/m245-ui-improvements-contract.spec.mjs
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/m245-release-sync.yml
          git config user.name coursefinder-ui-bot
          git config user.email coursefinder-ui-bot@users.noreply.github.com
          git add src/mature-main.jsx index.html src/release-currentness-entry.js src/pim-version-entry.js tests/uat/m245-ui-improvements-contract.spec.mjs .github/workflows/m245-release-sync.yml
          git commit -m 'M2.4.5 synchronize accepted release to v2.15.73'
          git push origin HEAD:cf-m245-v2-15-73-release-sync-20260907
