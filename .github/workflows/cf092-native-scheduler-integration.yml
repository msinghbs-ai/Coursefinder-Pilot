name: CF-092 Native Scheduler Integration

on:
  push:
    branches:
      - feature/m245-scheduled-jobs-config-20260910
    paths:
      - .github/workflows/cf092-native-scheduler-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m245-scheduled-jobs-config-20260910
          fetch-depth: 0
      - name: Replace legacy Refresh implementation with native Scheduled Jobs workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/m2-3-intelligence-entry.jsx')
          workflow = Path('.github/workflows/cf092-native-scheduler-integration.yml')
          text = source.read_text()
          import_anchor = "import{supabase,api}from'./lib/supabase'\n"
          import_line = "import ScheduledJobsWorkspace from'./ScheduledJobsWorkspace'\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('supabase/api import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          start_marker = 'export function Refresh({onError}){'
          end_marker = '\n\nexport function Links'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('legacy Refresh implementation not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Refresh end marker not found')
          text = text[:start] + 'export const Refresh=ScheduledJobsWorkspace' + text[end:]
          source.write_text(text)
          workflow.unlink()
          PY
      - name: Commit native integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/m2-3-intelligence-entry.jsx .github/workflows/cf092-native-scheduler-integration.yml
          git commit -m "CF-092 integrate native Scheduled Jobs workspace"
          git push origin HEAD:feature/m245-scheduled-jobs-config-20260910
