# AER entry-matrix stored pages: read-only export (CF-247 S742, session S2-BOOST-AER; Platform Admin 19 Nov 2026 05:42 item 3, and 17 Nov 2026 22:05: database runs go through
# GitHub Actions and the Management API, with no confirmation prompt). Lists the entry-matrix reads waiting in Layer 4 with the machine check's rule and asks the coverage-sweep
# worker's read-only mode entry_inspect for their stored copies (title, h1, raw table markup, content hash; no model call, no web fetch, no write). The file is kept as an artifact:
# it is the source of the S745 chunker fixtures.
name: AER entry-matrix stored pages (read only)
on:
  workflow_dispatch:
    inputs:
      rules:
        description: "Machine check rules to export (comma-separated)"
        required: true
        default: "gate_incomplete,all_rows_held"
concurrency:
  group: aer-entry-inspect
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export the stored pages
        run: node scripts/aer-entry-inspect.mjs "${{ inputs.rules }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: aer-entry-pages
          path: out/
          if-no-files-found: ignore
