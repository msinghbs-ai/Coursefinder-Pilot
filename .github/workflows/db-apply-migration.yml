# Apply one database migration file to the Pilot (CF-247, 11 Oct 2026; Platform Admin decision "yes, apply overnight": changes go in
# through this workflow with the same md5 checks before and after; anything that drops or deletes is pasted by the Platform Admin).
# The file and its history row are applied in ONE transaction through the Supabase Management API, exactly as a paste in the SQL
# editor would. The file's own md5 guard blocks stop it (and roll everything back) if a live function differs from what it replaces.
# Safety:
#  - the typed project ref must match the repository variable SUPABASE_PROJECT_REF (never the demo project);
#  - only a file under supabase/migrations named <14 digits>_<name>.sql, taken from the given branch or commit;
#  - skipped if its version is already in the migration history (Phase 3: deploy-on-merge applies new files on merge to main);
#  - refused if any top-level statement drops, deletes or truncates (those are pasted by the Platform Admin);
#  - after applying, the history row's md5 is read back and must equal the file's.
name: Database apply migration
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Migration file name under supabase/migrations (e.g. 20261011007100_cf247_s1_x.sql)"
        required: true
      git_ref:
        description: "Branch or commit holding the file"
        required: true
      project_ref:
        description: "Type the target project ref to confirm"
        required: true
      controller_execution:
        description: "Active controller execution ID (must match the canonical reservation)"
        required: true
      controller_generation:
        description: "Active controller generation (non-secret fencing identifier)"
        required: true
      controller_operation:
        description: "Immutable operation ID already reserved by the active controller"
        required: true
concurrency:
  group: studysearch-controller-production
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: pilot
    permissions:
      contents: read
    env:
      CONTROLLER_EXECUTION_ID: ${{ inputs.controller_execution }}
      CONTROLLER_GENERATION: ${{ inputs.controller_generation }}
      CONTROLLER_OPERATION_ID: ${{ inputs.controller_operation }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FILE: ${{ inputs.file }}
      REF: ${{ inputs.project_ref }}
    steps:
      # The verifier belongs to this protected workflow revision, not the code
      # being recovered. A pre-guard candidate may legitimately lack the file.
      - name: Checkout the trusted controller verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - name: Preserve the trusted verifier outside the candidate checkout
        env:
          CONTROLLER_VERIFIER_COMMIT: ${{ github.workflow_sha }}
        run: |
          install -m 0500 scripts/ci/controller-guard.py "$RUNNER_TEMP/studysearch-controller-guard.py"
          echo "Controller verifier workflow commit: $CONTROLLER_VERIFIER_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$RUNNER_TEMP/studysearch-controller-guard.py" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout the authorised migration source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - name: Confirm target
        run: |
          if [ -z "${{ vars.SUPABASE_PROJECT_REF }}" ] || [ "$REF" != "${{ vars.SUPABASE_PROJECT_REF }}" ]; then echo "::error::Typed project ref does not match SUPABASE_PROJECT_REF"; exit 1; fi
      - name: Apply in one transaction with its history row
        # CF-247 Phase 3 (19 Oct 2026): the same script deploy-on-merge uses; a version already in the history is skipped
        run: |
          python3 "$RUNNER_TEMP/studysearch-controller-guard.py" --entry-point db-apply-migration --resource "migration:$FILE"
          scripts/ci/apply-migration.sh "$FILE"
