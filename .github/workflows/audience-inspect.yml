# CF-247 s1298 (S1-Build; design coursefinder-admin #1271 Phase B): read-only audience and identity signals of stored course pages, by provider and URL template.
# Asks the coverage-sweep worker's read-only mode audience_inspect (no model call, no web fetch, no write) through the Management API, as aer-entry-inspect.yml.
name: Audience inspect (read only)
on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Provider names, comma-separated (matched from the start of the canonical name)"
        required: true
      per_template:
        description: "Courses per template (1 to 6)"
        required: false
        default: "3"
      max:
        description: "Courses in all (1 to 160)"
        required: false
        default: "60"
concurrency:
  group: audience-inspect
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect the stored pages
        env:
          IN_PROVIDERS: ${{ inputs.providers }}
          IN_PER: ${{ inputs.per_template }}
          IN_MAX: ${{ inputs.max }}
        run: node scripts/audience-inspect.mjs "$IN_PROVIDERS" "$IN_PER" "$IN_MAX"
      - name: Print the result to the log
        if: ${{ always() }}
        run: |
          if [ -f out/audience-inspect.json ]; then
            gzip -9 -c out/audience-inspect.json | base64 -w 3000 | sed 's/^/AUDIENCE:/'
            echo "AUDIENCE-SHA256:$(sha256sum out/audience-inspect.json | cut -d' ' -f1)"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: audience-inspect
          path: out/
          if-no-files-found: ignore
