# Guards: Platform Admin directive 10 Nov 2026 14:02 (AER source recovery) and G4 database-backed tests: migration 20261110160000 (parked holds no longer use the Layer 4 capacity of the scheduled entry reading, the no_source route, the AER Data Delivery key) runs against its edits, refusals and forward recovery on an isolated PostgreSQL 16 (fixtures only, never a Supabase project).
name: AER source recovery integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261110160000_cf247_aer_source_recovery.sql'
      - 'supabase/held/aer_source_recovery_forward_recovery.sql'
      - 'supabase/migrations/20261107150000_cf247_aer_source_stored_discovery.sql'
      - 'supabase/migrations/20261110150000_cf247_dd_provider_ai_allowance.sql'
      - 'tests/fixtures/aer-source-recovery/**'
      - 'tests/fixtures/pdesc-dd-ai/live/**'
      - '.github/workflows/aer-source-recovery-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/aer-source-recovery/run.sh | tee aer-source-recovery-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aer-source-recovery-database-evidence
          path: aer-source-recovery-results.log
