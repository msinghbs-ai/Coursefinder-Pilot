# Guards: F-AER.02 AER self-healing (Platform Admin 11 Nov 2026 05:42) and G4 database-backed tests: migration 20261111220000 (row-limit cuts follow the shared recovery rule; corrected reads have their own allowance) runs against its edits, refusal and forward recovery on an isolated PostgreSQL 16 (fixtures only, never a Supabase project).
name: AER self-healing integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261111220000_cf247_aer_self_healing_corrections.sql'
      - 'supabase/held/aer_self_healing_corrections_forward_recovery.sql'
      - 'tests/fixtures/aer-self-healing/**'
      - 'tests/fixtures/aer-source-recovery/stubs.sql'
      - 'tests/fixtures/aer-source-recovery/data.sql'
      - 'tests/fixtures/aer-source-recovery/seed_l4.sql'
      - '.github/workflows/aer-self-healing-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/aer-self-healing/run.sh | tee aer-self-healing-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aer-self-healing-database-evidence
          path: aer-self-healing-results.log
