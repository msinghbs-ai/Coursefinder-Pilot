name: CF-092 final source acceptance
on: [push]
permissions:
  contents: write
jobs:
  targeted:
    if: github.ref == 'refs/heads/feature/m245-scheduled-jobs-config-20260910'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Clean remaining Administration scheduling copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/mature-main.jsx')
          s=p.read_text()
          old="Administration:['Administration','Central PIM, source, scheduling, acquisition and platform configuration.']"
          new="Administration:['Administration','Central PIM, source, acquisition and platform configuration.']"
          if old not in s: raise SystemExit('expected Administration description not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Install and targeted acceptance
        run: |
          npm ci
          npm run build
          npx playwright test tests/uat/cf-092-scheduled-jobs-config-contract.spec.mjs --project=chromium-desktop
      - name: Commit cleanup and remove helper
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/cf092-final-source-acceptance.yml
          git add -A
          git commit -m 'CF-092 close Administration scheduling footprint'
          git push origin HEAD:feature/m245-scheduled-jobs-config-20260910
