# Rolled-back live dry run of new migrations (CF-247 S1-Build; Platform Admin 17 Nov 2026 18:25: "run the rolled-back transaction dry run via a
# GitHub Actions workflow against the Management API so it executes non-interactively with zero confirmation prompts").
# Each file runs inside a transaction on the Pilot (repository variable SUPABASE_PROJECT_REF) that always ends in an exception, so nothing is kept
# (scripts/ci/dry-run-migration.sh). Two ways to start it:
#   - a pull request labelled live-dry-run: every migration file the PR adds, in file-name order (re-runs on each push while labelled);
#   - by hand (workflow_dispatch): the files named, with an optional probe expression, after typing the project ref to confirm.
# Pull requests without the label are not touched.
name: Database migration dry run (rolled back)
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['supabase/migrations/*.sql']
  workflow_dispatch:
    inputs:
      files:
        description: "Comma-separated migration files under supabase/migrations, in this order"
        required: true
      probe:
        description: "Optional SQL expression printed with the result (runs inside the rolled-back transaction)"
        required: false
        default: ""
      confirm_project:
        description: "Type the Pilot project ref to confirm"
        required: true
concurrency:
  group: db-migration-dry-run
  cancel-in-progress: false
jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'live-dry-run')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PROBE: ${{ inputs.probe }}
      FILES_INPUT: ${{ inputs.files }}
      CONFIRM: ${{ inputs.confirm_project }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export the production migration history (read only)
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "$REF" ]; then echo "::error::Refused: the typed project ref does not match the Pilot"; exit 1; fi
          mkdir -p out/files
          last=''
          n=0
          while :; do
            q="select coalesce(json_agg(json_build_object('version',version,'name',name,'statements',statements,'created_by',created_by) order by version),'[]'::json) as rows from (select * from supabase_migrations.schema_migrations where version > '$last' order by version limit 120) s"
            jq -n --arg q "$q" '{query:$q, read_only:true}' > q.json
            code=$(curl -sS -o r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @q.json "https://api.supabase.com/v1/projects/$REF/database/query")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then echo "::error::HTTP $code $(head -c 400 r.json)"; exit 1; fi
            jq -c '.[0].rows[]' r.json >> out/history.jsonl || true
            c=$(jq '.[0].rows | length' r.json)
            [ "$c" -gt 0 ] || break
            last=$(jq -r '.[0].rows[-1].version' r.json)
            n=$((n+c)); echo "page to $last ($n rows)"
          done
          total=$(curl -sS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data '{"query":"select count(*)::int n, max(version) m from supabase_migrations.schema_migrations","read_only":true}' "https://api.supabase.com/v1/projects/$REF/database/query")
          echo "exported $n rows; live: $total" | tee -a "$GITHUB_STEP_SUMMARY"
          wc -l out/history.jsonl; gzip -9 -k out/history.jsonl; md5sum out/history.jsonl* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: migration-history
          path: out/history.jsonl.gz
          retention-days: 3
