name: Temporary Lockfile Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: ${{ github.head_ref == 'devops/task1-release-guardrails-20260909' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-bootstrap
          path: package-lock.json
          if-no-files-found: error
