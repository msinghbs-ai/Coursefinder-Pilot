# Database schema dump (read-only). CF-247 production readiness, phase 4 (10 Oct 2026;
# Platform Admin decision "Dump + test project").
# Dumps the live schema (tables, functions, policies, grants; no row data) of the confirmed
# project with the Supabase CLI and commits it to a never-merged branch
# db-schema-dump/<run id>, with the md5 of each file, so the baseline can be built from it
# byte-for-byte. Nothing in the project changes.
# Uses the same secret and project-ref safety check as "Deploy edge functions".
name: Database schema dump
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Type the target project ref to confirm"
        required: true
jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm target project
        run: |
          if [ -z "${{ vars.SUPABASE_PROJECT_REF }}" ]; then echo "Repository variable SUPABASE_PROJECT_REF is not set"; exit 1; fi
          if [ "${{ inputs.project_ref }}" != "${{ vars.SUPABASE_PROJECT_REF }}" ]; then echo "Typed project ref does not match SUPABASE_PROJECT_REF"; exit 1; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump
        run: |
          supabase --version
          supabase link --project-ref "${{ inputs.project_ref }}"
          out=supabase/live-capture/baseline
          mkdir -p "$out"
          supabase db dump --linked -f "$out/schema.sql"
          supabase db dump --linked --role-only -f "$out/roles.sql" || echo "roles dump skipped"
          (cd "$out" && md5sum *.sql > MD5SUMS && wc -c *.sql)
          echo "## Database schema dump" >> "$GITHUB_STEP_SUMMARY"
          cat "$out/MD5SUMS" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to a snapshot branch
        run: |
          branch="db-schema-dump/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add -A supabase/live-capture/baseline
          git commit -q -m "Live database schema dump (run ${{ github.run_id }})"
          git push -q origin "$branch"
          echo "Snapshot branch: $branch" | tee -a "$GITHUB_STEP_SUMMARY"
