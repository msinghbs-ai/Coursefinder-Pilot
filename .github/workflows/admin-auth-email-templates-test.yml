# Guards: Users & roles › Links & Email Templates (Platform Admin 17 Nov 2026 14:40) and G4 database-backed tests: migration 20261117152700 runs its read, save and service functions on an isolated PostgreSQL 16 (fixtures only, never a Supabase project).
name: Admin auth email templates integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261117152700_cf247_admin_auth_email_templates.sql'
      - 'tests/fixtures/admin-auth-email-templates/**'
      - '.github/workflows/admin-auth-email-templates-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/admin-auth-email-templates/run.sh | tee admin-auth-email-templates-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-auth-email-templates-database-evidence
          path: admin-auth-email-templates-results.log
