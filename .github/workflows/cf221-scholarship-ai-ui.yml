name: CF-221 Scholarship AI UI
on:
  push:
    paths: ['.github/workflows/cf221-scholarship-ai-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/ScholarshipRuntimeWorkspace.jsx');s=p.read_text()
          old="import{adminRead,api,supabase}from'./lib/supabase'\nimport'./scholarship-runtime.css'"
          new="import{adminRead,api,supabase}from'./lib/supabase'\nimport ScholarshipAiControl from'./ScholarshipAiControl'\nimport'./scholarship-runtime.css'"
          if s.count(old)!=1: raise SystemExit(f'import anchor count {s.count(old)}')
          s=s.replace(old,new,1)
          old='  </section>\n  <section className="sr-panel"><Header title="Reconcile verified details"'
          new='  </section>\n  <ScholarshipAiControl rank={rank} country={country} onError={onError}/>\n  <section className="sr-panel"><Header title="Reconcile verified details"'
          if s.count(old)!=1: raise SystemExit(f'render anchor count {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/cf221-scholarship-ai-ui.yml
          git config user.name coursefinder-cf221-bot
          git config user.email actions@users.noreply.github.com
          git add src/ScholarshipRuntimeWorkspace.jsx .github/workflows/cf221-scholarship-ai-ui.yml
          git commit -m 'CF-221 wire Scholarship AI controls into operations'
          git push origin HEAD:main
