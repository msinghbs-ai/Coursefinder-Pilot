name: m245-release-21575
on:
  push:
    branches:
      - cf-m245-v2-15-75-stats-ranking-release
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf-m245-v2-15-75-stats-ranking-release
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python .github/scripts/m245_release_21575.py
      - run: npm install --no-package-lock
      - run: npx playwright test tests/uat/m245-stats-ranking-ui-fix.spec.mjs tests/uat/m245-ui-improvements-contract.spec.mjs --reporter=line
      - run: npm run build
      - name: Commit accepted release synchronization
        run: |
          rm -f .github/workflows/m245-release-21575.yml
          rm -f .github/scripts/m245_release_21575.py
          git config user.name coursefinder-ui-bot
          git config user.email coursefinder-ui-bot@users.noreply.github.com
          git add -A
          git commit -m 'M2.4.5 synchronize Statistics ranking correction to v2.15.75'
          git push origin HEAD:cf-m245-v2-15-75-stats-ranking-release
