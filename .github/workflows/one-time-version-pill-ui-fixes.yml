name: One-time version pill UI fixes
on:
  push:
    branches: [cf-m245-version-pill-ui-fixes-20260907]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf-m245-version-pill-ui-fixes-20260907
      - name: Patch version pill
        run: |
          cat > /tmp/patch.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/patch.b64 | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit version pill UI fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/mature-main.jsx src/mature.css src/release-currentness-entry.js
          git commit -m "CF M2.4.5 show UI fixes from version pill [version-pill-fixes]"
          git push
