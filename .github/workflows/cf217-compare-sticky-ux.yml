name: CF-217 Compare sticky headers and persistence
on:
  push:
    paths: ['.github/workflows/cf217-compare-sticky-ux.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply asserted Compare UX patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/ComparisonWorkspace.jsx')
          s=p.read_text()
          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              s=s.replace(old,new,1)

          # CF-216 correction: persist last comparison until explicit clear/removal.
          if "coursefinder:compare-selection:v1" not in s:
              once("const MAX=6\n", "const MAX=6\nconst COMPARE_SELECTION_KEY='coursefinder:compare-selection:v1'\nfunction storedSelection(){try{const x=JSON.parse(localStorage.getItem(COMPARE_SELECTION_KEY)||'null');const type=x?.type==='course'?'course':'provider',ids=Array.isArray(x?.ids)?x.ids.map(String).filter(Boolean).slice(0,MAX):[];return{type,ids}}catch{return{type:'provider',ids:[]}}}\nfunction persistSelection(type,ids){try{localStorage.setItem(COMPARE_SELECTION_KEY,JSON.stringify({type:type==='course'?'course':'provider',ids:[...new Set((ids||[]).map(String).filter(Boolean))].slice(0,MAX)}))}catch{}}\n", 'storage helpers')
              once("function idsFrom(params){return String(params?.get?.('ids')||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,MAX)}", "function idsFrom(params){return String(params?.get?.('ids')||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,MAX)}\nfunction routeSelection(params){const routeIds=idsFrom(params),hasIds=!!params?.has?.('ids'),routeType=params?.get?.('type')==='course'?'course':'provider';if(hasIds)return{type:routeType,ids:routeIds};const saved=storedSelection();return saved.ids.length?saved:{type:params?.has?.('type')?routeType:saved.type,ids:[]}}", 'route helper')
              once(" const initialType=routeParams?.get?.('type')==='course'?'course':'provider'\n const[type,setType]=useState(initialType),[ids,setIds]=useState(()=>idsFrom(routeParams))", " const initialSelection=routeSelection(routeParams),initialType=initialSelection.type\n const[type,setType]=useState(initialType),[ids,setIds]=useState(()=>initialSelection.ids)", 'initial persisted selection')
              once(" useEffect(()=>{const t=routeParams?.get?.('type')==='course'?'course':'provider',nextIds=idsFrom(routeParams);setType(t);setIds(nextIds);if(nextIds.length===1)setViewMode('trend');else if(nextIds.length>1)setViewMode('snapshot')},[routeParams])", " useEffect(()=>{const next=routeSelection(routeParams),t=next.type,nextIds=next.ids;setType(t);setIds(nextIds);if(nextIds.length===1)setViewMode('trend');else if(nextIds.length>1)setViewMode('snapshot')},[routeParams])\n useEffect(()=>{persistSelection(type,ids)},[type,ids.join(',')])", 'route persisted restore')
              once(" function clear(){setQuery('');setSearchRows([]);commitSelection(type,[])}", " function clear(){setQuery('');setSearchRows([]);persistSelection(type,[]);commitSelection(type,[])}", 'explicit clear')

          # CF-217: sticky entity-name header row in long QILT comparison grids.
          once('<div className="cf-compare-label cf-compare-sticky">Selected</div>', '<div className="cf-compare-label cf-compare-sticky cf-compare-top-sticky cf-compare-corner-sticky">Selected</div>', 'sticky selected corner')
          once('<article className="cf-compare-entity" key={e.id}>', '<article className="cf-compare-entity cf-compare-top-sticky" key={e.id}>', 'sticky entity header')
          once('.cf-compare-scroll{overflow:auto}', '.cf-compare-scroll{overflow:auto;max-height:min(68vh,720px);position:relative;scrollbar-gutter:stable}', 'bounded compare scroll')
          once('.cf-compare-sticky{position:sticky;left:0;z-index:4;background:#f8fafc}', '.cf-compare-sticky{position:sticky;left:0;z-index:4;background:#f8fafc}.cf-compare-top-sticky{position:sticky;top:0;z-index:7;background:#fff;box-shadow:0 1px 0 #e5e7eb,0 5px 12px rgba(15,23,42,.04)}.cf-compare-corner-sticky{left:0;z-index:9;background:#f8fafc}', 'sticky header css')
          once('.cf-compare-entity{position:relative;padding:11px 26px 11px 11px;min-height:74px;background:#fff}', '.cf-compare-entity{position:relative;padding:11px 26px 11px 11px;min-height:74px;background:#fff}.cf-compare-top-sticky .cf-compare-entity-head{min-height:42px;align-items:center}', 'sticky entity polish')
          p.write_text(s)
          PY
          grep -q "coursefinder:compare-selection:v1" src/ComparisonWorkspace.jsx
          grep -q "cf-compare-top-sticky" src/ComparisonWorkspace.jsx
          grep -q "max-height:min(68vh,720px)" src/ComparisonWorkspace.jsx
          rm .github/workflows/cf216-compare-selection-persistence.yml 2>/dev/null || true
          rm .github/workflows/cf217-compare-sticky-ux.yml
          git config user.name coursefinder-cf217-bot
          git config user.email actions@users.noreply.github.com
          git add src/ComparisonWorkspace.jsx .github/workflows
          git commit -m 'CF-217 keep provider headers visible in long comparisons'
          git push origin HEAD:main
