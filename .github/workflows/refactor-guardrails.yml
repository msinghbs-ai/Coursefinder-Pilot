name: Architectural Refactor Guardrails

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: architectural-refactor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.head_ref }}
      UAT_EMAIL: ${{ secrets.COURSEFINDER_UAT_EMAIL }}
      UAT_PASSWORD: ${{ secrets.COURSEFINDER_UAT_PASSWORD }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Refactor source contract tests
        run: >-
          npx playwright test
          tests/uat/cf-208-scholarship-pim-maturity-contract.spec.mjs
          tests/uat/m2-5-jobs-workspace-read-path-contract.spec.mjs
          tests/uat/m245-ui-improvements-contract.spec.mjs
          --project=chromium-desktop
      - name: Resolve exact Cloudflare commit preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_HEAD_SHA" ] || [ -z "$PR_HEAD_REF" ]; then
            echo "Pull-request head branch/SHA is unavailable"
            exit 1
          fi
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100"
          short_sha="${PR_HEAD_SHA:0:8}"
          for attempt in $(seq 1 18); do
            comments=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" || true)
            cloudflare=$(printf '%s' "$comments" | jq -r '[.[] | select(.user.login=="cloudflare-workers-and-pages[bot]")] | last | .body // ""' 2>/dev/null || true)
            if printf '%s' "$cloudflare" | grep -Fq 'Deployment successful' \
              && printf '%s' "$cloudflare" | grep -Fq "$short_sha"; then
              preview=$(printf '%s' "$cloudflare" | grep -oE 'https://[a-f0-9]{8}-coursefinder-pilot\.techm\.workers\.dev' | head -n 1 || true)
              if [ -n "$preview" ]; then
                echo "UAT_BASE_URL=$preview" >> "$GITHUB_ENV"
                echo "Resolved exact commit preview $preview for $PR_HEAD_SHA"
                exit 0
              fi
            fi
            echo "Cloudflare exact commit preview not available yet for $short_sha; retry ${attempt}/18"
            sleep 10
          done
          echo "Unable to resolve Cloudflare exact commit preview for $PR_HEAD_SHA"
          exit 1
      - name: Preflight governed UAT credentials
        shell: bash
        run: |
          if [ -z "$UAT_EMAIL" ] || [ -z "$UAT_PASSWORD" ]; then
            echo "Required Actions secrets are missing: COURSEFINDER_UAT_EMAIL / COURSEFINDER_UAT_PASSWORD"
            exit 1
          fi
          case "$UAT_BASE_URL" in
            https://*-coursefinder-pilot.techm.workers.dev) ;;
            *) echo "UAT_BASE_URL must be a governed HTTPS CourseFinder commit preview"; exit 1 ;;
          esac
      - name: Verify exact deployed revision
        shell: bash
        run: |
          for attempt in $(seq 1 18); do
            code=$(curl -L -sS -o /tmp/coursefinder-refactor-home.html -w '%{http_code}' --max-time 12 "$UAT_BASE_URL/?uat_probe=${PR_HEAD_SHA}" || true)
            if [ "$code" = "200" ]; then
              if python - <<'PY'
          import os
          from html.parser import HTMLParser

          class BuildShaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.found = False
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'meta':
                      return
                  values = dict(attrs)
                  if values.get('name') == 'coursefinder-build-sha' and values.get('content') == os.environ['PR_HEAD_SHA']:
                      self.found = True

          parser = BuildShaParser()
          with open('/tmp/coursefinder-refactor-home.html', encoding='utf-8') as handle:
              parser.feed(handle.read())
          raise SystemExit(0 if parser.found else 1)
          PY
              then
                echo "Exact PR head $PR_HEAD_SHA verified on $UAT_BASE_URL"
                exit 0
              fi
            fi
            echo "Exact revision not served yet at $UAT_BASE_URL (HTTP ${code:-none}); retry ${attempt}/18"
            sleep 10
          done
          echo "Commit preview did not serve exact revision $PR_HEAD_SHA"
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Governed bounded UAT
        run: >-
          npx playwright test -c playwright.config.mjs
          tests/uat/m2-4-4-a22-responsive-detail-blades-deployed.spec.mjs
          tests/uat/m2-5-platform-readiness-deployed.spec.mjs
          tests/uat/cf-2-15-74-course-pim-detail-contract-deployed.spec.mjs
