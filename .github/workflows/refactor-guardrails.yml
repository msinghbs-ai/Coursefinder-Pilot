name: Architectural Refactor Guardrails

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: architectural-refactor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UAT_EMAIL: ${{ secrets.COURSEFINDER_UAT_EMAIL }}
      UAT_PASSWORD: ${{ secrets.COURSEFINDER_UAT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Resolve current pull-request preview
        shell: bash
        run: |
          branch='${{ github.head_ref }}'
          if [ -z "$branch" ]; then
            echo "Pull-request head branch is unavailable"
            exit 1
          fi
          slug=$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's#[/._]+#-#g; s#[^a-z0-9-]+#-#g; s#-+#-#g; s#^-+|-+$##g')
          if [ -z "$slug" ]; then
            echo "Unable to derive Cloudflare preview slug from $branch"
            exit 1
          fi
          echo "UAT_BASE_URL=https://${slug}-coursefinder-pilot.techm.workers.dev" >> "$GITHUB_ENV"
          echo "Resolved current PR preview: ${slug}-coursefinder-pilot.techm.workers.dev"
      - name: Preflight governed UAT credentials
        shell: bash
        run: |
          if [ -z "$UAT_EMAIL" ] || [ -z "$UAT_PASSWORD" ]; then
            echo "Required Actions secrets are missing: COURSEFINDER_UAT_EMAIL / COURSEFINDER_UAT_PASSWORD"
            exit 1
          fi
          case "$UAT_BASE_URL" in
            https://*) ;;
            *) echo "UAT_BASE_URL must use HTTPS"; exit 1 ;;
          esac
      - name: Wait for exact branch preview revision
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS -o /tmp/coursefinder-refactor-home.html -w '%{http_code}' --max-time 12 "$UAT_BASE_URL/?uat_probe=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] && cmp -s dist/index.html /tmp/coursefinder-refactor-home.html; then
              echo "Current PR preview matches the locally built index exactly"
              exit 0
            fi
            if [ "$code" = "200" ]; then
              echo "Preview reachable but does not yet match this PR build; retry ${attempt}/12"
            else
              echo "Preview not ready yet (HTTP ${code:-none}); retry ${attempt}/12"
            fi
            sleep 10
          done
          echo "Current PR preview did not serve the exact built revision within the deployment-settle window"
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Governed bounded UAT
        run: >-
          npx playwright test -c playwright.config.mjs
          tests/uat/m2-4-4-a22-responsive-detail-blades-deployed.spec.mjs
          tests/uat/m2-5-platform-readiness-deployed.spec.mjs
