name: Architectural Refactor Guardrails

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: architectural-refactor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      UAT_EMAIL: ${{ secrets.COURSEFINDER_UAT_EMAIL }}
      UAT_PASSWORD: ${{ secrets.COURSEFINDER_UAT_PASSWORD }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Resolve current pull-request preview
        shell: bash
        run: |
          branch='${{ github.head_ref }}'
          if [ -z "$branch" ] || [ -z "$PR_HEAD_SHA" ]; then
            echo "Pull-request head branch/SHA is unavailable"
            exit 1
          fi
          slug=$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's#[/._]+#-#g; s#[^a-z0-9-]+#-#g; s#-+#-#g; s#^-+|-+$##g')
          if [ -z "$slug" ]; then
            echo "Unable to derive Cloudflare preview slug from $branch"
            exit 1
          fi
          echo "UAT_BASE_URL=https://${slug}-coursefinder-pilot.techm.workers.dev" >> "$GITHUB_ENV"
          echo "Resolved current PR preview: ${slug}-coursefinder-pilot.techm.workers.dev"
          echo "PR head: $PR_HEAD_SHA"
      - name: Preflight governed UAT credentials
        shell: bash
        run: |
          if [ -z "$UAT_EMAIL" ] || [ -z "$UAT_PASSWORD" ]; then
            echo "Required Actions secrets are missing: COURSEFINDER_UAT_EMAIL / COURSEFINDER_UAT_PASSWORD"
            exit 1
          fi
          case "$UAT_BASE_URL" in
            https://*) ;;
            *) echo "UAT_BASE_URL must use HTTPS"; exit 1 ;;
          esac
      - name: Wait for Cloudflare deployment of exact PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100"
          short_sha="${PR_HEAD_SHA:0:8}"
          for attempt in $(seq 1 12); do
            comments=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" || true)
            cloudflare=$(printf '%s' "$comments" | jq -r '[.[] | select(.user.login=="cloudflare-workers-and-pages[bot]")] | last | .body // ""' 2>/dev/null || true)
            code=$(curl -L -sS -o /tmp/coursefinder-refactor-home.html -w '%{http_code}' --max-time 12 "$UAT_BASE_URL/?uat_probe=${PR_HEAD_SHA}" || true)
            if printf '%s' "$cloudflare" | grep -Fq 'Deployment successful' \
              && printf '%s' "$cloudflare" | grep -Fq "$short_sha" \
              && printf '%s' "$cloudflare" | grep -Fq "$UAT_BASE_URL" \
              && [ "$code" = "200" ]; then
              echo "Cloudflare confirms exact PR head $PR_HEAD_SHA on $UAT_BASE_URL"
              exit 0
            fi
            echo "Waiting for Cloudflare to confirm exact PR head $short_sha on derived preview; retry ${attempt}/12"
            sleep 10
          done
          echo "Cloudflare did not confirm deployment of exact PR head $PR_HEAD_SHA to $UAT_BASE_URL"
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Governed bounded UAT
        run: >-
          npx playwright test -c playwright.config.mjs
          tests/uat/m2-4-4-a22-responsive-detail-blades-deployed.spec.mjs
          tests/uat/m2-5-platform-readiness-deployed.spec.mjs
