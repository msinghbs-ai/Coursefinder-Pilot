# Guards: CF-247 Operations load speed (Platform Admin P1, 10 Nov 2026) and G4 database-backed tests: migration 20261110020000 and its forward recovery run on an isolated PostgreSQL image (fixtures only, never a Supabase project).
name: Operations load speed integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261110020000_cf247_operations_load_speed.sql'
      - 'supabase/held/operations_load_speed_forward_recovery.sql'
      - 'supabase/held/operations_load_speed_equivalence.sql'
      - 'tests/fixtures/operations-load-speed/**'
      - 'tests/fixtures/lane-funnels/**'
      - 'supabase/migrations/20261108170000_cf247_lane_funnels.sql'
      - 'src/LaneFunnels.jsx'
      - '.github/workflows/operations-load-speed-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/operations-load-speed/run.sh | tee operations-load-speed-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-load-speed-database-evidence
          path: operations-load-speed-results.log
