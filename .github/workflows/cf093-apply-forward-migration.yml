name: CF-093 Apply Forward Migration

on:
  push:
    branches:
      - m245/cf093-async-discovery-20260912
    paths:
      - '.github/workflows/cf093-apply-forward-migration.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m245/cf093-async-discovery-20260912
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link exact Pilot project
        run: supabase link --project-ref fxcwkweaxjtknorudmwp
      - name: Verify pending history before apply
        run: supabase migration list --linked
      - name: Apply repository pending migrations
        run: supabase db push --linked
      - name: Verify parity after apply
        run: supabase migration list --linked
