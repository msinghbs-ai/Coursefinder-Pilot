name: CF-218 harden ranking URL workers

on:
  push:
    paths:
      - 'scripts/cf218_harden_ranking_url_workers.py'
      - '.github/workflows/cf218-private-rpc-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch private pipeline access
        run: python scripts/cf218_harden_ranking_url_workers.py
      - name: Verify private schema is not used through Data API
        run: |
          ! grep -F '.schema("pipeline").from("jobs")' supabase/functions/ranking-qs-url-import/index.ts
          ! grep -F '.schema("pipeline").from("evidence_artifacts")' supabase/functions/ranking-qs-url-import/index.ts
          ! grep -F '.schema("pipeline").from("jobs")' supabase/functions/ranking-the-url-import/index.ts
          ! grep -F '.schema("pipeline").from("evidence_artifacts")' supabase/functions/ranking-the-url-import/index.ts
      - name: Commit hardened workers
        run: |
          if git diff --quiet -- supabase/functions/ranking-qs-url-import/index.ts supabase/functions/ranking-the-url-import/index.ts; then
            echo 'No worker changes required'
            exit 0
          fi
          git config user.name coursefinder-cf218-bot
          git config user.email actions@users.noreply.github.com
          git add supabase/functions/ranking-qs-url-import/index.ts supabase/functions/ranking-the-url-import/index.ts
          git commit -m 'CF-218 harden ranking URL workers behind service RPCs'
          git push origin HEAD:main
