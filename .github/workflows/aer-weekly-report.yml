# AER weekly report copy (CF-247 AER mandate 2 Nov 2026 §14; D-A7, Platform Admin 2 Nov 2026 ~16:40: "Email, copy to be stored in admin
# repo, and admin dashboard"). Monday 08:07 Australia/Sydney: reads security.aer_weekly_markdown_v1() (read-only, as the platform watchdog
# does) and commits docs/platform/aer-weekly/YYYY-MM-DD.md to the branch aer-weekly-snapshot (never merged; copied into the admin repository,
# as the component-register snapshot is). The same report is e-mailed through the existing alert route by job aer-reconcile and shown on
# Coverage & completeness. Switched OFF until the Platform Admin sets the repository variable AER_WEEKLY_REPORT_ENABLED to true.
# Two UTC times cover daylight saving: the run that is not 08:00-08:59 in Sydney stops at once.
name: AER weekly report
on:
  schedule:
    - cron: "7 21 * * 0"
    - cron: "7 22 * * 0"
  workflow_dispatch:
jobs:
  report:
    if: vars.AER_WEEKLY_REPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Monday 08:00 in Sydney only
        id: when
        run: |
          h=$(TZ=Australia/Sydney date +%H); d=$(TZ=Australia/Sydney date +%u)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$d" != "1" ] || [ "$h" != "08" ]; }; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "Not Monday 08:00 in Sydney ($d $h): nothing to do"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
          echo "day=$(TZ=Australia/Sydney date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Check settings
        if: steps.when.outputs.run == 'true'
        run: |
          if [ -z "$REF" ]; then echo "Repository variable SUPABASE_PROJECT_REF is not set"; exit 1; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; fi
      - name: Generate the report
        if: steps.when.outputs.run == 'true'
        run: |
          jq -n '{query: "select security.aer_weekly_markdown_v1() as md", read_only: true}' > "$RUNNER_TEMP/q.json"
          code=$(curl -sS -o "$RUNNER_TEMP/md.json" -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @"$RUNNER_TEMP/q.json")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::error::Report query failed ($code): $(head -c 300 "$RUNNER_TEMP/md.json" | tr -d '\n')"; exit 1; fi
          jq -r '.[0].md' "$RUNNER_TEMP/md.json" > "$RUNNER_TEMP/report.md"
          if [ ! -s "$RUNNER_TEMP/report.md" ] || [ "$(head -c 22 "$RUNNER_TEMP/report.md")" != "# AER weekly report, w" ]; then echo "::error::The report is empty or malformed"; exit 1; fi
          head -12 "$RUNNER_TEMP/report.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit to the snapshot branch
        if: steps.when.outputs.run == 'true'
        run: |
          git config user.name "aer-weekly-report"; git config user.email "aer-weekly-report@users.noreply.github.com"
          git fetch origin aer-weekly-snapshot || true
          if git rev-parse --verify -q origin/aer-weekly-snapshot >/dev/null; then git checkout -B aer-weekly-snapshot origin/aer-weekly-snapshot; else git checkout -B aer-weekly-snapshot; fi
          mkdir -p docs/platform/aer-weekly; cp "$RUNNER_TEMP/report.md" "docs/platform/aer-weekly/${{ steps.when.outputs.day }}.md"
          git add docs/platform/aer-weekly
          git commit -m "AER weekly report ${{ steps.when.outputs.day }}" || echo "No change"
          git push origin aer-weekly-snapshot
