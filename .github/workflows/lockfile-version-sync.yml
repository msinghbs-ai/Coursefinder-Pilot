name: One-time lockfile version sync

on:
  push:
    branches:
      - devops/task1-release-guardrails-20260909
    paths:
      - .github/workflows/lockfile-version-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devops/task1-release-guardrails-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align package-lock release metadata
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          lock.version = pkg.version
          lock.packages[''].version = pkg.version
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n')
          NODE
      - name: Commit lockfile metadata
        run: |
          git config user.name "coursefinder-ci"
          git config user.email "coursefinder-ci@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: align package-lock release version"
          git push origin HEAD:devops/task1-release-guardrails-20260909
