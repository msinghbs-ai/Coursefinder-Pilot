name: m245-release-21574
on:
  push:
    branches:
      - cf-m245-v2-15-74-compare-bugfix-release
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cf-m245-v2-15-74-compare-bugfix-release
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python .github/scripts/m245_release_21574.py
      - run: npm install --no-package-lock
      - run: npx playwright test tests/uat/m245-ui-improvements-contract.spec.mjs tests/uat/m245-compare-ui-bugfix-contract.spec.mjs --reporter=line
      - run: npm run build
      - run: |
          rm .github/workflows/m245-release-21574.yml
          rm .github/scripts/m245_release_21574.py
          git config user.name coursefinder-ui-bot
          git config user.email coursefinder-ui-bot@users.noreply.github.com
          git add -A
          git commit -m 'M2.4.5 synchronize Compare bugfix release to v2.15.74'
          git push origin HEAD:cf-m245-v2-15-74-compare-bugfix-release