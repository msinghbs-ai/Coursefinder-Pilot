name: CF-225 auto-process pending ranking imports
on:
  push:
    paths: ['.github/workflows/cf225-ranking-legacy-autoprocess.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch ranking import legacy auto-processing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/mature-main.jsx')
          s=p.read_text()

          old="<div className=\"m-ranking-history-head\"><div><h3>Ranking import workflow</h3><p>Acquire Evidence → Parse & validate → Apply edition → Review exceptions. All editions remain visible here.</p></div>"
          new="<div className=\"m-ranking-history-head\"><div><h3>Ranking import workflow</h3><p>Acquire Evidence → Layer 1 Ranking ETL validates and applies automatically → mapping exceptions remain traceable separately. All editions remain visible here.</p></div>"
          if old not in s: raise SystemExit('ranking history text not found')
          s=s.replace(old,new,1)

          old="{available&&<button onClick={()=>navigate?.('Statistics & Rankings')}>{x.status==='needs_review'?'Review edition':'View module'}</button>}"
          new="{available&&<button disabled={validating} onClick={()=>x.status==='needs_review'?processImport(x.id,'validate'):navigate?.('Statistics & Rankings')}>{x.status==='needs_review'?(validating?'Processing…':'Process & apply'):'View module'}</button>}"
          if old not in s: raise SystemExit('review edition action not found')
          s=s.replace(old,new,1)

          old="if(action==='validate')setSaved('Evidence parsed and validated. Review reconciliation, then Apply edition when ready.')"
          new="if(action==='validate')setSaved('Layer 1 Ranking ETL validated and applied the imported edition. Mapping exceptions, if any, remain in governed reconciliation.')"
          if old not in s: raise SystemExit('process status text not found')
          s=s.replace(old,new,1)

          old="+' parsed and validated successfully. '+(addingCountryScope?'Existing country scope was preserved; Apply remains manual.':'Change the edition year or add another country scope before running another import.'))"
          new="+' processed successfully through Layer 1 Ranking ETL. '+(addingCountryScope?'Existing country scope was preserved and the edition was reapplied automatically.':'Change the edition year or add another country scope before running another import.'))"
          if old not in s: raise SystemExit('upload success text not found')
          s=s.replace(old,new,1)

          state=" const[form,setForm]=useState(makeForm()),[files,setFiles]=useState([]),[busy,setBusy]=useState(false),[saved,setSaved]=useState(''),[imports,setImports]=useState([]),[detected,setDetected]=useState(null),[advanced,setAdvanced]=useState(false),[processingId,setProcessingId]=useState(''),[lastParsedKey,setLastParsedKey]=useState(''),[overwriteKey,setOverwriteKey]=useState(''),[historySystem,setHistorySystem]=useState('all')\n"
          if state not in s: raise SystemExit('ranking panel state anchor not found')
          effect=" useEffect(()=>{if(busy||processingId||!imports.length)return;const pending=imports.find(x=>['validated','parsed','reconciled','needs_review'].includes(x.status));if(!pending)return;const action=pending.status==='needs_review'?'validate':'apply';const t=setTimeout(()=>processImport(pending.id,action),300);return()=>clearTimeout(t)},[imports,processingId,busy])\n"
          s=s.replace(state,state+effect,1)

          s=s.replace("const UI_VERSION='2.15.69'","const UI_VERSION='2.15.70'",1)
          p.write_text(s)
          p=Path('index.html');s=p.read_text().replace('v2.15.69','v2.15.70');p.write_text(s)
          Path('.github/workflows/cf225-ranking-legacy-autoprocess.yml').unlink()
          PY
          git config user.name coursefinder-cf225-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'CF-225 auto-process pending ranking imports through Layer 1 ETL'
          git push origin HEAD:main
