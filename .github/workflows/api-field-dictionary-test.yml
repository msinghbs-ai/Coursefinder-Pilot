# Guards: REQ-76 API v3 field dictionary sync (Platform Admin 15 Nov 2026, combined build item 1) and G4 database-backed tests: migration 20261116110000 on top of 20261115190000 loads the reviewed field list and runs the sync and drift rules on an isolated PostgreSQL 16 (fixtures only, never a Supabase project).
name: API v3 field dictionary sync integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261115190000_api_v3_additive_schema.sql'
      - 'supabase/migrations/20261116110000_cf247_api_field_dictionary_sync.sql'
      - 'supabase/migrations/20261117061000_cf247_api_field_dictionary_destination.sql'
      - 'supabase/migrations/20261118133717_cf247_api_field_dictionary_course_study_load.sql'
      - 'docs/api/v3/field-dictionary.json'
      - 'scripts/api-v3-field-dictionary.mjs'
      - 'tests/fixtures/api-field-dictionary/**'
      - '.github/workflows/api-field-dictionary-test.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/fixtures/api-field-dictionary/run.sh | tee api-field-dictionary-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-field-dictionary-database-evidence
          path: api-field-dictionary-results.log
